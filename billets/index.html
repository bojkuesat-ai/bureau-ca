<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{--ink:#ffffff;--ink-soft:#c9c3e4;--paper:#000000;--card:#241c46;--line:#3b3170;--gold-dim:#9c7628;--surface2:#2d2456;--bg2:#1b1436;
  --line-2:#2d2456;--stamp:#e8b04b;--stamp-soft:#f0c877;--red:#f2645f;--slate:#a49dc6;--amber:#f2ac3f;--green:#3ccf94;}
html,body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100%;-webkit-font-smoothing:antialiased;margin:0}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
a{color:var(--stamp-soft)}
.serif{font-family:'Fraunces',Georgia,serif}
.mono{font-family:'IBM Plex Mono',monospace}
.f{width:100%;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0}
textarea.f{resize:vertical;min-height:70px;line-height:1.5}
.f:focus{outline:none;border-color:var(--gold-dim);box-shadow:0 0 0 3px rgba(232,176,75,.13)}
input[type=date],input[type=time],input[type=datetime-local]{color-scheme:dark}
label.l{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:12px 0 0}
.btn{border:none;border-radius:11px;padding:11px 16px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(150deg,var(--stamp),var(--gold-dim));color:#241100;box-shadow:0 5px 16px rgba(232,176,75,.24);transition:.15s;text-decoration:none}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{color:var(--stamp-soft);border-color:var(--gold-dim)}
.btn.danger{background:#7a1f1f;color:#fff;border:1px solid #e05555;box-shadow:none}
.btn.ok{background:var(--green);color:#06291b;box-shadow:none}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.link{background:none;border:none;color:var(--slate);font-size:12.5px;font-weight:500;padding:0;text-decoration:underline;text-underline-offset:2px}
.link:hover{color:var(--stamp)}
.empty{text-align:center;color:var(--slate);font-size:13.5px;padding:28px 10px;border:1px dashed var(--line);border-radius:14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.du{font-size:12.5px;color:var(--slate);margin:4px 0;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{font-family:'Fraunces',serif;font-weight:500;font-size:17px;margin:0 0 6px}
.badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:3px 9px;border-radius:20px;white-space:nowrap;font-weight:600;display:inline-block;background:var(--surface2);color:var(--ink-soft);border:1px solid var(--line)}
.badge.ok{background:#0f3d2b;color:#9ff0c9;border-color:#1f6a4a}
.badge.wait{background:#3d2e0f;color:#ffd58a;border-color:#7a5a1f}
.badge.no{background:#3d1416;color:#ffb3b0;border-color:#7a2a2a}
.badge.info{background:#1d2a4a;color:#bcd0ff;border-color:#3a5a9a}
.pill{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:1px 8px;border-radius:20px;background:var(--red);color:#fff;margin-left:6px}
.sw{appearance:none;-webkit-appearance:none;position:relative;flex:0 0 auto;width:42px;height:23px;border-radius:23px;background:var(--surface2);border:1px solid var(--line);cursor:pointer;margin:0;transition:background .18s,border-color .18s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#efeaf8;box-shadow:0 1px 3px rgba(0,0,0,.45);transition:transform .18s}
.sw:checked{background:linear-gradient(150deg,var(--stamp),var(--gold-dim));border-color:var(--gold-dim)}
.sw:checked::after{transform:translateX(19px);background:#fff}
.sw:disabled{opacity:.45;cursor:not-allowed}
.swl{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px;cursor:pointer}
.swl small{display:block;color:var(--slate);font-size:12px}
/* en-tête */
.hd{border-bottom:1px solid var(--line);padding:14px 18px;position:sticky;top:0;background:rgba(0,0,0,.92);backdrop-filter:blur(6px);z-index:50}
.hd-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hd .brand{font-family:'Fraunces',serif;font-size:18px;font-weight:500;display:flex;align-items:center;gap:8px}
.hd .brand .ic{width:28px;height:28px;border-radius:8px;background:linear-gradient(150deg,var(--stamp),var(--gold-dim));display:grid;place-items:center;color:#241100;font-size:15px}
.hd .sp{flex:1}
.hd .who{font-size:12.5px;color:var(--ink-soft)}
.body{max-width:1080px;margin:0 auto;padding:20px 18px 70px}
.titre{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(24px,4.5vw,34px);line-height:1.1;margin:4px 0 6px}
.sub{color:var(--ink-soft);font-size:14px;margin:0 0 14px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:14px 0 18px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{border:1px solid var(--line);border-bottom:none;background:transparent;padding:10px 14px;font-size:13.5px;font-weight:500;color:var(--ink-soft);border-radius:8px 8px 0 0;white-space:nowrap;position:relative;top:1px}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink)}
.tab:hover{color:var(--ink)}
.grp-h{display:flex;align-items:baseline;gap:12px;margin:22px 0 10px}
.grp-h h2{font-family:'Fraunces',serif;font-weight:500;font-size:19px;margin:0}
.grp-h .c{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--slate)}
.grp-h .l{height:1px;flex:1;background:var(--line-2)}
.evt-card{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px;width:100%;text-align:left;color:inherit}
.evt-card:hover{border-color:var(--stamp)}
.evt-card .d{width:46px;height:46px;border-radius:11px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font-family:'IBM Plex Mono',monospace;line-height:1.1}
.evt-card .d b{font-size:17px;color:var(--stamp)}.evt-card .d span{font-size:10px;color:var(--slate);text-transform:uppercase}
.evt-card .m{flex:1;min-width:0}
.evt-card .t{font-weight:600;font-size:15px}
.evt-card .s{font-size:12.5px;color:var(--slate);margin-top:2px}
.lst{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.li .m{flex:1;min-width:0}
.li .n{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis}

  "401": ["401", "Authentification requise", "Vous devez être authentifié pour accéder à cette ressource.", "ERR_UNAUTHORIZED"],

  "408": ["408", "Délai d'attente dépassé", "Le serveur a mis trop de temps à répondre.", "ERR_REQUEST_TIMEOUT"],
  "429": ["429", "Trop de requêtes", "Trop de requêtes ont été envoyées. Réessayez plus tard.", "ERR_TOO_MANY_REQUESTS"],
  "500": ["500", "Erreur serveur", "Une erreur interne est survenue. Réessayez plus tard.", "ERR_INTERNAL_SERVER_ERROR"],

function afficherErreur(code) {
  let o = $("errOverlay");
  const t = ERR_TXT[code];
  if (!t || /admin/.test(location.hash)) { if (o) o.remove(); document.documentElement.style.visibility = ""; return; }
  if (!o) {
    o = document.createElement("div"); o.id = "errOverlay";
    o.style.cssText = "position:fixed;inset:0;z-index:2147483000;background:#fff;color:#222;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px";
    document.body.appendChild(o);
  }
  let ref = ""; for (let i = 0; i < 8; i++) { ref += "0123456789ABCDEF"[Math.floor(Math.random() * 16)]; if (i === 3) ref += "-"; }
  o.innerHTML = `<div><div style="font-size:96px;font-weight:300;line-height:1;color:#333">${t[0]}</div><div style="font-size:22px;margin-top:14px;color:#555">${t[1]}</div><div style="font-size:14px;margin-top:10px;color:#999">${t[2]}</div><div style="font-size:12px;margin-top:22px;color:#bbb;font-family:ui-monospace,Menlo,Consolas,monospace">Code d'erreur : ${t[3]} · Réf. ${ref}</div></div>`;
  document.title = t[0] + " " + t[1];
  document.documentElement.style.visibility = "";
}

/* =====================================================================
   DOUBLE AUTHENTIFICATION (application d'authentification, code à 6 chiffres)
   Pour un compte qui l'a activée (CA › Admin), un code est demandé après le
   mot de passe, sur le CA, la Caisse et la Billetterie (même session).
   Le serveur refuse les données tant que le code n'est pas validé
   (script double_authentification.sql) : cet écran n'est que la porte.
   ===================================================================== */
(function(){
  if(typeof sb==="undefined" || !sb || !sb.auth || !sb.auth.mfa) return;
  var ouvert=false;
  async function niveau(){
    try{ var r=await sb.auth.mfa.getAuthenticatorAssuranceLevel(); if(r && !r.error && r.data) return r.data; }catch(e){}
    return null;
  }
  async function garde(){
    if(ouvert) return true;
    var n=await niveau();
    if(n && n.nextLevel==="aal2" && n.currentLevel!=="aal2"){ afficher(); return true; }
    return false;
  }
  function afficher(){
    if(ouvert) return; ouvert=true;
    var d=document.createElement("div"); d.id="mfaGarde";
    d.style.cssText="position:fixed;inset:0;z-index:2147482000;background:#0b0816;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px";
    d.innerHTML='<div style="width:100%;max-width:380px;background:#241c46;border:1px solid #3b3170;border-radius:16px;padding:24px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.55)">'
      +'<div style="font-size:42px;line-height:1">🔐</div>'
      +'<h2 style="font-family:Fraunces,Georgia,serif;font-weight:500;font-size:22px;margin:10px 0 6px">Double authentification</h2>'
      +'<p style="font-size:14px;color:#c9c3e4;margin:0 0 16px;line-height:1.5">Entrez le code à 6 chiffres affiché dans votre application d\'authentification.</p>'
      +'<input id="mfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" style="width:100%;box-sizing:border-box;font-size:28px;letter-spacing:8px;text-align:center;padding:12px;border-radius:10px;border:1px solid #3b3170;background:#000;color:#fff;font-family:\'IBM Plex Mono\',monospace">'
      +'<p id="mfaErr" style="color:#f2645f;font-size:13px;min-height:18px;margin:10px 0 0"></p>'
      +'<button id="mfaOk" style="width:100%;margin-top:8px;border:none;border-radius:11px;padding:13px;font-size:15px;font-weight:700;background:linear-gradient(150deg,#e8b04b,#9c7628);color:#241100;cursor:pointer">Valider</button>'
      +'<button id="mfaOut" style="margin-top:14px;background:none;border:none;color:#a49dc6;text-decoration:underline;font-size:13px;cursor:pointer">Se déconnecter</button>'
      +'<p style="font-size:11.5px;color:#a49dc6;margin:16px 0 0;line-height:1.5">Téléphone perdu ? Le facteur se supprime dans Supabase › Authentication › Users › votre compte.</p></div>';
    (document.body||document.documentElement).appendChild(d);
    document.documentElement.style.visibility="";
    var champ=d.querySelector("#mfaCode"), err=d.querySelector("#mfaErr"), ok=d.querySelector("#mfaOk");
    async function valider(){
      var code=String(champ.value||"").replace(/\D/g,"");
      if(code.length!==6){ err.textContent="Le code compte 6 chiffres."; return; }
      ok.disabled=true; ok.textContent="Vérification…"; err.textContent="";
      try{
        var f=await sb.auth.mfa.listFactors();
        var fac=f && f.data && f.data.totp && f.data.totp[0];
        if(!fac){ err.textContent="Aucune application enregistrée pour ce compte."; ok.disabled=false; ok.textContent="Valider"; return; }
        var r=await sb.auth.mfa.challengeAndVerify({ factorId:fac.id, code:code });
        if(r && r.error){ err.textContent=/invalid|expired/i.test(r.error.message)?"Code incorrect ou expiré. Réessayez avec le code affiché maintenant.":r.error.message; champ.value=""; champ.focus(); ok.disabled=false; ok.textContent="Valider"; return; }
        location.reload();
      }catch(e){ err.textContent=(navigator.onLine===false)?"Pas de connexion internet.":"Le serveur n'a pas répondu. Réessayez."; ok.disabled=false; ok.textContent="Valider"; }
    }
    ok.addEventListener("click",valider);
    champ.addEventListener("input",function(){ if(String(champ.value).replace(/\D/g,"").length===6) valider(); });
    champ.addEventListener("keydown",function(e){ if(e.key==="Enter") valider(); });
    d.querySelector("#mfaOut").addEventListener("click",async function(){ try{ await sb.auth.signOut({scope:"local"}); }catch(e){} location.reload(); });
    setTimeout(function(){ try{ champ.focus(); }catch(e){} },50);
  }
  window.mfaGarde=garde;
  setTimeout(garde,0);
  /* Pas d'appel Supabase directement dans l'écouteur (risque de blocage) : on diffère. */
  sb.auth.onAuthStateChange(function(evt){ if(evt==="SIGNED_IN"||evt==="INITIAL_SESSION"||evt==="TOKEN_REFRESHED"||evt==="MFA_CHALLENGE_VERIFIED") setTimeout(garde,60); });
})();

const AUDIT_APP = "billets";

/* =====================================================================
   JOURNAL DE SÉCURITÉ — côté app (connexions, onglets, tentatives).
   Les modifications de données sont notées par le serveur lui-même.
   Le compte propriétaire n'est jamais enregistré (décidé par le serveur).
   ===================================================================== */
(function(APP){
  if(typeof sb==="undefined" || !sb || !sb.rpc) return;
  var ID="", LAB="";
  try{ ID=localStorage.getItem("be:appareil-id")||""; if(!ID){ ID="d"+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); localStorage.setItem("be:appareil-id",ID); } }catch(e){ ID=""; }
  (function(){ var u=navigator.userAgent||"";
    var os=/iPhone/.test(u)?"iPhone":/iPad/.test(u)?"iPad":/Android/.test(u)?"Android":/Mac OS X/.test(u)?"Mac":/Windows/.test(u)?"Windows":/Linux/.test(u)?"Linux":"Appareil";
    var nav=/Edg\//.test(u)?"Edge":/OPR\//.test(u)?"Opera":/Firefox\//.test(u)?"Firefox":/CriOS|Chrome\//.test(u)?"Chrome":/Safari\//.test(u)?"Safari":"Navigateur";
    LAB=os+" · "+nav+((window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)?" (app installée)":""); })();
  function noter(cat, action, cible, details){
    try{ sb.rpc("audit_noter",{p_app:APP,p_categorie:cat,p_action:String(action||"").slice(0,300),p_cible:cible?String(cible).slice(0,300):null,
      p_details:details||null,p_appareil:LAB,p_appareil_id:ID||null}).then(function(){},function(){}); }catch(e){}
  }
  function tentative(email, raison){
    try{ sb.rpc("audit_tentative",{p_app:APP,p_email:String(email||"").slice(0,200),p_raison:String(raison||"").slice(0,200),p_appareil:LAB,p_appareil_id:ID||null}).then(function(){},function(){}); }catch(e){}
  }
  function cle(uid){ return "audit:cx:"+APP+":"+uid; }
  var occupe=false;
  async function connexion(type){
    if(occupe) return; occupe=true;
    try{
      var s=await sb.auth.getSession(); var u=s&&s.data&&s.data.session&&s.data.session.user; if(!u) return;
      var n=await sb.auth.mfa.getAuthenticatorAssuranceLevel(); if(n&&n.data&&n.data.nextLevel==="aal2"&&n.data.currentLevel!=="aal2") return;  // après le code
      try{ if(sessionStorage.getItem(cle(u.id))) return; sessionStorage.setItem(cle(u.id),"1"); }catch(e){}
      noter("connexion", type||"Ouverture de l'app");
    }catch(e){}
    finally{ occupe=false; }
  }
  var dernier="";
  window.auditNoter=noter;
  window.auditTentative=tentative;
  window.auditConnexion=function(){ setTimeout(function(){ connexion("Connexion"); },50); };
  window.auditNav=function(nom){ nom=String(nom||""); if(!nom||nom===dernier) return; dernier=nom; noter("navigation","Onglet « "+nom+" »"); };
  sb.auth.onAuthStateChange(function(evt){
    if(evt==="INITIAL_SESSION") setTimeout(function(){ connexion("Ouverture de l'app"); },400);
    if(evt==="SIGNED_IN"||evt==="MFA_CHALLENGE_VERIFIED") setTimeout(function(){ connexion("Connexion"); },400);
    if(evt==="SIGNED_OUT"){ dernier=""; }
  });
})(typeof AUDIT_APP!=="undefined"?AUDIT_APP:"ca");

function ogm() {
  const b = new Uint32Array(2); crypto.getRandomValues(b);
  const n = String(b[0] % 100000).padStart(5, "0") + String(b[1] % 100000).padStart(5, "0");
  const c = (Number(n) % 97) || 97; const d = n + String(c).padStart(2, "0");
  return `+++${d.slice(0, 3)}/${d.slice(3, 7)}/${d.slice(7)}+++`;
}

async function compresserImage(f) {

    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = URL.createObjectURL(f); });
    const max = 1600, r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const b = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.82));
    URL.revokeObjectURL(img.src);
    if (!b || b.size >= f.size) return f;
    return new File([b], f.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
  } catch (e) { return f; }
}

async function chargerBenevole() {
  const b = store.get("benevole", null);
  S.ben = { saisie: !b, err: "" };
  if (b && b.expire && new Date(b.expire) < new Date()) { store.set("benevole", null); S.ben = { saisie: true, err: "Votre code de scan a expiré (fin de la journée de l'événement)." }; }
  else if (b) {
    S.ben.info = b;
    if (enLigne()) {
      try { const { data } = await sb.rpc("bil_scan_acces", { p_scan_code: b.code }); if (!data) { store.set("benevole", null); S.ben = { saisie: true, err: "Ce code de scan n'est plus valable." }; } else { S.ben.info = Object.assign({ code: b.code, depuis: b.depuis || Date.now() }, data); store.set("benevole", S.ben.info); } } catch (e) {}
    }

  if (S.etat.maintenance) { S.mode = "maintenance"; return rendre(); }
  rendre();
  if (!S.ben.saisie) { SC.par = store.get("benevole_nom", "") || "Bénévole"; scanOuvrir({ scanCode: S.ben.info.code, titre: S.ben.info.titre, cle: "ben:" + S.ben.info.id }); scanMajUI(); }

async function demarrerResp() {
  S.mode = "charge"; rendre();
  let session = null;
  try { const { data } = await sb.auth.getSession(); session = data && data.session; } catch (e) {}
  if (!session) { S.mode = "login"; return rendre(); }
  if (window.mfaGarde && await window.mfaGarde()) return;   // double authentification : code demandé avant tout
  // Déconnexion forcée par le propriétaire (CA › Admin › Billetterie).
  const ok = store.get("auth_ok", 0);
  if (S.etat.deco_le && ok && new Date(S.etat.deco_le).getTime() > ok) { S.mode = "login"; S.loginMsg = "Le propriétaire a déconnecté tous les appareils de la Billetterie : reconnectez-vous."; return rendre(); }
  if (!ok) store.set("auth_ok", Date.now());
  S.session = session;
  if (!enLigne()) {
    const c = store.get("cache:moi", null);
    if (c) { S.profil = c.profil; S.comms = c.comms; S.commId = store.get("comm", c.comms[0] && c.comms[0].id); S.evts = store.get("cache:evts:" + S.commId, []); S.mode = "resp"; S.vue = S.vue || "comm"; return rendre(); }
  }
  try {
    const { data: prof } = await sb.from("ca_membres").select("id,prenom,nom,email,fonction,statut,role,via_code").eq("id", session.user.id).maybeSingle();
    S.profil = prof || { id: session.user.id, email: session.user.email };
    const { data: comms, error } = await sb.rpc("bil_mes_commissions");
    if (error) throw error;
    S.comms = comms || [];
  } catch (e) { S.mode = "refus"; S.refus = msgErreur(e); return rendre(); }
  if (S.etat.maintenance) { S.mode = "maintenance"; return rendre(); }
  if (!S.comms.length) {
    S.mode = "refus";
    S.refus = (S.profil && S.profil.statut && S.profil.statut !== "actif") ? "Votre compte n'est pas encore validé dans l'espace CA." : "Aucune commission ne vous est attribuée : l'accès à la Billetterie est réservé aux responsables de commission (organigramme du CA).";
    if (S.vientDeSeConnecter) { try { await sb.auth.signOut({ scope: "local" }); } catch (e) {} S.session = null; }
    return rendre();
  }
  store.set("cache:moi", { profil: S.profil, comms: S.comms });
  S.estOwner = !!(S.comms[0] && S.comms[0].est_owner);
  S.mode = "resp";
  const evParam = S.params.get("ev");
  if (evParam) {
    const { data: ev } = await sb.from("bil_evenements").select("id,commission_id").eq("id", evParam).maybeSingle();
    if (ev) { S.commId = ev.commission_id; await chargerEvts(); return ouvrirEvt(ev.id, S.params.get("onglet") || ""); }
  }
  const pref = store.get("comm", "");
  if (S.comms.length === 1) S.commId = S.comms[0].id;
  else if (pref && S.comms.some((c) => c.id === pref)) S.commId = pref;
  else { S.vue = "choix"; return rendre(); }
  await chargerEvts(); S.vue = "comm"; rendre();
}

/* ---------------- Données ---------------- */
async function chargerEvts() {
  store.set("comm", S.commId);
  if (!enLigne()) { S.evts = store.get("cache:evts:" + S.commId, []); return; }
  const { data, error } = await sb.from("bil_evenements").select("*").eq("commission_id", S.commId).order("date_evt", { ascending: true, nullsFirst: false });
  if (error) { S.evtsErr = msgErreur(error); S.evts = store.get("cache:evts:" + S.commId, []); return; }
  S.evtsErr = "";
  S.evts = data || [];
  try {
    const ids = S.evts.filter((e) => e.statut === "actif").map((e) => e.id);
    S.compteurs = {};
    if (ids.length) {
      const { data: ins } = await sb.from("bil_inscriptions").select("evenement_id,statut").in("evenement_id", ids);
      for (const i of ins || []) { const c = S.compteurs[i.evenement_id] || (S.compteurs[i.evenement_id] = {}); c[i.statut] = (c[i.statut] || 0) + 1; }
    }
  } catch (e) {}
  store.set("cache:evts:" + S.commId, S.evts);
}
async function chargerInscriptions() {
  if (!S.evtId) return;
  if (!enLigne()) { S.insc = store.get("cache:insc:" + S.evtId, S.insc || []); return; }
  const { data, error } = await sb.from("bil_inscriptions").select("*").eq("evenement_id", S.evtId).order("created_at", { ascending: true });
  if (error) { S.inscErr = msgErreur(error); return; }
  S.inscErr = ""; S.insc = data || [];
  store.set("cache:insc:" + S.evtId, S.insc.map((i) => ({ id: i.id, code: i.code, nom: i.nom, prenom: i.prenom, email: i.email, statut: i.statut, entre_le: i.entre_le, source: i.source })));
}
async function rechargerEvt() {
  const { data } = await sb.from("bil_evenements").select("*").eq("id", S.evtId).maybeSingle();
  if (data) { const k = S.evts.findIndex((x) => x.id === data.id); if (k >= 0) S.evts[k] = data; else S.evts.push(data); store.set("cache:evts:" + S.commId, S.evts); }
  return data;
}
/* Mise à jour d'un événement : on vérifie que le serveur a bien enregistré. */
async function majEvt(champs) {
  if (!enLigne()) throw new Error("Pas de connexion internet.");
  const { data, error } = await sb.from("bil_evenements").update(champs).eq("id", S.evtId).select();
  if (error) throw new Error(msgErreur(error));
  if (!data || !data.length) throw new Error("Vous n'êtes pas responsable de cette commission.");
  const k = S.evts.findIndex((x) => x.id === S.evtId); if (k >= 0) S.evts[k] = data[0];
  store.set("cache:evts:" + S.commId, S.evts);
  return data[0];
}

RES.reglComm = async (el) => {
  const c = commCourante(); const v = el.checked;
  const args = { p_cid: c.id, p_pdf_joint: el.dataset.k === "pdf" ? v : null, p_inscriptions_ouvertes: el.dataset.k === "ouv" ? v : null };
  if (!enLigne()) { el.checked = !v; return echec("Pas de connexion internet."); }
  const { data, error } = await sb.rpc("bil_regler_commission", args);
  if (error || !data) { el.checked = !v; return echec(msgErreur(error || "Refusé par le serveur.")); }
  c.pdf_joint = data.pdf_joint; c.inscriptions_ouvertes = data.inscriptions_ouvertes;
  succes(el.dataset.k === "pdf" ? (v ? "Le billet PDF sera joint aux mails." : "Le billet PDF ne sera plus joint aux mails.")
    : (v ? "Les inscriptions de la commission sont ouvertes." : "Les inscriptions de toute la commission sont fermées."));
};
RES.nouvelEvt = async () => {
  let caEvts = [];
  try { const { data } = await sb.from("ca_evenements").select("id,titre,date,lieu").order("date", { ascending: false }).limit(60); caEvts = data || []; } catch (e) {}
  const deja = new Set((S.evts || []).map((e) => e.ca_evenement_id).filter(Boolean));
  const r = await modale({ titre: "Nouvel événement", html: `
    ${caEvts.length ? `<label class="l">Depuis un événement de l'onglet Événements du CA (facultatif)</label><select class="f" id="neCa"><option value="">— événement sans lien avec le CA —</option>${caEvts.map((x) => `<option value="${esc(x.id)}" data-t="${esc(x.titre)}" data-d="${esc(String(x.date || "").slice(0, 10))}" data-l="${esc(x.lieu || "")}">${esc(x.titre)}${x.date ? " — " + esc(dateCourte(x.date)) : ""}${deja.has(String(x.id)) ? " (déjà en billetterie)" : ""}</option>`).join("")}</select>` : ""}
    <label class="l">Nom de l'événement</label><input class="f" id="neT" maxlength="160" placeholder="Ex. Soirée de rentrée">
    <div class="two"><div><label class="l">Date</label><input class="f" id="neD" type="date"></div><div><label class="l">Heure</label><input class="f" id="neH" type="time"></div></div>
    <label class="l">Lieu</label><input class="f" id="neL" placeholder="Ex. Salle Dupréel, ULB">`,
    boutons: [{ t: "Annuler", v: null }, { t: "Créer", v: (d) => ({ ca: d.querySelector("#neCa") ? d.querySelector("#neCa").value : "", t: d.querySelector("#neT").value.trim(), d: d.querySelector("#neD").value, h: d.querySelector("#neH").value, l: d.querySelector("#neL").value.trim() }) }],
    auto: (d) => { const s = d.querySelector("#neCa"); if (s) s.addEventListener("change", () => { const o = s.selectedOptions[0]; if (!o || !o.value) return; d.querySelector("#neT").value = o.dataset.t; d.querySelector("#neD").value = o.dataset.d; d.querySelector("#neL").value = o.dataset.l; }); } });
  if (!r) return;
  if (!r.t) return echec("Donnez un nom à l'événement.");
  const { data, error } = await sb.rpc("bil_creer_evenement", { p_cid: S.commId, p_titre: r.t, p_date: r.d || null, p_lieu: r.l || null, p_heure: r.h || null, p_ca_id: r.ca || null });
  if (error) return echec(msgErreur(error));
  await chargerEvts(); ouvrirEvt(data, "reglages");
  toast("Événement créé");
};

/* ---------------- Événement ---------------- */
async function ouvrirEvt(id, onglet) {
  scanFermer();
  S.evtId = id; S.vue = "evt"; S.onglet = onglet || S.ongletPref || "inscriptions";
  try { auditNav("Événement — " + (((S.evts || []).find((x) => x.id === id) || {}).titre || "")); } catch (e) {} S.insc = store.get("cache:insc:" + id, []); S.filtre = "tous";
  history.replaceState(null, "", APP_URL + "?ev=" + id);
  rendre();
  await chargerInscriptions(); rendre();
}
RES.ouvrirEvt = (el) => ouvrirEvt(el.dataset.id);
RES.retourComm = async () => { scanFermer(); S.vue = "comm"; S.evtId = null; history.replaceState(null, "", APP_URL); await chargerEvts(); rendre(); };
RES.onglet = async (el) => {
  if (S.onglet === "scanner" && el.dataset.o !== "scanner") scanFermer();
  if (S.onglet === "formulaire" && S.fbModif && el.dataset.o !== "formulaire" && !(await confirmer("Le formulaire a des modifications non enregistrées. Les abandonner ?", "Formulaire"))) return;
  if (el.dataset.o !== "formulaire") { S.fb = null; S.fbModif = false; }
  S.onglet = el.dataset.o; S.ongletPref = S.onglet; rendre();
  try { auditNav(el.textContent.trim() + " — " + ((evtCourant() || {}).titre || "")); } catch (e) {}
  if (["inscriptions", "suivi"].includes(S.onglet)) { await chargerInscriptions(); rendreEnPreservant(); }
};
function vueEvt() {
  const e = evtCourant(); if (!e) return `<div class="empty">Événement introuvable. <button class="link" data-a="retourComm">Retour</button></div>`;
  const I = S.insc || [];
  const n = (st) => I.filter((i) => i.statut === st).length;
  const ong = [["inscriptions", "Inscriptions", n("a_valider")], ["suivi", "Suivi", 0], ["scanner", "Scanner", 0], ["formulaire", "Formulaire", 0], ["reglages", "Réglages", 0], ["bilan", "Bilan", 0]];
  const res = n("inscrit") + n("a_valider");
  let corps = "";
  if (S.onglet === "suivi") corps = vueSuivi(e);
  else if (S.onglet === "scanner") corps = vueScannerEvt(e);
  else if (S.onglet === "formulaire") corps = vueFormulaire(e);
  else if (S.onglet === "reglages") corps = vueReglages(e);
  else if (S.onglet === "bilan") corps = vueBilan(e);
  else corps = vueInscriptions(e);
  return `<button class="link" data-a="retourComm">← ${esc((commCourante() || {}).nom || "Commission")}</button>
    <h1 class="titre">${esc(e.titre)}</h1>
    <p class="sub">${esc(infosLigne(e) || "Date et lieu à fixer (onglet Réglages)")} · organisé par la commission ${esc((commCourante() || {}).nom || "")}<br>
      ${e.places ? `${res} / ${e.places} places` : `${n("inscrit")} inscrit·e(s)`} · ${e.payant ? "payant " + eur(e.prix) : "gratuit"}${e.statut !== "actif" ? " · <b>archivé</b>" : ""}</p>
    <div class="card" style="padding:11px 13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="mono" style="font-size:12.5px;color:var(--stamp);word-break:break-all;flex:1;min-width:200px">${esc(lienInscription(e))}</span>
      <button class="btn sm" data-a="copierLien">Copier</button><button class="btn ghost sm" data-a="qrInscription">QR d'inscription</button><button class="btn ghost sm" data-a="affiche">Affiche</button></div>
    ${S.inscErr ? `<div class="alerte">${esc(S.inscErr)}</div>` : ""}
    <div class="tabs">${ong.map(([k, l, b]) => `<button class="tab" aria-selected="${S.onglet === k}" data-a="onglet" data-o="${k}">${l}${b ? `<span class="pill">${b}</span>` : ""}</button>`).join("")}</div>${corps}`;
}
RES.copierLien = async () => { const ok = await copier(lienInscription(evtCourant())); toast(ok ? "Lien copié" : "Copie impossible : sélectionnez le lien à la main"); };
RES.qrInscription = () => {
  const e = evtCourant(), l = lienInscription(e);
  modale({ titre: "QR d'inscription", html: `<p class="du">${esc(e.titre)} — ce QR et ce lien ne changent jamais.</p><div id="qrInsc" style="background:#fff;border-radius:12px;padding:12px;width:fit-content;margin:8px auto"></div><p class="mono centre" style="font-size:12px;word-break:break-all;color:var(--stamp)">${esc(l)}</p>`,
    boutons: [{ t: "Fermer", v: null }, { t: "Imprimer", v: "print" }, { t: "Télécharger", v: "dl" }],
    auto: (d) => { const c = qrCanvas(l, 300, { level: "Q" }); d.querySelector("#qrInsc").appendChild(c); } }).then((v) => {
    const c = qrCanvas(l, 900, { level: "Q", padding: 40 });
    if (v === "dl") c.toBlob((b) => telecharger(b, "qr-inscription-" + sansAccents(e.titre).replace(/[^a-z0-9]+/g, "-").slice(0, 30) + ".png"));
    if (v === "print") imprimer(`<h1 style="font-size:30px;margin:0 0 6px">${esc(e.titre)}</h1><p style="font-size:16px;margin:0 0 20px">Organisé par la commission ${esc((commCourante() || {}).nom || "")}<br>${esc(infosLigne(e))}</p><img src="${c.toDataURL()}" style="width:340px;height:340px"><p style="font-size:20px;font-weight:bold;margin:16px 0 4px">Inscris-toi en scannant ce QR</p><p style="font-size:13px">${esc(l)}</p>`);
  });
};
RES.affiche = () => {
  const e = evtCourant();
  if (!(window.jspdf && window.jspdf.jsPDF)) return info("Le module PDF n'est pas chargé. Vérifiez votre connexion.");
  const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
  doc.setFillColor(36, 28, 70); doc.rect(0, 0, 210, 297, "F");
  doc.setFillColor(232, 176, 75); doc.rect(0, 0, 210, 8, "F");
  doc.setTextColor(232, 176, 75); doc.setFont("helvetica", "normal"); doc.setFontSize(13);
  doc.text(pdfTxt("BUREAU ÉTUDIANT · FACULTÉ DE DROIT ET DE CRIMINOLOGIE"), 105, 26, { align: "center" });
  doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(38);
  const t = doc.splitTextToSize(pdfTxt(e.titre), 180).slice(0, 3); doc.text(t, 105, 52, { align: "center", lineHeightFactor: 1.1 });
  let y = 52 + t.length * 16;
  doc.setFont("helvetica", "normal"); doc.setFontSize(15); doc.setTextColor(201, 195, 228);
  doc.text(pdfTxt("Organisé par la commission " + ((commCourante() || {}).nom || "")), 105, y, { align: "center" }); y += 14;
  doc.setTextColor(255, 255, 255); doc.setFontSize(19);
  if (e.date_evt) { doc.text(pdfTxt(dateLongue(e.date_evt) + (e.heure_debut ? " · " + hm(e.heure_debut) : "")), 105, y, { align: "center" }); y += 10; }
  if (e.lieu) { doc.text(pdfTxt(doc.splitTextToSize(e.lieu, 180)[0]), 105, y, { align: "center" }); y += 10; }
  if (e.payant) { doc.setTextColor(232, 176, 75); doc.text(pdfTxt(eur(e.prix)), 105, y, { align: "center" }); y += 10; }
  const c = qrCanvas(lienInscription(e), 900, { level: "Q", padding: 30 });
  doc.setFillColor(255, 255, 255); doc.roundedRect(55, Math.max(y + 6, 150), 100, 100, 6, 6, "F");
  doc.addImage(c.toDataURL("image/png"), "PNG", 58, Math.max(y + 6, 150) + 3, 94, 94);
  doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(20);
  doc.text(pdfTxt("Inscris-toi : scanne le QR"), 105, Math.max(y + 6, 150) + 116, { align: "center" });
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(201, 195, 228);
  doc.text(lienInscription(e), 105, Math.max(y + 6, 150) + 124, { align: "center" });
  doc.save("affiche-" + sansAccents(e.titre).replace(/[^a-z0-9]+/g, "-").slice(0, 30) + ".pdf");
};

/* ---------------- Onglet Réglages ---------------- */
function vueReglages(e) {
  const c = commCourante() || {};
  const raison = !c.inscriptions_ouvertes ? "fermées pour toute la commission" : !e.inscriptions_ouvertes ? "fermées" : (e.ouverture && new Date(e.ouverture) > new Date()) ? "ouvriront le " + quand(e.ouverture) : (e.fermeture && new Date(e.fermeture) <= new Date()) ? "fermées depuis le " + quand(e.fermeture) : "ouvertes";
  return `<div class="card"><h3>Infos pratiques</h3><p class="du">Elles apparaissent sur la page d'inscription et dans tous les mails.</p>
      <label class="l">Nom de l'événement</label><input class="f" id="rgT" maxlength="160" value="${esc(e.titre)}">
      <div class="three"><div><label class="l">Date</label><input class="f" id="rgD" type="date" value="${esc(e.date_evt || "")}"></div>
        <div><label class="l">Heure de début</label><input class="f" id="rgH" type="time" value="${esc((e.heure_debut || "").slice(0, 5))}"></div>
        <div><label class="l">Heure de fin (facultatif)</label><input class="f" id="rgH2" type="time" value="${esc((e.heure_fin || "").slice(0, 5))}"></div></div>
      <label class="l">Lieu</label><input class="f" id="rgL" value="${esc(e.lieu || "")}" placeholder="Ex. Salle Dupréel, ULB — Av. Jeanne 44">
      <label class="l">Infos complémentaires (facultatif)</label><textarea class="f" id="rgI" rows="3" placeholder="Ex. dress code, accès, à apporter…">${esc(e.infos || "")}</textarea>
      <div class="row"><button class="btn sm" data-a="sauverInfos">Enregistrer les infos pratiques</button></div></div>
    <div class="card"><h3>Places et tarif</h3>
      <label class="l">Nombre de places (vide ou 0 = illimité)</label><div class="row"><input class="f" id="rgP" type="number" min="0" style="max-width:160px" value="${e.places || ""}"><button class="btn sm" data-a="sauverPlaces">Enregistrer</button></div>
      <p class="du">Complet : les nouvelles inscriptions passent en liste d'attente. Quand une place se libère, la première personne en attente passe automatiquement et reçoit un mail.</p>
      <label class="l">Prix (€) — un seul tarif</label><div class="row"><input class="f" id="rgPrix" inputmode="decimal" placeholder="Ex. 12,50" style="max-width:160px" value="${e.prix != null ? String(Number(e.prix)).replace(".", ",") : ""}"><button class="btn ghost sm" data-a="sauverPrix">Enregistrer le prix</button></div>
      <label class="swl" style="margin-top:12px"><input type="checkbox" class="sw" id="rgPayant" data-ch="basculePayant" ${e.payant ? "checked" : ""}><span><b>Payant</b><small>Activé : le formulaire demande une preuve de paiement (obligatoire) et affiche le QR de virement. Le billet part après validation de la preuve.</small></span></label></div>
    <div class="card"><h3>Inscriptions</h3><p class="du">Actuellement : <b>${esc(raison)}</b>.</p>
      <label class="swl"><input type="checkbox" class="sw" data-ch="basculeOuvert" ${e.inscriptions_ouvertes ? "checked" : ""}><span>Inscriptions ouvertes pour cet événement</span></label>
      <div class="two"><div><label class="l">Ouverture programmée (facultatif)</label><input class="f" id="rgO" type="datetime-local" value="${esc(versLocalInput(e.ouverture))}"></div>
        <div><label class="l">Fermeture programmée (facultatif)</label><input class="f" id="rgF" type="datetime-local" value="${esc(versLocalInput(e.fermeture))}"></div></div>
      <p class="du">Sans fermeture programmée, les inscriptions se ferment à la fin du jour de l'événement.</p>
      <div class="row"><button class="btn sm" data-a="sauverProg">Enregistrer la programmation</button></div></div>
    <div class="card"><h3>Mails automatiques</h3>
      <label class="swl"><input type="checkbox" class="sw" data-ch="basculeAuto" data-k="rappel_auto" ${e.rappel_auto ? "checked" : ""}><span>Rappel la veille de l'événement<small>Envoyé à partir de 10 h aux inscrit·es.</small></span></label>
      <label class="swl"><input type="checkbox" class="sw" data-ch="basculeAuto" data-k="sondage_auto" ${e.sondage_auto ? "checked" : ""}><span>Sondage de satisfaction le lendemain<small>Trois questions + commentaire ; résultats dans l'onglet Bilan.</small></span></label></div>
    <div class="card"><h3>Code de scan des bénévoles</h3>
      <p class="du">Pour les personnes hors CA qui scannent à l'entrée : ce code permet <b>uniquement</b> de scanner les billets de cet événement (et de chercher un nom). Il expire à la fin de la journée de l'événement.</p>
      ${e.scan_code ? `<p style="font-size:26px;letter-spacing:4px;margin:8px 0" class="mono">${esc(e.scan_code.slice(0, 4) + "-" + e.scan_code.slice(4))}</p>
        <p class="du">À ouvrir sur le téléphone : <span class="mono" style="color:var(--stamp)">${esc(APP_URL)}?scan</span></p>
        <div class="row"><button class="btn sm" data-a="copierScan">Copier le lien et le code</button><button class="btn ghost sm" data-a="genScan">Changer le code</button><button class="btn ghost sm" data-a="retirerScan">Désactiver</button></div>`
      : `<div class="row"><button class="btn sm" data-a="genScan">Générer un code</button></div>`}</div>
    <div class="card"><h3>Vérifier avant le jour J</h3><p class="du">Contrôle automatique : connexion au serveur, droits, infos pratiques, scanner (caméra, liste hors ligne) et envoi d'un mail de test à votre adresse.</p>
      <div class="row"><button class="btn sm" data-a="verifier">Lancer la vérification</button></div><div id="verifRes"></div></div>
    <div class="card"><h3>Archive</h3>
      <div class="row">${e.statut === "actif" ? `<button class="btn ghost sm" data-a="archiver">Archiver l'événement</button>` : `<button class="btn ghost sm" data-a="desarchiver">Réactiver l'événement</button>`}
      <button class="btn danger sm" data-a="supprimerEvt">Supprimer l'événement</button></div>
      <p class="du">Archivé : il quitte la liste principale ; ses statistiques restent consultables. La suppression n'est possible que sans aucune inscription.</p></div>`;
}
RES.sauverInfos = async () => {
  const t = $("rgT").value.trim(); if (!t) return echec("Le nom de l'événement est vide.");
  try { await majEvt({ titre: t, date_evt: $("rgD").value || null, heure_debut: $("rgH").value || null, heure_fin: $("rgH2").value || null, lieu: $("rgL").value.trim() || null, infos: $("rgI").value.trim() || null }); }
  catch (e) { return echec(e.message); }
  rendre(); succes("Les infos pratiques sont enregistrées. Elles apparaissent tout de suite sur la page d'inscription et dans les prochains mails.");
};
RES.sauverPlaces = async () => {
  const v = $("rgP").value.trim(), n = v === "" ? null : Math.max(0, parseInt(v, 10) || 0);
  try { await majEvt({ places: n || null }); } catch (e) { return echec(e.message); }
  const r = await appelFn({ action: "liberer", evenement_id: S.evtId });
  await chargerInscriptions(); rendre();
  succes((n ? n + " places." : "Places illimitées.") + (r.promus ? "\n" + r.promus + " personne(s) de la liste d'attente ont reçu une place." : ""));
};
RES.sauverPrix = async () => {
  const v = $("rgPrix").value.trim(); const p = v === "" ? null : Math.round(parseFloat(v.replace(",", ".")) * 100) / 100;
  const e = evtCourant();
  if (e.payant && !(p > 0)) return echec("Un événement payant doit avoir un prix. Désactivez d'abord « Payant ».");
  try { await majEvt({ prix: p }); } catch (er) { return echec(er.message); }
  rendre(); succes(p ? "Prix : " + eur(p) + "." : "Prix retiré.");
};
RES.basculePayant = async (el) => {
  const e = evtCourant(), v = el.checked;
  const prixSaisi = parseFloat(String(($("rgPrix") || {}).value || "").replace(",", "."));
  const champs = { payant: v };
  if (v && !(Number(e.prix) > 0)) { if (prixSaisi > 0) champs.prix = Math.round(prixSaisi * 100) / 100; else { el.checked = !v; return echec("Indiquez d'abord le prix de l'événement (un seul tarif), puis réactivez « Payant ».", "Prix manquant"); } }
  try { await majEvt(champs); } catch (er) { el.checked = !v; return echec(er.message); }
  rendre();
  succes(v ? `L'événement « ${e.titre} » est maintenant payant (${eur(evtCourant().prix)}). La page d'inscription demande désormais une preuve de paiement et affiche le QR de virement. Le lien ne change pas.`
    : `L'événement « ${e.titre} » est maintenant gratuit. La page d'inscription ne demande plus de preuve de paiement. Le lien ne change pas.`, "Enregistré");
};
RES.basculeOuvert = async (el) => {
  const v = el.checked;
  try { await majEvt({ inscriptions_ouvertes: v }); } catch (er) { el.checked = !v; return echec(er.message); }
  rendre(); succes(v ? "Les inscriptions de cet événement sont ouvertes." : "Les inscriptions de cet événement sont fermées.");
};
RES.basculeAuto = async (el) => {
  const v = el.checked;
  try { await majEvt({ [el.dataset.k]: v }); } catch (er) { el.checked = !v; return echec(er.message); }
  toast("Enregistré");
};
RES.sauverProg = async () => {
  const o = depuisLocalInput($("rgO").value), f = depuisLocalInput($("rgF").value);
  if (o && f && new Date(f) <= new Date(o)) return echec("La fermeture doit être après l'ouverture.");
  try { await majEvt({ ouverture: o, fermeture: f }); } catch (er) { return echec(er.message); }
  rendre(); succes([o ? "Ouverture : " + quand(o) : "Pas d'ouverture programmée", f ? "Fermeture : " + quand(f) : "Pas de fermeture programmée"].join("\n"));
};
RES.genScan = async () => {
  const e = evtCourant();
  if (e.scan_code && !(await confirmer("Changer le code ? L'ancien ne fonctionnera plus sur les téléphones des bénévoles.", "Code de scan"))) return;
  const { data, error } = await sb.rpc("bil_scan_code_generer", { p_eid: e.id });
  if (error) return echec(msgErreur(error));
  e.scan_code = data; rendre(); succes("Code de scan : " + data.slice(0, 4) + "-" + data.slice(4) + "\nIl expire à la fin de la journée de l'événement.", "Code généré");
};
RES.retirerScan = async () => {
  if (!(await confirmer("Désactiver le code ? Les bénévoles ne pourront plus scanner.", "Code de scan"))) return;
  const { error } = await sb.rpc("bil_scan_code_retirer", { p_eid: S.evtId }); if (error) return echec(msgErreur(error));
  evtCourant().scan_code = null; rendre();
};
RES.copierScan = async () => { const e = evtCourant(); const ok = await copier(`Scanner à l'entrée de « ${e.titre} » : ouvrez ${APP_URL}?scan et entrez le code ${e.scan_code.slice(0, 4)}-${e.scan_code.slice(4)}`); toast(ok ? "Copié" : "Copie impossible"); };
RES.archiver = async () => { if (!(await confirmer("Archiver cet événement ? Les inscriptions se ferment ; les statistiques restent consultables.", "Archiver"))) return; try { await majEvt({ statut: "archive" }); } catch (er) { return echec(er.message); } rendre(); toast("Événement archivé"); };
RES.desarchiver = async () => { try { await majEvt({ statut: "actif" }); } catch (er) { return echec(er.message); } rendre(); toast("Événement réactivé"); };
RES.supprimerEvt = async () => {
  const e = evtCourant();

async function signerUrl(chemin) {
  S.urls = S.urls || {};

  const { data, error } = await sb.storage.from("billets").createSignedUrl(chemin, 900);
  if (error || !data) return "";
  S.urls[chemin] = { u: data.signedUrl, t: Date.now() };
  return data.signedUrl;
}
async function chargerApercus() {

    if (el.tagName === "IMG") { el.src = u; el.parentElement && el.parentElement.setAttribute("href", u); }

}

function lignesCollees(t) {
  const out = [];
  for (const brut of String(t || "").split(/\r?\n/)) {
    const l = brut.trim(); if (!l) continue;
    const m = l.match(/[^\s,;<>()"']+@[^\s,;<>()"']+\.[a-z]{2,}/i); const mail = m ? m[0].toLowerCase() : "";
    const reste = l.replace(m ? m[0] : "", "").replace(/[<>()"]/g, " ");
    const p = reste.split(/[,;\t]+/).map((x) => x.trim()).filter(Boolean);
    let nom = p[0] || "", prenom = p[1] || "";
    if (p.length === 1) { const w = p[0].split(/\s+/); prenom = w.shift() || ""; nom = w.join(" "); }
    out.push({ nom, prenom, email: mail });
  }
  return out;
}

/* Envois groupés : par lots, avec suivi de la progression. */
async function envoiGroupe(action, titre, extra = {}) {
  let total = 0, echecs = [], tour = 0, via = "", erreur = "";
  const d = document.createElement("div"); d.className = "ca-mod";
  d.innerHTML = `<div class="ca-mod-box"><h3>${esc(titre)}</h3><p id="egTxt">Envoi en cours…</p><div class="bar"><i id="egBar" style="width:5%"></i></div></div>`;
  document.body.appendChild(d);
  try {
    while (tour++ < 40) {
      const r = await appelFn(Object.assign({ action, evenement_id: S.evtId }, extra));
      if (!r.ok) { erreur = r.erreur || "Échec."; break; }
      total += r.envoyes; echecs = echecs.concat(r.echecs || []); via = r.via || via; if (r.erreur) erreur = r.erreur;
      d.querySelector("#egTxt").textContent = total + " envoyé(s)" + (r.restants ? ", " + r.restants + " restant(s)…" : "");
      d.querySelector("#egBar").style.width = r.restants ? Math.min(95, 100 * total / (total + r.restants)) + "%" : "100%";
      if (!r.restants || extra.ids) break;
    }
  } finally { d.remove(); }
  await chargerInscriptions(); rendre();
  if (!total && !echecs.length && !erreur) return info("Personne à qui envoyer ce message.", titre);
  (echecs.length || (erreur && !total) ? echec : succes)(total + " mail(s) envoyé(s)." + (echecs.length ? "\n\nÉchecs (" + echecs.length + ") :\n" + echecs.slice(0, 15).join("\n") + (erreur ? "\n\nRaison : " + erreur : "") : (erreur && !total ? "\n\n" + erreur : "")), titre);
}

      <div class="card">${[5, 4, 3, 2, 1].map((n) => `<div class="row" style="gap:10px;font-size:13px"><span style="width:28px">${n} ★</span><div class="bar" style="flex:1"><i style="width:${so.n ? 100 * dist(n) / so.n : 0}%"></i></div><span style="width:24px">${dist(n)}</span></div>`).join("")}</div>

      : `<div class="empty">${e.sondage_auto ? "Le sondage part automatiquement le lendemain de l'événement." : "Sondage automatique désactivé (onglet Réglages)."}</div>`}
    <div class="grp-h"><h2>Comparaison avec les événements de la commission</h2><span class="l"></span></div>
    <div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="color:var(--slate);text-align:left"><th style="padding:6px">Événement</th><th>Date</th><th>Inscrit·es</th><th>Présent·es</th><th>Taux</th><th>Note</th></tr>
      ${S.bilan.comp.map((c) => { const t = c.stats || {}; return `<tr style="border-top:1px solid var(--line);${c.id === e.id ? "color:var(--stamp)" : ""}"><td style="padding:6px">${esc(c.titre)}</td><td>${esc(c.date_evt ? dateCourte(c.date_evt) + " " + String(c.date_evt).slice(0, 4) : "—")}</td><td>${t.inscrits || 0}</td><td>${t.presents || 0}</td><td>${t.inscrits ? Math.round(100 * t.presents / t.inscrits) + " %" : "—"}</td><td>${t.sondage && t.sondage.n ? t.sondage.note + "/5" : "—"}</td></tr>`; }).join("")}</table></div>`;
}
RES.bilanRecharger = () => { S.bilan = null; rendre(); };
RES.bilanMail = async () => { if (!(await confirmer("Envoyer le bilan de l'événement par mail aux responsables de la commission (et à vous) ?", "Bilan"))) return;
  const r = await appelFn({ action: "bilan", evenement_id: S.evtId }); if (!r.ok) return echec(r.erreur || "Envoi impossible."); succes(r.envoyes + " mail(s) envoyé(s).", "Bilan envoyé"); };
RES.recettes = async () => {
  const e = evtCourant(), s = S.bilan.stats;
  if (!(await confirmer(`Créer dans la Caisse une recette de ${eur(s.recettes)} (« Billetterie — ${e.titre} », ${s.payes} paiement(s) validé(s), méthode virement, catégorie Billetterie) ?\n\nUne seule fois par événement.`, "Recettes vers la Caisse"))) return;
  const { data, error } = await sb.rpc("bil_envoyer_recettes", { p_eid: e.id });
  if (error) return echec(msgErreur(error));
  await rechargerEvt(); S.bilan = null; rendre();
  succes(`Recette de ${eur(data.montant)} créée dans la Caisse (${data.nombre} paiement(s)).`, "Recettes envoyées");
};

/* =====================================================================
   FORMULAIRE D'INSCRIPTION (paramétrable, un par événement)
   ===================================================================== */
function fbEtat(e) {
  if (!S.fb || S.fb.pour !== e.id) S.fb = { pour: e.id, champs: JSON.parse(JSON.stringify(e.formulaire || [])), coopt: Object.assign({ actif: false, libelle: "" }, e.cooptation || {}) };
  return S.fb;
}
function nouvelId(l) { let k; do { k = "c" + Math.random().toString(36).slice(2, 7); } while (l.some((c) => c.id === k)); return k; }
function vueFormulaire(e) {
  const F = fbEtat(e);
  const ch = F.champs.map((c, k) => `<div class="fb" data-idx="${k}">
      <div class="top"><select class="f" style="width:auto;flex:none" data-ch="fbType" data-k="${k}">${Object.entries(TYPES_CHAMPS).map(([v, t]) => `<option value="${v}" ${c.type === v ? "selected" : ""}>${t}</option>`).join("")}</select>
        <input class="f" style="flex:1;min-width:180px" placeholder="Intitulé (ex. Régime alimentaire)" value="${esc(c.label || "")}" data-in="fbChamp" data-k="${k}" data-p="label" maxlength="200">
        <button class="ico" data-a="fbMonter" data-k="${k}" ${k === 0 ? "disabled" : ""} title="Monter">↑</button><button class="ico" data-a="fbDescendre" data-k="${k}" ${k === F.champs.length - 1 ? "disabled" : ""} title="Descendre">↓</button>
        <button class="ico" data-a="fbSuppr" data-k="${k}" title="Retirer" style="color:var(--red)">✕</button></div>
      <input class="f" placeholder="Aide facultative (texte sous l'intitulé)" value="${esc(c.aide || "")}" data-in="fbChamp" data-k="${k}" data-p="aide" maxlength="300">
      ${c.type === "choix_unique" || c.type === "choix_multiple" ? `<textarea class="f" rows="3" placeholder="Options — une par ligne" data-in="fbChamp" data-k="${k}" data-p="options">${esc((c.options || []).join("\n"))}</textarea>` : ""}
      <label class="swl" style="margin:4px 0 0"><input type="checkbox" class="sw" data-ch="fbRequis" data-k="${k}" ${c.requis ? "checked" : ""}><span>${c.requis ? "Obligatoire" : "Facultatif"}</span></label></div>`).join("");
  return `<div class="note">Toujours présents, non retirables : <b>nom, prénom, e-mail</b>${e.payant ? ", <b>preuve de paiement</b> (événement payant)" : ""} et la <b>case RGPD</b>, dont le texte liste automatiquement les données demandées.</div>
    ${ch || `<div class="empty">Aucun champ en plus. Ajoutez-en ci-dessous.</div>`}
    <div class="row" style="margin:10px 0 4px"><select class="f" id="fbNouveau" style="width:auto">${Object.entries(TYPES_CHAMPS).map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select><button class="btn ghost sm" data-a="fbAjouter">＋ Ajouter un champ</button></div>
    <div class="card" style="margin-top:14px"><h3>Case « Cooptation » (facultative)</h3>
      <label class="swl"><input type="checkbox" class="sw" data-ch="fbCoopt" ${F.coopt.actif ? "checked" : ""}><span>Afficher la case dans le formulaire</span></label>
      ${F.coopt.actif ? `<input class="f" maxlength="200" placeholder="Je souhaite rejoindre…" value="${esc(F.coopt.libelle || "")}" data-in="fbCooptTxt">` : ""}
      <p class="du">Les personnes qui la cochent apparaissent dans Suivi › filtre « Cooptation » (et l'export dédié).</p></div>
    <div class="row" style="position:sticky;bottom:0;background:rgba(0,0,0,.9);padding:12px 0;margin-top:6px;border-top:1px solid var(--line)">
      <button class="btn" data-a="fbEnregistrer">Enregistrer</button><button class="btn ghost" data-a="fbApercu">👁 Aperçu</button>
      ${S.fbModif ? `<span class="du" style="color:var(--amber)">Modifications non enregistrées</span><button class="link" data-a="fbAnnuler">Annuler les modifications</button>` : ""}</div>`;
}
const fbModifie = () => { if (!S.fbModif) { S.fbModif = true; rendreEnPreservantForce(); } };
function rendreEnPreservantForce() { const y = window.scrollY, a = document.activeElement, id = a && a.dataset ? [a.dataset.in, a.dataset.k, a.dataset.p] : null, pos = a && a.selectionStart; rendre(); window.scrollTo(0, y);
  if (id && id[0]) { const n = document.querySelector(`[data-in="${id[0]}"]${id[1] != null ? `[data-k="${id[1]}"]` : ""}${id[2] ? `[data-p="${id[2]}"]` : ""}`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } } }
RES.fbChamp = (el) => { const c = S.fb.champs[+el.dataset.k]; if (!c) return; if (el.dataset.p === "options") c.options = el.value.split("\n"); else c[el.dataset.p] = el.value; fbModifie(); };
RES.fbType = (el) => { const c = S.fb.champs[+el.dataset.k]; c.type = el.value; if ((c.type === "choix_unique" || c.type === "choix_multiple") && !c.options) c.options = []; S.fbModif = true; rendreEnPreservantForce(); };
RES.fbRequis = (el) => { S.fb.champs[+el.dataset.k].requis = el.checked; S.fbModif = true; rendreEnPreservantForce(); };
RES.fbAjouter = () => { const t = $("fbNouveau").value; S.fb.champs.push({ id: nouvelId(S.fb.champs), type: t, label: "", aide: "", requis: false, options: (t === "choix_unique" || t === "choix_multiple") ? [] : undefined }); S.fbModif = true; rendre();
  const l = document.querySelectorAll('[data-p="label"]'); if (l.length) l[l.length - 1].focus(); };
RES.fbSuppr = async (el) => { const c = S.fb.champs[+el.dataset.k]; if (c.label && !(await confirmer("Retirer le champ « " + c.label + " » ? Les réponses déjà reçues restent dans les inscriptions existantes.", "Retirer"))) return; S.fb.champs.splice(+el.dataset.k, 1); S.fbModif = true; rendre(); };
RES.fbMonter = (el) => { const k = +el.dataset.k; if (k < 1) return; const l = S.fb.champs; [l[k - 1], l[k]] = [l[k], l[k - 1]]; S.fbModif = true; rendre(); };
RES.fbDescendre = (el) => { const k = +el.dataset.k, l = S.fb.champs; if (k >= l.length - 1) return; [l[k + 1], l[k]] = [l[k], l[k + 1]]; S.fbModif = true; rendre(); };
RES.fbCoopt = (el) => { S.fb.coopt.actif = el.checked; S.fbModif = true; rendre(); };
RES.fbCooptTxt = (el) => { S.fb.coopt.libelle = el.value; fbModifie(); };
RES.fbAnnuler = () => { S.fb = null; S.fbModif = false; rendre(); };
function fbNettoyer() {
  return S.fb.champs.map((c) => { const o = { id: c.id, type: c.type, label: String(c.label || "").trim(), aide: String(c.aide || "").trim(), requis: !!c.requis };
    if (c.type === "choix_unique" || c.type === "choix_multiple") o.options = [...new Set((c.options || []).map((x) => String(x).trim()).filter(Boolean))]; return o; });
}
RES.fbApercu = () => {
  const e = evtCourant();
  const faux = { titre: e.titre, commission: (commCourante() || {}).nom || "", formulaire: fbNettoyer().filter((c) => c.label), payant: e.payant, prix: e.prix, iban: "BE74363057740807", titulaire: "Le bureau étudiant ASBL",
    cooptation: S.fb.coopt.actif ? (S.fb.coopt.libelle || "Je souhaite rejoindre…") : null, contact_rgpd: "esat.bojku@ulb.be" };
  const ancien = S.pub; S.pub = { comm: "+++123/4567/89002+++", fichiers: {} };
  modale({ titre: "Aperçu du formulaire", large: true, html: `<div class="pub" style="padding:0">${enteteUlb()}<h1>${esc(faux.titre)}</h1><p class="org">Organisé par la commission ${esc(faux.commission)}</p>${formulaireHtml(faux, true)}
    <button class="btn block" style="margin-top:16px" disabled>Je m'inscris</button></div>`, auto: (d) => { const z = d.querySelector("#qrEpc"); if (z) z.appendChild(qrCanvas(epc(faux.titulaire, faux.iban, faux.prix, S.pub.comm), 200)); } }).then(() => { S.pub = ancien; });
};
RES.fbEnregistrer = async () => {
  const champs = fbNettoyer();
  if (champs.some((c) => !c.label)) return echec("Un champ n'a pas d'intitulé.");
  const vide = champs.find((c) => (c.type === "choix_unique" || c.type === "choix_multiple") && !c.options.length);
  if (vide) return echec("Une liste à choix n'a aucune option (« " + vide.label + " »).");
  if (S.fb.coopt.actif && !String(S.fb.coopt.libelle || "").trim()) return echec("La case « Cooptation » n'a pas de texte.");
  if (!enLigne()) return echec("Pas de connexion internet.");
  try { await majEvt({ formulaire: champs, cooptation: { actif: !!S.fb.coopt.actif, libelle: String(S.fb.coopt.libelle || "").trim() } }); }
  catch (er) { return echec(er.message); }
  S.fb = null; S.fbModif = false; rendre();
  succes("Le formulaire est enregistré sur le serveur (" + champs.length + " champ(s) en plus des champs fixes). La page d'inscription l'affiche dès maintenant ; le lien ne change pas.");
};

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
function apresRendu() {
  const q = $("qrEpc");
  if (q && !q.firstChild) {
    const e = S.mode === "form" ? S.pub.evt : (S.billet && S.billet.evenement) || {};
    const b = S.mode === "form" ? { titulaire: e.titulaire, iban: e.iban, montant: e.prix, comm: S.pub.comm } : { titulaire: S.billet.titulaire, iban: S.billet.iban, montant: S.billet.montant || e.prix, comm: S.billet.communication };
    if (b.iban) q.appendChild(qrCanvas(epc(b.titulaire, b.iban, b.montant, b.comm || ""), 210));
  }
  const t = $("qrBillet");
  if (t && !t.firstChild && S.billet) t.appendChild(qrCanvas(S.billet.code, 300, { level: "M", padding: 8 }));
  if (S.mode === "resp" && (S.vue === "global" || (S.vue === "evt" && S.onglet === "scanner"))) setTimeout(scanRattacher, 0);
}
/* Après un redessin, la caméra doit se rattacher au nouvel emplacement. */
function scanRattacher() {
  scanMajUI();
  if (SC.camOn && !document.querySelector("#reader video")) { scanCamStop().then(scanCamStart); }
}
async function demarrer() {
  majReseau();
  if (!sb) {
    app().innerHTML = `<div class="pub"><div class="alerte"><b>${enLigne() ? "Le serveur n'a pas pu être chargé." : "Hors ligne."}</b> ${enLigne() ? "La librairie Supabase n'a pas passé le contrôle d'intégrité, ou elle a été bloquée." : "Reconnectez-vous à internet puis rechargez la page."}</div></div>`;
    return;
  }
  const p = S.params;
  await lireEtat();
  if (p.has("e")) { S.mode = "form"; if (S.etat.maintenance) { S.mode = "maintenance"; return rendre(); } return chargerFormPublic(); }
  if (p.has("agenda")) { S.mode = "agenda"; if (S.etat.maintenance) { S.mode = "maintenance"; return rendre(); } return chargerAgenda(); }
  if (p.has("c")) { S.mode = "confirm"; return chargerConfirm(); }
  if (p.has("t")) { S.mode = "billet"; return chargerBillet("t"); }
  if (p.has("v")) { S.mode = "virement"; return chargerBillet("v"); }
  if (p.has("d")) { S.mode = "desinsc"; return chargerBillet("d"); }
  if (p.has("p")) { S.mode = "presence"; return chargerBillet("p"); }
  if (p.has("s")) { S.mode = "sondage"; return chargerBillet("s"); }
  if (p.has("scan")) { S.mode = "benevole"; return chargerBenevole(); }
  return demarrerResp();
}
// Toutes les 30 s : page d'erreur, maintenance, « déconnecter tous les appareils ».
setInterval(async () => {
  if (document.visibilityState !== "visible" || !enLigne() || !sb) return;
  const avant = JSON.stringify([S.etat.maintenance, S.etat.deco_le]);
  await lireEtat();
  if (S.mode === "resp" || S.mode === "maintenance" || S.mode === "benevole") {
    const ok = store.get("auth_ok", 0);
    if (S.mode === "resp" && S.etat.deco_le && ok && new Date(S.etat.deco_le).getTime() > ok && !SC.file.length) { scanFermer(); S.mode = "login"; S.loginMsg = "Le propriétaire a déconnecté tous les appareils de la Billetterie : reconnectez-vous."; return rendre(); }
    if (S.mode === "benevole" && S.etat.deco_le) { const b = store.get("benevole", null); if (b && (!b.depuis || new Date(S.etat.deco_le).getTime() > b.depuis) && !SC.file.length) { scanFermer(); store.set("benevole", null); return chargerBenevole(); } }
    if (avant !== JSON.stringify([S.etat.maintenance, S.etat.deco_le])) location.reload();
  }
}, 30000);
// Toutes les 15 s, événement ouvert : on reprend les inscriptions (preuves, liste d'attente, entrées).
setInterval(async () => {
  if (document.visibilityState !== "visible" || !enLigne() || S.mode !== "resp" || S.vue !== "evt" || !["inscriptions", "suivi"].includes(S.onglet)) return;
  if (document.querySelector(".ca-mod") || SC.camOn) return;
  const avant = JSON.stringify(S.insc);
  await chargerInscriptions();
  if (avant !== JSON.stringify(S.insc)) rendreEnPreservant();
}, 15000);
window.addEventListener("beforeunload", (e) => { if (SC.file && SC.file.length) { e.preventDefault(); e.returnValue = ""; } });
if ("serviceWorker" in navigator) window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => {}); });
demarrer();

</script>
