<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{--ink:#ffffff;--ink-soft:#a49dc6;--paper:#000000;--card:#241c46;--line:#3b3170;--gold-dim:#9c7628;--surface2:#2d2456;--bg2:#1b1436;
  --line-2:#2d2456;--stamp:#e8b04b;--stamp-soft:#f0c877;--red:#f2645f;--slate:#7a739e;--amber:#f2ac3f;--green:#3ccf94;}
html,body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100%;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.cx{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.cx button{font-family:inherit;cursor:pointer}
.serif{font-family:'Fraunces',Georgia,serif}
.mono{font-family:'IBM Plex Mono',monospace}
input,textarea,select{font-family:inherit}

/* ---- champs ---- */
.f{width:100%;font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px 11px;margin:6px 0}
textarea{width:100%;font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px 11px;margin:6px 0;resize:vertical;min-height:64px;line-height:1.5}
.f:focus,textarea:focus,select.f:focus{outline:none;border-color:var(--gold-dim);box-shadow:0 0 0 3px rgba(232,176,75,.13)}
::selection{background:rgba(232,176,75,.25);color:#fff}
input[type=date]{color-scheme:dark}
.btn{border:none;border-radius:11px;padding:11px 16px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(150deg,var(--stamp),var(--gold-dim));color:#241100;box-shadow:0 5px 16px rgba(232,176,75,.24);transition:.15s}

function tabVotes(){

    const total=v.voters.length; const count=oid=>v.voters.filter(x=>x.optionId===oid).length;

      return `<div class="opt${c===max&&c>0?" lead":""}">${open?`<button class="pick" data-action="vpick" data-id="${v.id}" data-opt="${o.id}">${picked?"◉ ":"○ "}${esc(o.label)}</button>`:""}

    return `<div class="vote"><div class="vote-h"><h4 class="serif">${esc(v.question)}</h4><span class="badge ${open?"open":"closed"}">${open?"Ouvert":"Clos"}</span></div>
      ${opts}${total?`<p class="voters">${total} votant${total>1?"s":""} : ${esc(v.voters.map(x=>x.nom).join(", "))}</p>`:""}

  }).join("");
  return compose+list;
}

/* ---- onglet BILANS MORAUX (assistant anonyme) ---- */
function bilanTargets(){
  const key=((S.session&&S.session.nom)||"").trim().toLowerCase();
  const self=PERSONNES.find(p=>(p.prenom+" "+p.nom).toLowerCase()===key);
  const selfId=self?self.id:null;
  return PERSONNES.filter(p=>p.id!==selfId);
}
function bilanCapture(){
  const ui=S.bilanUI; if(!ui) return; const T=bilanTargets();
  if(ui.step>=0 && ui.step<T.length){
    const pid=T[ui.step].id;
    ui.draft[pid]={positifs:val("bil_pos").trim(), ameliorer:val("bil_amel").trim()};
  }
}
function tabBilan(){
  const owner = S.session.role==="owner";
  const dejaFait = (S.meta.bilanSubmitters||[]).includes(S.session.id);
  if(!S.bilanUI) S.bilanUI={step:-1,draft:{}};
  const ui=S.bilanUI; const T=bilanTargets();
  let html="";
  if(!dejaFait){
    if(ui.step===-1){
      html += `<div class="compose" style="text-align:center">
        <h3 class="serif" style="font-size:20px">Bilans moraux</h3>
        <p style="color:var(--ink-soft);font-size:14px;line-height:1.55;margin:8px auto 0;max-width:520px">Vous allez remplir un court bilan pour chaque membre du bureau. Pour chacun, indiquez ses <b style="color:var(--green)">points positifs</b> et ses <b style="color:var(--stamp)">points à améliorer</b>. Vos réponses sont <b>anonymes</b> : personne ne saura qui les a écrites.</p>
        <div class="row-btn" style="justify-content:center;margin-top:16px"><button class="btn" data-action="bilan-start">Commencer →</button></div></div>`;
    } else if(ui.step>=0 && ui.step<T.length){
      const p=T[ui.step]; const d=ui.draft[p.id]||{};
      html += `<div class="compose">
        <p class="by" style="margin:0 0 4px">Étape ${ui.step+1} / ${T.length}</p>
        <h3 class="serif" style="font-size:20px;margin:0">Bilan de ${esc(p.prenom)} ${esc(p.nom)}</h3>
        <p style="color:var(--ink-soft);font-size:12.5px;margin:2px 0 10px">${esc(p.fonction)}</p>
        <label style="display:block;font-size:12px;font-weight:600;color:var(--green)">Points positifs</label>
        <p style="color:var(--slate);font-size:11.5px;margin:2px 0 0">Ce qui a bien fonctionné, à conserver.</p>
        <textarea id="bil_pos" placeholder="Ses points forts…">${esc(d.positifs||"")}</textarea>
        <label style="display:block;font-size:12px;font-weight:600;color:var(--stamp);margin:8px 0 0">Points à améliorer</label>
        <p style="color:var(--slate);font-size:11.5px;margin:2px 0 0">Ce qui n'a pas marché ou pourrait être mieux.</p>
        <textarea id="bil_amel" placeholder="Ce qu'il pourrait améliorer…">${esc(d.ameliorer||"")}</textarea>
        <div class="foot-line" style="border-top:none;padding-top:6px">
          <button class="btn ghost sm" data-action="bilan-prev">← Précédent</button>
          <button class="btn sm" data-action="bilan-next" style="margin-left:auto">${ui.step===T.length-1?"Voir le récapitulatif →":"Suivant →"}</button>
        </div></div>`;
    } else {
      html += `<div class="compose"><h3 class="serif">Récapitulatif</h3>
        <p style="color:var(--ink-soft);font-size:13px;margin:0">Relisez vos réponses. Vous pouvez revenir en modifier une, puis envoyer.</p></div>`;
      html += T.map((p,i)=>{ const d=ui.draft[p.id]||{}; return `<div class="vote"><div class="vote-h"><div>
          <h4 class="serif" style="font-size:16px">${esc(p.prenom)} ${esc(p.nom)}</h4>
          <p class="by" style="margin:2px 0 0">${esc(p.fonction)}</p></div>
          <button class="link" data-action="bilan-goto" data-i="${i}">Modifier</button></div>
        <p class="b-desc"><b style="color:var(--green)">Positifs — </b>${d.positifs?esc(d.positifs):"<span style='color:var(--slate)'>—</span>"}</p>
        <p class="b-desc" style="margin-top:4px"><b style="color:var(--stamp)">À améliorer — </b>${d.ameliorer?esc(d.ameliorer):"<span style='color:var(--slate)'>—</span>"}</p></div>`;}).join("");
      html += `<div class="foot-line" style="border-top:none">
        <button class="btn ghost sm" data-action="bilan-prev">← Revenir</button>
        <button class="btn" data-action="bilan-send" style="margin-left:auto">Envoyer mes bilans (anonyme)</button></div>`;
    }
  } else {
    html += `<div class="compose"><h3 class="serif">Bilans moraux</h3><p class="hint" style="margin:8px 0 0;color:var(--green)">✓ Merci, vos bilans ont bien été envoyés (anonymes).</p></div>`;
  }
  {
    const canGen = owner || S.session.fonction==="Secrétaire";
    const byCible={}; (S.bilans||[]).forEach(b=>{ (byCible[b.cible]=byCible[b.cible]||[]).push(b); });
    const total=(S.bilans||[]).length;
    html += `<div class="grp-h" style="margin:30px 0 12px"><h2 class="serif">Retours reçus (anonymes)</h2><span class="c">${total}</span><span class="l"></span></div>`;
    if(total===0){ html += `<div class="empty">Aucun retour pour l'instant.</div>`; }
    else {
      if(canGen) html += `<div class="row-btn" style="margin-bottom:14px"><button class="btn" data-action="generate-bilan">Générer le document à publier</button></div>`;
      html += PERSONNES.filter(p=>byCible[p.id]&&byCible[p.id].length).map(p=>{
        const list=byCible[p.id];
        const pos=list.map(x=>x.positifs).filter(Boolean);
        const am=list.map(x=>x.ameliorer).filter(Boolean);
        return `<div class="vote"><div class="vote-h"><div><h4 class="serif" style="font-size:16px">${esc(p.prenom)} ${esc(p.nom)}</h4><p class="by" style="margin:2px 0 0">${esc(p.fonction)} · ${list.length} retour(s)</p></div></div>
          ${pos.length?`<p class="b-desc"><b style="color:var(--green)">Points positifs</b></p><ul style="margin:2px 0 6px;padding-left:18px">${pos.map(t=>`<li style="font-size:13px;color:var(--ink-soft);margin:0 0 3px">${esc(t)}</li>`).join("")}</ul>`:""}
          ${am.length?`<p class="b-desc"><b style="color:var(--stamp)">Points à améliorer</b></p><ul style="margin:2px 0 0;padding-left:18px">${am.map(t=>`<li style="font-size:13px;color:var(--ink-soft);margin:0 0 3px">${esc(t)}</li>`).join("")}</ul>`:""}</div>`;
      }).join("");
    }
  }
  return html;
}

/* ---- onglet MESSAGES (directs 1 à 1, démo locale) ---- */

/* ---- pseudo-onglet RECHERCHE globale ---- */
function tabSearch(){
  const q=(S.searchQ||"").trim().toLowerCase();
  const compose=`<div class="compose"><h3 class="serif">Recherche</h3>
    <input class="f" id="search_q" data-change="search" value="${esc(S.searchQ||"")}" placeholder="Tâche, contact, événement, annonce, membre…" autofocus>
    <div class="row-btn"><button class="btn sm" data-action="noop">Rechercher</button></div></div>`;
  if(q.length<2) return compose+`<div class="empty">Tapez au moins 2 caractères, puis validez (Entrée).</div>`;
  const res=[];
  const add=(label,sub,tab)=>res.push({label,sub,tab});
  (S.taches||[]).forEach(t=>{ if((t.titre||"").toLowerCase().includes(q)) add(t.titre,"Tâche","taches"); });
  (S.contacts||[]).forEach(c=>{ if([c.nom,c.email,c.notes,c.type].some(x=>(x||"").toLowerCase().includes(q))) add(c.nom,"Contact · "+(c.type||""),"contacts"); });
  (S.annonces||[]).forEach(a=>{ if([a.texte,a.auteur].some(x=>(x||"").toLowerCase().includes(q))) add((a.texte||"").slice(0,60),"Annonce · "+(a.auteur||""),"annonces"); });
  (S.evenements||[]).forEach(e=>{ if([e.titre,e.lieu,e.responsable].some(x=>(x||"").toLowerCase().includes(q))) add(e.titre,"Événement","evenements"); });
  (S.reunions||[]).forEach(m=>{ if((m.titre||"").toLowerCase().includes(q)) add(m.titre,"Réunion","reunions"); });
  (S.budgets||[]).forEach(b=>{ if([b.titre,b.desc].some(x=>(x||"").toLowerCase().includes(q))) add(b.titre,"Budget & projet","budgets"); });
  (S.docs||[]).forEach(d=>{ if([d.titre,d.cat].some(x=>(x||"").toLowerCase().includes(q))) add(d.titre,"Document","docs"); });
  PERSONNES.forEach(p=>{ if((p.prenom+" "+p.nom+" "+p.fonction).toLowerCase().includes(q)) add(p.prenom+" "+p.nom,"Membre · "+p.fonction,"org"); });
  if(res.length===0) return compose+`<div class="empty">Aucun résultat pour « ${esc(S.searchQ)} ».</div>`;
  const rows=res.slice(0,50).map(r=>`<button class="msg-row" data-action="set-tab" data-tab="${r.tab}"><span><span class="nm">${esc(r.label)}</span><br><span class="fn">${esc(r.sub)}</span></span></button>`).join("");
  return compose+`<div class="msg-list">${rows}</div>`;
}

    case "add-creneau": { const t=val("cr_titre").trim(), d=val("cr_date"); if(!t||!d||!sb) return; await sb.from("ca_creneaux").insert({titre:t,date:d,lieu:val("cr_lieu").trim(),cree_par:me.sig}); await loadCreneaux(); render(); break; }
    case "rsvp": if(!sb) break; await sb.from("ca_dispos").upsert({creneau_id:id,membre_id:S.session.id,nom:me.sig,statut:el.dataset.st}); await loadCreneaux(); render(); break;
    case "del-creneau": if(!sb) break; await sb.from("ca_creneaux").delete().eq("id",id); await loadCreneaux(); render(); break;
    /* budgets */
    case "add-budget": { const t=val("b_titre").trim(); if(!t||!sb) return; const cout=parseFloat(String(val("b_cout")).replace(",","."))||0; await sb.from("ca_budgets").insert({titre:t,type:val("b_type"),cout:cout,description:val("b_desc").trim(),demandeur:me.sig,statut:"vote",cree_par:S.session.id}); await loadBudgets(); render(); break; }
    case "bvote": { if(!sb) break; const b=(S.budgets||[]).find(x=>x.id===id); if(!b||b.statut!=="vote") break; await sb.from("ca_budget_votes").upsert({budget_id:id,membre_id:S.session.id,nom:me.sig,choix:el.dataset.choix}); await loadBudgets(); render(); break; }
    case "bdecide": { if(S.session.fonction!=="Président"||!sb) break; const st=el.dataset.st; await sb.from("ca_budgets").update({statut:st,decide_par:st==="vote"?null:me.sig,decide_le:st==="vote"?null:new Date().toISOString()}).eq("id",id); await loadBudgets(); render(); break; }
    case "del-budget": if(S.session.fonction!=="Président"||!sb) break; await sb.from("ca_budgets").delete().eq("id",id); await loadBudgets(); render(); break;
    /* votes */
    case "add-vote": { const q=val("v_q").trim(); const opts=[0,1,2,3,4].map(i=>val("v_o"+i).trim()).filter(Boolean); if(!q||opts.length<2||!sb) return; const {data,error}=await sb.from("ca_votes").insert({question:q,statut:"open",cree_par:S.session.id}).select().single(); if(error||!data) break; await sb.from("ca_vote_options").insert(opts.map(l=>({vote_id:data.id,label:l}))); await loadVotes(); render(); break; }
    case "vpick": { if(!sb) break; const v=(S.votes||[]).find(x=>x.id===id); if(!v||v.statut!=="open") break; await sb.from("ca_vote_ballots").upsert({vote_id:id,membre_id:S.session.id,option_id:el.dataset.opt,nom:me.sig}); await loadVotes(); render(); break; }
    case "vtoggle": { if(!sb) break; const v=(S.votes||[]).find(x=>x.id===id); if(!v) break; await sb.from("ca_votes").update({statut:v.statut==="open"?"closed":"open"}).eq("id",id); await loadVotes(); render(); break; }
    case "del-vote": if(!sb) break; await sb.from("ca_votes").delete().eq("id",id); await loadVotes(); render(); break;
    /* documents */
    case "add-doc": { const t=val("d_titre").trim(); let u=val("d_url").trim(); if(!t||!u) return; if(!/^https?:\/\//i.test(u)) u="https://"+u;
      S.docs.unshift({id:uid(),titre:t,url:u,cat:val("d_cat"),creePar:me.sig,ts:Date.now()}); persist("docs"); render(); break; }
    case "open-url": if(el.dataset.url) window.open(el.dataset.url,"_blank","noopener"); break;
    case "upload-doc": {
      const t=val("d_titre").trim(), cat=val("d_cat");
      const derr=m=>{ const el2=document.getElementById("d_err"); if(el2){el2.textContent=m;el2.style.display="block";} };
      const fi=document.getElementById("d_file"); const file=fi&&fi.files&&fi.files[0];
      if(!t) return derr("Donnez un nom au document.");
      if(!file) return derr("Choisissez un fichier.");
      if(!sb) return derr("Serveur indisponible.");
      derr("Envoi en cours…"); const el3=document.getElementById("d_err"); if(el3) el3.style.color="var(--ink-soft)";
      const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      const path=uid()+"-"+safe;
      const up=await sb.storage.from("ca-documents").upload(path, file);
      if(up && up.error) return derr("Échec de l'envoi : "+up.error.message);
      const ins=await sb.from("ca_docs").insert({ titre:t, categorie:cat, chemin:path, cree_par:S.session.id });
      if(ins && ins.error) return derr("Fichier envoyé mais non enregistré : "+ins.error.message);
      await loadDocs(); render(); break;
    }
    case "open-doc": {
      const d=(S.docs||[]).find(x=>x.id===id); if(!d) break;
      const {data,error}=await sb.storage.from("ca-documents").createSignedUrl(d.chemin, 3600);
      if(error||!data){ if(window.alert) window.alert("Impossible d'ouvrir le fichier."); break; }
      window.open(data.signedUrl, "_blank"); break;
    }
    case "del-doc": {
      if(!(S.session&&S.session.role==="owner")) break;
      const d=(S.docs||[]).find(x=>x.id===id); if(!d) break;
      if(window.confirm && !window.confirm("Supprimer ce document ?")) break;
      try{ await sb.storage.from("ca-documents").remove([d.chemin]); }catch(e){}
      try{ await sb.from("ca_docs").delete().eq("id",id); }catch(e){}
      await loadDocs(); render(); break;
    }
    /* annonces */
    case "add-annonce": { const tx=val("a_txt").trim(); if(!tx) return; if(!sb) break; await sb.from("ca_annonces").insert({auteur:me.sig,texte:tx,cree_par:S.session.id}); await loadAnnonces(); render(); break; }
    case "del-annonce": if(!sb) break; await sb.from("ca_annonces").delete().eq("id",id); await loadAnnonces(); render(); break;
  }
});

async function boot(){ if(!sb){ render(); return; } try{ await refreshSession(); }catch(e){} render(); try{ sb.auth.onAuthStateChange(async ()=>{ await refreshSession(); render(); }); }catch(e){} }
boot();

</script>
</body>
</html>
