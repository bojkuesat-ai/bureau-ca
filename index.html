<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{--ink:#ffffff;--ink-soft:#a49dc6;--paper:#000000;--card:#241c46;--line:#3b3170;--gold-dim:#9c7628;--surface2:#2d2456;--bg2:#1b1436;
  --line-2:#2d2456;--stamp:#e8b04b;--stamp-soft:#f0c877;--red:#f2645f;--slate:#7a739e;--amber:#f2ac3f;--green:#3ccf94;}
html,body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100%;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.cx{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.cx button{font-family:inherit;cursor:pointer}
.serif{font-family:'Fraunces',Georgia,serif}
.mono{font-family:'IBM Plex Mono',monospace}
input,textarea,select{font-family:inherit}

/* ---- champs ---- */
.f{width:100%;font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px 11px;margin:6px 0}
textarea{width:100%;font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px 11px;margin:6px 0;resize:vertical;min-height:64px;line-height:1.5}
.f:focus,textarea:focus,select.f:focus{outline:none;border-color:var(--gold-dim);box-shadow:0 0 0 3px rgba(232,176,75,.13)}
::selection{background:rgba(232,176,75,.25);color:#fff}
input[type=date]{color-scheme:dark}
.btn{border:none;border-radius:11px;padding:11px 16px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(150deg,var(--stamp),var(--gold-dim));color:#241100;box-shadow:0 5px 16px rgba(232,176,75,.24);transition:.15s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{color:var(--stamp-soft);border-color:var(--gold-dim)}
.btn.sm{padding:6px 11px;font-size:12px}
.row-btn{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.link{background:none;border:none;color:var(--slate);font-size:12.5px;font-weight:500;padding:0;text-decoration:underline;text-underline-offset:2px}
.link:hover{color:var(--stamp)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--slate);font-size:13.5px;padding:34px 10px;border:1px dashed var(--line);border-radius:14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft)}

/* ---- ACCUEIL (2 boutons) ---- */
.home{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 22px}
.home-admin{position:absolute;top:20px;right:22px;background:var(--surface2);border:1px solid var(--gold-dim);color:var(--stamp);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600}
.home-admin:hover{background:#2d2456;border-color:var(--stamp)}
.home-in{width:100%;max-width:840px}
.home .eyebrow{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px}
.home h1{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(30px,6vw,48px);text-align:center;margin:0 0 8px;letter-spacing:-.01em}
.home .lead{text-align:center;color:var(--ink-soft);font-size:15px;margin:0 0 34px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.choice{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 26px;text-align:left;
  display:flex;flex-direction:column;min-height:210px;transition:transform .12s,border-color .12s,box-shadow .12s;color:inherit}
.choice:hover{transform:translateY(-3px);border-color:var(--stamp);box-shadow:0 12px 26px rgba(0,0,0,.35)}
.choice .ic{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:18px}
.choice.caisse .ic{background:#123a2c;color:var(--green)}
.choice.ca .ic{background:#3a2911;color:var(--stamp)}
.choice h2{font-family:'Fraunces',serif;font-weight:500;font-size:24px;margin:0 0 6px}
.choice p{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 auto}
.choice .go{margin-top:20px;font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px}
.choice.caisse .go{color:var(--green)}.choice.ca .go{color:var(--stamp)}
.home-foot{margin-top:26px;text-align:center}
.home-foot .cfg{font-size:12px;color:var(--slate);background:none;border:none;text-decoration:underline;text-underline-offset:2px}
.home-foot .cfg:hover{color:var(--ink)}
.cfg-box{max-width:520px;margin:16px auto 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left}
.cfg-box p{font-size:12.5px;color:var(--ink-soft);margin:0 0 4px}

/* ---- AUTH ---- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth{width:100%;max-width:400px}
.auth .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.auth h1{font-family:'Fraunces',serif;font-weight:500;font-size:28px;margin:8px 0 6px}
.auth .lead{font-size:14px;color:var(--ink-soft);margin:0 0 22px;line-height:1.5}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.auth-card h2{font-family:'Fraunces',serif;font-weight:500;font-size:18px;margin:0 0 4px}
.auth-card .hint{font-size:12.5px;color:var(--slate);margin:0 0 8px}
.auth label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:12px 0 0}
.auth .btn{width:100%;margin-top:16px;padding:11px}
.auth .err{color:var(--stamp);font-size:12.5px;margin:12px 0 0;font-weight:500}
.auth .swap{text-align:center;margin:16px 0 0;font-size:13px;color:var(--ink-soft)}
.auth .swap button{background:none;border:none;color:var(--stamp);font-weight:600;text-decoration:underline;text-underline-offset:2px;font-size:13px;padding:0}
.auth .note{font-size:11.5px;color:var(--slate);line-height:1.5;margin:18px 2px 0}

/* ---- EN-TÊTE dashboard ---- */
.hd{border-bottom:1px solid var(--line);padding:20px 22px 0}
.hd-in{max-width:1080px;margin:0 auto}
.hd-top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.hd-top .back{background:none;border:1px solid var(--line);border-radius:7px;padding:6px 11px;font-size:12.5px;color:var(--ink-soft);font-weight:500}
.hd-top .back:hover{border-color:var(--ink-soft);color:var(--ink)}
.hd-top .eyebrow{margin-left:2px}
.title{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(24px,4.5vw,38px);line-height:1.05;margin:6px 0 4px;letter-spacing:-.01em;background:none;border:none;color:var(--ink);width:100%;padding:0}
.title:focus{outline:none;box-shadow:0 2px 0 var(--stamp)}
.sub{color:var(--ink-soft);font-size:14px;margin:0 0 16px}
.sub b{color:var(--ink);font-weight:600}
.userbar{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.userbar .u-av{width:26px;height:26px;border-radius:50%;background:var(--stamp);color:#141026;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.userbar .u-nom{font-size:13.5px;font-weight:600}
.userbar .u-id{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--slate)}
.userbar .logout{margin-left:auto;background:none;border:1px solid var(--line);border-radius:7px;padding:6px 12px;font-size:12.5px;color:var(--ink-soft);font-weight:500}
.userbar .logout:hover{border-color:var(--ink-soft);color:var(--ink)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:6px}
.tab{border:1px solid var(--line);border-bottom:none;background:transparent;padding:11px 16px;font-size:13.5px;font-weight:500;color:var(--ink-soft);border-radius:8px 8px 0 0;white-space:nowrap;position:relative;top:1px}
.tab .n{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--slate);margin-right:7px}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink)}
.tab[aria-selected="true"] .n{color:var(--stamp)}
.tab:hover{color:var(--ink)}

.body{max-width:1080px;margin:0 auto;padding:24px 22px 60px}
.adminbar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--gold-dim);border-radius:14px;padding:12px 16px;margin-bottom:22px}
.adminbar .ab-ic{width:30px;height:30px;border-radius:8px;background:#3a2911;color:var(--stamp);display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.adminbar .ab-txt{font-size:13.5px;color:var(--ink)}
.banner{font-size:12.5px;color:var(--ink-soft);background:var(--card);border:1px solid var(--line-2);border-radius:8px;padding:9px 13px;margin-bottom:22px;display:flex;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}

/* ---- compose ---- */
.compose{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:22px}
.compose h3{font-family:'Fraunces',serif;font-weight:500;font-size:15px;margin:0 0 4px}
.mail-sign{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:11px 13px;margin:10px 0 4px;font-size:13px;line-height:1.5}
.mail-tgts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.mail-manual{display:flex;gap:8px;align-items:center;margin:0 0 6px}
.mail-manual .f{flex:1}
.mail-manual .btn{white-space:nowrap;flex:none}
.mail-tgt{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:5px 12px;font-size:12.5px;color:var(--ink-soft);font-weight:600}
.mail-tgt[aria-pressed="true"]{background:var(--stamp);color:#241100;border-color:var(--stamp)}
.mail-tgt:hover{border-color:var(--stamp)}
.mail-src{margin:0 0 12px}
.mail-src-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--ink-soft);margin:0 0 6px}
.mail-chips{display:flex;flex-wrap:wrap;gap:6px}
.mail-chip{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:5px 11px;font-size:12px;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail-chip:hover{border-color:var(--stamp);color:var(--stamp)}
.mail-tpl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 4px}
.mail-attach{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 2px}
.mail-attach-name{font-size:12.5px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 9px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail-hist{display:flex;flex-direction:column;gap:6px}
.mail-hist-row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;background:var(--paper)}
.mail-hist-txt{font-size:13px;color:var(--ink)}
.mail-hist-meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--slate);white-space:nowrap;flex:none}
.mail-grp-row{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;background:var(--paper);margin-bottom:6px}
.mail-grp-actions{display:flex;gap:12px;flex:none}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0 8px;font-size:11.5px;align-items:center}
.cal-grid-h{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px;font-weight:600;color:var(--ink-soft);text-align:center;margin-bottom:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{min-height:74px;border:1px solid var(--line-2);border-radius:7px;padding:4px;background:var(--paper);overflow:hidden}
.cal-empty{background:transparent;border:0}
.cal-today{border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}
.cal-d{font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:3px}
.cal-ev-chip{display:block;font-size:10.5px;line-height:1.3;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.cal-reu{background:#4a4a8a}
.cal-ev{background:#c9772a}
.cal-tache{background:#8a3a5a}
@media(max-width:640px){ .cal-cell{min-height:56px} .cal-ev-chip{font-size:9px} }
select.f{width:100%}

/* ---- organigramme ---- */
.grp{margin-bottom:30px}
.grp-h{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
.grp-h h2{font-family:'Fraunces',serif;font-weight:500;font-size:19px;margin:0}
.grp-h .c{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--slate)}
.grp-h .l{height:1px;flex:1;background:var(--line-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;display:flex;flex-direction:column}
.ref{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--slate);text-transform:uppercase}
.poste{font-family:'Fraunces',serif;font-size:16.5px;font-weight:500;margin:2px 0}
.qui{font-size:13px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:7px}
.qui .av{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.miss{font-size:13px;line-height:1.5;color:var(--ink-soft);margin:0 0 8px}
.contact{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--stamp);word-break:break-all;margin-top:auto}
.contact.empty{color:var(--slate)}
.card-foot{margin-top:11px;padding-top:10px;border-top:1px solid var(--line-2);display:flex;justify-content:flex-end}

/* ---- tâches ---- */
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.col-h{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.pill{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;padding:2px 9px;border-radius:20px;color:#fff}
.col-h .ct{font-size:12px;color:var(--slate)}
.task{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:9px}
.task p{margin:0 0 8px;font-size:13.5px;line-height:1.45}
.task .tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--slate);display:block;margin-bottom:7px}
.task-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 9px;font-size:11.5px;color:var(--ink-soft)}
.chip:hover{border-color:var(--ink-soft);color:var(--ink)}
.x{margin-left:auto;background:none;border:none;color:var(--slate);font-size:12px;padding:2px 4px}
.x:hover{color:var(--stamp)}

/* ---- planning ---- */
.slot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:14px}
.slot-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}
.slot-h .when{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--stamp);white-space:nowrap}
.slot h4{font-family:'Fraunces',serif;font-weight:500;font-size:17px;margin:0}
.slot .lieu{font-size:12.5px;color:var(--ink-soft);margin:2px 0 0}
.tallies{display:flex;gap:14px;margin:12px 0 10px;flex-wrap:wrap}
.tally{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.tally b{color:var(--ink);font-weight:600}
.tally .sq{width:9px;height:9px;border-radius:2px;display:inline-block}
.people{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.who-chip{font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--line-2);background:var(--paper);display:inline-flex;align-items:center;gap:6px}
.who-chip .sq{width:7px;height:7px;border-radius:50%}
.foot-line{border-top:1px solid var(--line-2);padding-top:11px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.mini button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--ink-soft)}
.mini button:hover{border-color:var(--ink-soft);color:var(--ink)}
.mini button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---- stats budgets ---- */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .k{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);margin:0 0 6px}
.stat .v{font-family:'Fraunces',serif;font-size:24px;font-weight:500;margin:0}

/* ---- votes / demandes ---- */
.vote{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:14px}
.vote-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.vote-h h4{font-family:'Fraunces',serif;font-weight:500;font-size:17px;margin:0}
.badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:3px 9px;border-radius:20px;white-space:nowrap;font-weight:500}
.badge.open{background:var(--green);color:#fff}
.badge.closed{background:var(--slate);color:#fff}
.badge.ok{background:var(--green);color:#fff}
.badge.no{background:var(--red);color:#fff}
.opt{margin-bottom:9px}
.opt-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.opt-top .ol{font-weight:500}.opt-top .oc{font-family:'IBM Plex Mono',monospace;color:var(--slate)}
.bar{height:9px;background:var(--paper);border:1px solid var(--line-2);border-radius:20px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--ink);border-radius:20px;transition:width .3s}
.opt.lead .bar span{background:var(--stamp)}
.opt button.pick{width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:9px 12px;font-size:13.5px;color:var(--ink);margin-bottom:8px;font-weight:500}
.opt button.pick:hover{border-color:var(--stamp);color:var(--stamp)}
.opt-inputs{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.opt-inputs .oi{display:flex;gap:8px;align-items:center}
.opt-inputs .oi button{background:none;border:none;color:var(--slate);font-size:14px;padding:4px 8px}
.addopt{background:none;border:1px dashed var(--line);border-radius:7px;padding:7px;font-size:12.5px;color:var(--ink-soft);width:100%;margin-bottom:6px}
.addopt:hover{border-color:var(--ink-soft);color:var(--ink)}
.voters{font-size:11.5px;color:var(--slate);margin-top:8px}
.b-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:5px 0 0}
.b-type{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--line-2);border-radius:20px;padding:2px 9px}
.b-cost{font-family:'Fraunces',serif;font-size:17px;font-weight:600;color:var(--ink)}
.b-desc{font-size:13.5px;line-height:1.55;color:var(--ink-soft);margin:12px 0 4px}
.by{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--slate);margin-top:6px}

/* ---- documents ---- */
.doc{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px;margin-bottom:10px;text-decoration:none;color:inherit}
.doc:hover{border-color:var(--ink-soft)}
.doc .ic{width:34px;height:34px;border-radius:8px;background:var(--paper);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--stamp)}
.doc .meta{flex:1;min-width:0}
.doc .dt{font-weight:600;font-size:14px;margin:0}
.doc .du{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--slate);margin:2px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .cat{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);border:1px solid var(--line-2);border-radius:20px;padding:2px 9px;flex:none}
.doc .rm2{background:none;border:none;color:var(--slate);font-size:13px;flex:none;padding:4px}
.doc .rm2:hover{color:var(--stamp)}

/* ---- annonces ---- */
.feed{display:flex;flex-direction:column;gap:12px}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.note-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.note-h .who{font-weight:600;font-size:13.5px}
.note-h .when{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--slate)}
.note p{margin:0;font-size:14px;line-height:1.55}
/* messagerie */
.msg-list{display:flex;flex-direction:column;gap:8px}
.msg-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;text-align:left;width:100%;color:inherit}
.msg-row:hover{border-color:var(--ink-soft)}
.msg-av{width:34px;height:34px;border-radius:50%;background:var(--stamp);color:#141026;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.msg-row .nm{font-weight:600;font-size:14px}
.msg-row .fn{font-size:12px;color:var(--slate)}
.msg-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.msg-thread{display:flex;flex-direction:column;gap:8px;min-height:160px;margin-bottom:12px}
.bub{max-width:80%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.45}

/* Fenetre maison pour partager un lien, a la place de window.alert. */
function modaleLien(titre, texte, lien, copie){
  const anc=document.getElementById("ca_modal"); if(anc) anc.remove();
  const d=document.createElement("div");
  d.id="ca_modal"; d.className="ca-mod";
  d.innerHTML='<div class="ca-mod-box" role="dialog" aria-modal="true">'
    +'<h3>'+esc(titre)+'</h3>'
    +'<p>'+esc(texte)+'</p>'
    +(copie?'<p class="ca-mod-ok">\u2713 Lien copi\u00e9 dans le presse-papier</p>':"")
    +'<div class="ca-mod-lien" id="ca_modal_lien">'+esc(lien)+'</div>'
    +'<div class="ca-mod-btns">'
    +'<button class="btn ghost sm" id="ca_modal_copy">Copier \u00e0 nouveau</button>'
    +'<button class="btn sm" id="ca_modal_close">Fermer</button>'
    +'</div></div>';
  document.body.appendChild(d);
  const fermer=()=>d.remove();
  d.addEventListener("click",e=>{ if(e.target===d) fermer(); });
  d.querySelector("#ca_modal_close").addEventListener("click",fermer);
  d.querySelector("#ca_modal_copy").addEventListener("click",async()=>{
    let ok=false;
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(lien); ok=true; } }catch(_){ }
    if(!ok){ try{ const t=document.createElement("textarea"); t.value=lien; document.body.appendChild(t); t.select(); ok=document.execCommand("copy"); t.remove(); }catch(_){ } }
    const b=d.querySelector("#ca_modal_copy"); if(b) b.textContent=ok?"\u2713 Copi\u00e9":"Copie impossible";
  });
  document.addEventListener("keydown",function esc2(e){ if(e.key==="Escape"){ fermer(); document.removeEventListener("keydown",esc2); } });
}

/* Saisie libre dans une fenetre maison. Renvoie le texte, ou null si annule. */
function modaleSaisie(texte, titre, placeholder){
  return new Promise(resolve=>{
    const anc=document.getElementById("ca_modal_txt"); if(anc) anc.remove();
    const d=document.createElement("div");
    d.id="ca_modal_txt"; d.className="ca-mod";
    d.innerHTML='<div class="ca-mod-box" role="dialog" aria-modal="true">'
      +'<h3>'+esc(titre||"")+'</h3>'
      +'<p style="color:var(--ink);font-size:14px">'+esc(texte)+'</p>'
      +'<textarea class="f" id="ca_txt_val" rows="4" placeholder="'+esc(placeholder||"")+'" style="width:100%;margin:0 0 12px"></textarea>'
      +'<div class="ca-mod-btns">'
      +'<button class="btn ghost sm" id="ca_txt_no">Annuler</button>'
      +'<button class="btn sm" id="ca_txt_ok">Confirmer</button>'
      +'</div></div>';
    document.body.appendChild(d);
    let fini=false;
    const rep=v=>{ if(fini) return; fini=true; d.remove(); document.removeEventListener("keydown",k); resolve(v); };
    function k(e){ if(e.key==="Escape") rep(null); }
    document.addEventListener("keydown",k);
    d.addEventListener("click",e=>{ if(e.target===d) rep(null); });
    const champ=d.querySelector("#ca_txt_val");
    const ok=d.querySelector("#ca_txt_ok"), non=d.querySelector("#ca_txt_no");
    if(ok) ok.addEventListener("click",()=>rep(champ?String(champ.value||""):""));
    if(non) non.addEventListener("click",()=>rep(null));
    try{ if(champ) champ.focus(); }catch(_){ }
  });
}

      +'<button class="btn sm" id="ca_ask_yes">Confirmer</button>'
      +'</div></div>';
    document.body.appendChild(d);
    let fini=false;
    const rep=v=>{ if(fini) return; fini=true; d.remove(); document.removeEventListener("keydown",k); resolve(v); };
    function k(e){ if(e.key==="Escape") rep(false); if(e.key==="Enter") rep(true); }
    document.addEventListener("keydown",k);
    d.addEventListener("click",e=>{ if(e.target===d) rep(false); });
    const oui=d.querySelector("#ca_ask_yes"), non=d.querySelector("#ca_ask_no");

/* ---- Envoi d'un mail composé (À / CC / CCI / objet + signature + no-reply) ---- */
async function envoyerMailComposeCA({toList, ccList, bccList, objet, corpsTexte, lienPiece, nomPiece}, onProgress){
  const nettoie = arr => [...new Set((arr||[]).map(x=>String(x||"").toLowerCase().trim()).filter(Boolean))];
  const to=nettoie(toList), cc=nettoie(ccList), bcc=nettoie(bccList);
  // destinataires uniques : une adresse déjà en À n'est pas recontactée en CC/CCI
  const dejaVus=new Set(to);
  const ccNet=cc.filter(a=>!dejaVus.has(a)); ccNet.forEach(a=>dejaVus.add(a));
  const bccNet=bcc.filter(a=>!dejaVus.has(a)); bccNet.forEach(a=>dejaVus.add(a));
  let tous=[...to, ...ccNet, ...bccNet];
  const nbTotalAvant=tous.length;
  tous=tous.filter(a=>!estDesabonne(a));               // RGPD : on n'écrit jamais à un désabonné
  const nbDesab=nbTotalAvant-tous.length;
  if(!tous.length) return {ok:0, err:0, total:0, desabonnes:nbDesab};
  const pieceHtml = lienPiece ? `<p style="margin:16px 0 0;padding:10px 12px;background:#f5f4fb;border:1px solid #e2e0ef;border-radius:8px;font-size:13px">📎 Pièce jointe : <a href="${lienPiece}" style="color:#241c46;font-weight:bold">${caMailEsc(nomPiece||"Télécharger le fichier")}</a></p>` : "";
  const corpsHtml=`<div style="font-family:Arial,Helvetica,sans-serif;max-width:600px;margin:0 auto;color:#1a1a2e;font-size:14px;line-height:1.6">`
    +`<div style="white-space:pre-wrap">${caMailEsc(corpsTexte)}</div>`
    +pieceHtml
    +signatureExpediteurCA()
    +blocNoReplyCA();
  const headers=await caSendHeaders();
  let ok=0, err=0, i=0;
  const base=(function(){ try{ return caAppUrl(); }catch(e){ return ""; } })();
  for(const dest of tous){
    const url = base ? await lienDesabo(dest) : "";
    const desabo = url ? `<p style="color:#bbb;font-size:11px;margin-top:14px">Vous recevez ce message en tant que contact du Bureau étudiant. <a href="${url}" style="color:#999">Se désabonner</a>.</p>` : "";
    const html=corpsHtml+desabo+`</div>`;
    try{
      const r=await fetch(CA_SEND_FN,{method:"POST",headers:headers,
        body:JSON.stringify({to:dest, subject:objet, html:html})});
      if(r && r.ok===false){ err++; } else { ok++; }
    }catch(e){ err++; }
    i++; try{ if(typeof onProgress==="function") onProgress(i, tous.length); }catch(e){}
    await new Promise(r=>setTimeout(r,150));
  }
  return {ok, err, total:tous.length, desabonnes:nbDesab};
}
/* ---- Extraction de toutes les adresses e-mail d'un fichier Excel / CSV ---- */
const RE_EMAIL=/[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}/gi;
function extraireEmailsDepuisFichier(file){
  return new Promise((resolve,reject)=>{
    const rd=new FileReader();
    rd.onerror=()=>reject(new Error("Lecture impossible."));
    rd.onload=()=>{
      try{
        let texte="";
        if(typeof XLSX!=="undefined"){
          const wb=XLSX.read(rd.result,{type:"array"});
          wb.SheetNames.forEach(n=>{ texte+=" "+XLSX.utils.sheet_to_csv(wb.Sheets[n]); });
        } else {
          texte=new TextDecoder("utf-8").decode(new Uint8Array(rd.result));
        }
        const found=(texte.match(RE_EMAIL)||[]).map(x=>x.toLowerCase());
        resolve([...new Set(found)]);
      }catch(e){ reject(e); }
    };
    rd.readAsArrayBuffer(file);
  });
}

/* ============ RAPPELS DE VOTE / DE PRÉSENCE ============
   Un bouton « Rappeler » sur les budgets en vote, les votes ouverts et les
   événements à venir. Seuls les retardataires reçoivent le mail : la liste
   est recalculée côté serveur par l'edge function « rappels », qui applique
   aussi le garde-fou de 12 h. Le rappel peut être programmé : le cron
   Supabase l'enverra à l'heure dite, même si personne n'est connecté. */
function peutRappeler(obj){
  const u=S.session; if(!u) return false;
  if(u.role==="owner"||estPresidente()||estSecretaire()) return true;
  if(obj.creeParId && obj.creeParId===u.id) return true;
  if(obj.demandeur && String(obj.demandeur).trim()===String(u.sig||"").trim()) return true;
  if(obj.responsable && String(obj.responsable).trim().toLowerCase()===String(u.nom||"").trim().toLowerCase()) return true;
  return false;
}
function manquantsRappel(type, obj){
  const repondu=new Set();
  if(type==="budget") (obj.votes||[]).forEach(v=>{ if(v.membreId) repondu.add(v.membreId); });
  else if(type==="vote") (obj.voters||[]).forEach(v=>{ if(v.membreId) repondu.add(v.membreId); });
  else (S.presence||[]).forEach(p=>{ if(p.evenement_id===obj.id && p.membre_id) repondu.add(p.membre_id); });
  return membresActifs().filter(a=>!repondu.has(a.id)).length;
}
/* Convertit un ISO en valeur d'input datetime-local (heure locale). */
function dtLocal(iso){
  if(!iso) return "";
  try{ const d=new Date(iso); const p=n=>String(n).padStart(2,"0");
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());
  }catch(e){ return ""; }
}

async function appelRappel(type, id, quand){
  const headers=await caSendHeaders();
  let j=null, statut=0;
  try{
    const r=await fetch(CA_RAPPEL_FN,{method:"POST",headers:headers,
      body:JSON.stringify(quand?{type:type,id:id,quand:quand}:{type:type,id:id})});
    statut=r.status;
    try{ j=await r.json(); }catch(_){ j=null; }
  }catch(e){ modaleInfo("Le serveur de rappels n'a pas répondu. Vérifiez votre connexion et réessayez."); return; }
  if(!j){
    modaleInfo(statut===401
      ? "Le serveur a refusé la demande (401). La fonction « rappels » doit être déployée avec « Verify JWT » désactivé."
      : "Réponse inattendue du serveur (code "+statut+"). La fonction « rappels » est-elle bien déployée ?");
    return;
  }
  if(j.error){ modaleInfo(j.error); return; }
  if(quand){ modaleInfo("⏰ Rappel programmé pour le "+fmtQuand(quand)+".\n"+(j.restants||0)+" personne(s) n'ont pas encore répondu — seules celles qui n'auront toujours pas répondu recevront le mail.","Rappel programmé"); }
  else if(!j.restants){ modaleInfo("Tout le monde a déjà répondu : aucun rappel envoyé."); }
  else { modaleInfo("✓ "+j.envoyes+" rappel(s) envoyé(s)"+(j.echecs?", "+j.echecs+" échec(s)":"")+".","Rappel envoyé");
    try{ logAct("Rappel envoyé ("+type+") à "+j.envoyes+" personne(s)"); }catch(e){} }
  await rechargerObjet(type); render();
}

/* Écriture sûre d'une colonne JSON : on relit la ligne juste avant d'écrire, pour ne
   pas effacer ce qu'un autre membre vient d'ajouter depuis un autre appareil. */
async function majReunion(id, transforme){
  if(!sb||!id) return false;
  const {data,error}=await sb.from("ca_reunions").select("ordre,presences").eq("id",id).maybeSingle();
  if(error||!data){ if(window.alert) window.alert("Réunion introuvable ou lecture impossible."); return false; }
  const frais={ ordre:Array.isArray(data.ordre)?data.ordre:[], presences:data.presences||{} };
  const patch=transforme(frais);
  if(!patch) return false;
  const up=await sb.from("ca_reunions").update(patch).eq("id",id);
  if(up&&up.error){ if(window.alert) window.alert("Enregistrement impossible : "+up.error.message); return false; }
  const loc=(S.reunions||[]).find(x=>x.id===id);
  if(loc){ if(patch.ordre) loc.ordre=patch.ordre; if(patch.presences) loc.presences=patch.presences; }
  return true;
}
async function majEvenement(id, transforme){
  if(!sb||!id) return false;
  const {data,error}=await sb.from("ca_evenements").select("checklist").eq("id",id).maybeSingle();
  if(error||!data){ if(window.alert) window.alert("Événement introuvable ou lecture impossible."); return false; }
  const liste=Array.isArray(data.checklist)?data.checklist:[];
  const nouvelle=transforme(liste);
  if(!nouvelle) return false;
  const up=await sb.from("ca_evenements").update({checklist:nouvelle}).eq("id",id);
  if(up&&up.error){ if(window.alert) window.alert("Enregistrement impossible : "+up.error.message); return false; }
  const loc=(S.evenements||[]).find(x=>x.id===id);
  if(loc) loc.checklist=nouvelle;
  return true;
}

/* Traitement des envois programmés arrivés à échéance (déclenché à l'ouverture de l'app). */
async function traiterEnvoisProgrammes(){
  if(!sb) return; const now=Date.now();
  const dus=(S.programmes||[]).filter(p=>p.statut==="en_attente" && new Date(p.envoiAt).getTime()<=now);
  for(const p of dus){
    try{
      const {data:claim}=await sb.from("ca_mail_programmes").update({statut:"en_cours"}).eq("id",p.id).eq("statut","en_attente").select();
      if(!claim||!claim.length) continue;               // déjà pris par un autre appareil
      const d=p.dest||{};
      let lien="";
      if(p.piecePath){ try{ const su=await sb.storage.from("ca-documents").createSignedUrl(p.piecePath, 7776000); if(su&&su.data&&su.data.signedUrl) lien=su.data.signedUrl; }catch(e){} }
      const res=await envoyerMailComposeCA({toList:d.to||[],ccList:d.cc||[],bccList:d.cci||[],objet:p.objet,corpsTexte:p.corps,lienPiece:lien,nomPiece:p.nomPiece});
      await sb.from("ca_mail_programmes").update({statut:"envoye"}).eq("id",p.id);
      logAct("Mail programmé envoyé : « "+p.objet+" » à "+res.total+" destinataire(s)");

  }
  try{ await loadProgrammes(); }catch(e){}
}

/* Rappels automatiques : réunions et tâches dont l'échéance est DEMAIN → e-mail unique aux membres. */
async function traiterRappels(){
  if(!sb||!S.session) return;
  const today=new Date(); today.setHours(0,0,0,0);
  const demain=new Date(today.getTime()+86400000);
  const isDay=(dstr,d)=>{ if(!dstr) return false; const x=new Date(String(dstr).slice(0,10)+"T00:00"); return x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth()&&x.getDate()===d.getDate(); };
  const jobs=[];
  (S.reunions||[]).forEach(m=>{ if(isDay(m.date,demain)) jobs.push({cle:"reunion:"+m.id+":"+m.date, sujet:"Rappel : réunion demain", corps:"Rappel : la réunion « "+(m.titre||"")+" » a lieu demain"+(m.lieu?(" à "+m.lieu):"")+".", dest:destinatairesMembres()}); });
  (S.taches||[]).forEach(t=>{ if(t.statut!=="done" && isDay(t.echeance,demain)){
    const d=destinatairesTache(t);
    if(d.length) jobs.push({cle:"tache:"+t.id+":"+t.echeance, sujet:"Rappel : échéance demain", corps:"Rappel : la tâche « "+(t.titre||"")+" » arrive à échéance demain.", dest:d});
  } });
  for(const j of jobs){
    try{
      const ins=await sb.from("ca_rappels_envoyes").insert({cle:j.cle}).select();
      if(ins&&ins.error) continue;                       // déjà envoyé (clé en doublon)
      if(!ins||!ins.data||!ins.data.length) continue;
      await envoyerNotifCAListe(j.dest, j.sujet, "<p>"+caMailEsc(j.corps)+"</p>");
      logAct("Rappel automatique envoyé : "+j.sujet);
    }catch(e){}
  }
}

/* Une tâche ne concerne que le titulaire du poste et la personne qui l'a créée. */
function destinatairesTache(t){
  const set=new Set();
  const poste=POSTE_PAR_ID[t.posteId];
  if(poste){ membresActifs().forEach(a=>{ if(String(a.fonction||"").trim()===String(poste.titre||"").trim()) set.add(String(a.email).toLowerCase().trim()); }); }
  if(t.creePar){ const c=String(t.creePar||"").toLowerCase(); membresActifs().forEach(a=>{ const sig=((a.prenom||a.nom||"")+(a.fonction?" \u00b7 "+a.fonction:"")).toLowerCase().trim(); if(sig===c) set.add(String(a.email).toLowerCase().trim()); }); }
  return [...set].filter(Boolean).filter(e=>!estDesabonne(e));
}

/* Bandeau de rappels dans l'app (fiable, sans e-mail) : ce qui arrive sous 48 h. */
function bandeauRappels(){
  const now=new Date(); now.setHours(0,0,0,0);
  const dansXjours=d=>{ if(!d) return 999; const x=new Date(String(d).slice(0,10)+"T00:00"); return Math.round((x-now)/86400000); };
  const items=[];
  (S.reunions||[]).forEach(m=>{ const n=dansXjours(m.date); if(n>=0&&n<=2) items.push({q:n,t:"Réunion « "+(m.titre||"")+" »"+(m.lieu?(" — "+m.lieu):""),n}); });
  (S.taches||[]).forEach(t=>{ if(t.statut==="done") return; const n=dansXjours(t.echeance); if(n>=0&&n<=2) items.push({q:n,t:"Tâche « "+(t.titre||"")+" »",n}); });
  if(!items.length) return "";
  items.sort((a,b)=>a.n-b.n);
  const quand=n=>n===0?"aujourd'hui":n===1?"demain":"dans "+n+" jours";
  return `<div class="card2" style="border-left:4px solid var(--stamp);margin-bottom:16px">
    <h3 class="serif" style="margin:0 0 6px">🔔 Rappels</h3>
    <ul style="margin:0;padding-left:18px;line-height:1.7">${items.map(i=>`<li>${esc(i.t)} — <b>${quand(i.q)}</b></li>`).join("")}</ul>
  </div>`;
}

function icsDate(d){ return String(d).slice(0,10).replace(/-/g,""); }
function genererICS(){
  const items=evenementsCalendrier();
  let out="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Bureau etudiant//CA//FR\r\nCALSCALE:GREGORIAN\r\n";
  items.forEach((it,i)=>{
    const dt=icsDate(it.date); const uid2="ca-"+i+"-"+dt+"@bureau";
    out+="BEGIN:VEVENT\r\nUID:"+uid2+"\r\nDTSTART;VALUE=DATE:"+dt+"\r\nSUMMARY:"+String(it.type+" — "+it.titre).replace(/[\r\n,;]/g," ")+"\r\n";
    if(it.lieu) out+="LOCATION:"+String(it.lieu).replace(/[\r\n,;]/g," ")+"\r\n";
    out+="END:VEVENT\r\n";
  });
  out+="END:VCALENDAR\r\n";
  return out;
}

/* Jeton lié à l'adresse : empêche de désabonner quelqu'un en devinant simplement son e-mail. */
async function jetonDesabo(email){
  const e=String(email||"").toLowerCase().trim();
  try{
    const d=new TextEncoder().encode("be-desabo::"+e);
    const b=await crypto.subtle.digest("SHA-256",d);
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,16);
  }catch(err){ let h=0; for(let i=0;i<e.length;i++) h=(h*31+e.charCodeAt(i))|0; return "x"+(h>>>0).toString(16); }
}
async function lienDesabo(email){
  const base=(function(){ try{ return caAppUrl(); }catch(e){ return ""; } })();
  if(!base) return "";
  return base+"?desabo="+encodeURIComponent(email)+"&t="+(await jetonDesabo(email));
}
function ecranDesabo(corps){
  const html=`<div style="max-width:520px;margin:12vh auto;padding:28px;font-family:'Inter',system-ui,sans-serif;text-align:center;color:#1a1a2e">
    <h1 style="font-family:'Fraunces',serif;font-size:22px">Désabonnement</h1>${corps}
    <p style="margin-top:22px"><a href="${esc(location.pathname)}" style="color:#241c46;font-weight:bold">Retour</a></p>
  </div>`;
  const r=root(); if(r) r.innerHTML=html; else document.body.innerHTML=html;
}
async function pageDesabo(email, jeton){
  const e=String(email||"").toLowerCase().trim();
  if(!e) return ecranDesabo(`<p>Adresse manquante.</p>`);
  if(jeton!==(await jetonDesabo(e))) return ecranDesabo(`<p>Ce lien de désabonnement n'est pas valide. Contactez le Bureau étudiant.</p>`);
  ecranDesabo(`<p>Confirmez le désabonnement de <b>${esc(e)}</b> : vous ne recevrez plus aucun e-mail du Bureau étudiant.</p>
    <p><button id="desabo_ok" style="background:#241c46;color:#fff;border:none;padding:11px 20px;border-radius:8px;font:inherit;cursor:pointer">Confirmer mon désabonnement</button></p>
    <p id="desabo_msg" style="font-size:13px;color:#666"></p>`);
  const b=document.getElementById("desabo_ok");
  if(b) b.addEventListener("click", async ()=>{
    const m=document.getElementById("desabo_msg"); if(m) m.textContent="Enregistrement…";
    let ok=false;
    if(sb){ try{ const r=await sb.from("ca_desabonnes").upsert({email:e},{onConflict:"email"}); ok=!(r&&r.error); }catch(_){ ok=false; } }
    ecranDesabo(ok? `<p>L'adresse <b>${esc(e)}</b> a bien été désabonnée.</p>`
                  : `<p>Nous n'avons pas pu enregistrer votre désabonnement. Merci de contacter le Bureau étudiant.</p>`);
  });
}

async function loadConflits(){ try{ const {data}=await sb.from("ca_conflits").select("*").order("created_at",{ascending:true}); S.conflits=data||[]; }catch(e){ S.conflits=[]; } }
async function loadMessages(){ try{ const moi=(S.session&&S.session.id)||""; if(!moi){ S.messages=[]; return; } const {data}=await sb.from("ca_messages").select("*").or("from_id.eq."+moi+",to_id.eq."+moi).order("created_at",{ascending:true}); S.messages=(data||[]).map(m=>({id:m.id,fromId:m.from_id,to:m.to_id,texte:m.texte,fichier:m.fichier,ts:m.created_at})); }catch(e){ S.messages=[]; } }
async function loadDocs(){ try{ const {data}=await sb.from("ca_docs").select("*").order("created_at",{ascending:false}); S.docs=(data||[]).map(d=>({id:d.id,titre:d.titre,cat:d.categorie,chemin:d.chemin,cree_par_id:d.cree_par})); }catch(e){ S.docs=[]; } }

/* ---- onglet VOTES ---- */
/* ---- Majorité simple : plus de la moitié de l'EFFECTIF, pas des votants.
       19 membres → 10 voix requises. Pas de quorum de présence. ---- */
function effectifCA(){ return membresActifs().length; }
function seuilMajorite(){ const n=effectifCA(); return n?Math.floor(n/2)+1:0; }
function verdictVote(v){
  const n=effectifCA(), seuil=seuilMajorite(); if(!n) return "";
  const compte=oid=>(v.voters||[]).filter(x=>x.optionId===oid).length;
  let best=null, bestN=-1, exaequo=false;
  (v.options||[]).forEach(o=>{ const c=compte(o.id); if(c>bestN){ best=o; bestN=c; exaequo=false; } else if(c===bestN && c>0){ exaequo=true; } });
  const ouvert=v.statut==="open";
  const atteint = bestN>=seuil && !exaequo;
  const manque = Math.max(0,seuil-bestN);
  let txt, couleur;
  if(atteint){ txt=`Adopté — « ${esc(best.label)} » réunit ${bestN} voix sur ${n} membres (majorité simple : ${seuil}).`; couleur="var(--green)"; }
  else if(ouvert){ txt=`Majorité simple requise : ${seuil} voix sur ${n} membres. ${manque===0?"Égalité en tête, aucune option ne se dégage.":"Il manque "+manque+" voix à l'option en tête."}`; couleur="var(--ink-soft)"; }
  else if(exaequo && bestN>0){ txt=`Rejeté — égalité en tête à ${bestN} voix, aucune option n'atteint la majorité simple (${seuil} sur ${n}).`; couleur="var(--stamp)"; }
  else { txt=`Rejeté — meilleur score ${bestN} voix sur ${n} membres, il en fallait ${seuil}.`; couleur="var(--stamp)"; }
  return `<p style="margin:10px 0 0;font-size:13px;font-weight:600;color:${couleur}">${txt}</p>`;
}
function tabVotes(){
  const compose=`<div class="compose"><h3 class="serif">Nouvelle question</h3>
    <input class="f" id="v_q" placeholder="Ex. Thème de la soirée de rentrée ?">
    <div class="opt-inputs">${[0,1,2,3,4].map(i=>`<div class="oi"><input class="f" id="v_o${i}" placeholder="Option ${i+1}${i>1?" (facultatif)":""}"></div>`).join("")}</div>
    <label class="fld" style="display:block;margin-top:8px;font-size:13px">Documents joints (PDF, Word, images — facultatif)</label>
    <input class="f" type="file" id="v_files" multiple accept=".pdf,.doc,.docx,.odt,image/*">
    <label style="display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px"><input type="checkbox" id="v_notify"> Prévenir les membres par e-mail</label>
    <div class="row-btn"><button class="btn" data-action="add-vote">Lancer le vote</button></div></div>`;
  if(S.votes.length===0) return compose+`<div class="empty">Aucun vote. Lancez une question pour décider en groupe.</div>`;
  const list=S.votes.map(v=>{
    const total=v.voters.length; const count=oid=>v.voters.filter(x=>x.optionId===oid).length;
    const max=Math.max(0,...v.options.map(o=>count(o.id))); const open=v.statut==="open";
    const mien=monVote(v);
    const opts=v.options.map(o=>{const c=count(o.id);const pct=total?Math.round(c/total*100):0;const picked=mien&&mien.optionId===o.id;
      return `<div class="opt${c===max&&c>0?" lead":""}">${open?`<button class="pick" data-action="vpick" data-id="${v.id}" data-opt="${o.id}">${picked?"◉ ":"○ "}${esc(o.label)}</button>`:""}
        ${(!open||total>0)?`<div class="opt-top"><span class="ol">${esc(o.label)}</span><span class="oc">${c} · ${pct}%</span></div><div class="bar"><span style="width:${pct}%"></span></div>`:""}</div>`;}).join("");
    return `<div class="vote"><div class="vote-h"><h4 class="serif">${esc(v.question)}</h4><span class="badge ${open?"open":"closed"}">${open?"Ouvert":"Clos"}</span></div>
      ${(v.docs&&v.docs.length)?`<div style="margin:10px 0;display:flex;flex-wrap:wrap;gap:7px">${v.docs.map(d=>`<button class="chip" data-action="vdoc" data-path="${esc(d.path)}">📎 ${esc(d.name)}</button>`).join("")}</div>`:""}
      ${opts}${verdictVote(v)}${total?`<p class="voters">${total} votant${total>1?"s":""} : ${esc(v.voters.map(x=>x.nom).join(", "))}</p>`:""}
      ${open?blocRappel("vote",v):""}
      <div class="foot-line">${peutModifier(v.creeParId)?`<button class="link" data-action="vtoggle" data-id="${v.id}">${open?"Clore le vote":"Rouvrir"}</button>`:""}
        ${open && peutModifier(v.creeParId) ? `<button class="link" data-action="vote-relance" data-id="${v.id}">Relancer les non-votants</button>` : ""}
        ${peutModifier(v.creeParId)?`<button class="link" data-action="del-vote" data-id="${v.id}" style="margin-left:auto">Supprimer</button>`:""}</div>
      ${v.creePar?`<p class="by">créé par ${esc(v.creePar)}</p>`:""}</div>`;
  }).join("");
  return compose+list;
}

/* ---- onglet BILANS MORAUX (assistant anonyme) ---- */
function bilanEtat(){ return S.meta.bilanEtat || (S.meta.bilanActif?"ouvert":"ferme"); }
function bilanPublie(){ return String(S.meta.bilanPublie||""); }
/* Compteur seul : jamais la liste des déposants. */
function bilanNbDeposes(){ return (S.meta.bilanNbDeposes!==undefined)?S.meta.bilanNbDeposes:(S.meta.bilanSubmitters||[]).length; }
/* Les bilans bruts ne sont lisibles que par le secrétariat, et seulement après clôture. */
function peutLireBilans(){ return bilanEtat()==="cloture" && estSecretaire(); }
function bilanOnglet(){ return bilanEtat()!=="ferme" || !!bilanPublie(); }
function bilanTargets(){
  const moi=(S.session&&S.session.id)||null;
  return membresActifs().filter(a=>a.id!==moi).map(a=>({
    id:a.id,
    prenom:a.prenom||"",
    nom:a.nom||"",
    fonction:a.fonction||"",
    label:(((a.prenom||"")+" "+(a.nom||"")).trim()||a.email||"Membre")
  }));
}
/* Nom affiché d'une cible : membre inscrit, ou ancienne liste pour les bilans déjà déposés. */
function bilanNomCible(cid){
  const a=(S.admins||[]).find(x=>x.id===cid);
  if(a) return (((a.prenom||"")+" "+(a.nom||"")).trim()||a.email||"Membre");
  const p=PERSONNES.find(x=>x.id===cid);
  return p?(p.prenom+" "+p.nom):"Membre supprimé";
}
function bilanFonctionCible(cid){
  const a=(S.admins||[]).find(x=>x.id===cid);
  if(a) return a.fonction||"";
  const p=PERSONNES.find(x=>x.id===cid);
  return p?p.fonction:"";
}
/* Texte compilé, proposé à la secrétaire avant publication (elle peut le retoucher). */
function bilanTexteCompile(){
  const byCible={}; (S.bilans||[]).forEach(b=>{ (byCible[b.cible]=byCible[b.cible]||[]).push(b); });
  const lignes=[];
  Object.keys(byCible).forEach(cid=>{
    const l=byCible[cid];
    lignes.push(bilanNomCible(cid)+(bilanFonctionCible(cid)?" — "+bilanFonctionCible(cid):""));
    lignes.push("Points positifs :");
    const pos=l.map(x=>x.positifs).filter(Boolean);
    lignes.push(...(pos.length?pos.map(t=>"- "+t):["- —"]));
    lignes.push("Points à améliorer :");
    const am=l.map(x=>x.ameliorer).filter(Boolean);
    lignes.push(...(am.length?am.map(t=>"- "+t):["- —"]));
    lignes.push("");
  });
  return lignes.join("\n").trim();
}
function bilanCapture(){
  const ui=S.bilanUI; if(!ui) return; const T=bilanTargets();
  if(ui.step>=0 && ui.step<T.length){
    const pid=T[ui.step].id;
    ui.draft[pid]={positifs:val("bil_pos").trim(), ameliorer:val("bil_amel").trim()};
  }
}

    }
  }

  /* 3. Synthèse publiée : visible par tous les membres. */
  if(bilanPublie() && !(etat==="cloture" && peutLireBilans())){
    html += `<div class="compose"><h3 class="serif">Bilans moraux — synthèse publiée</h3>
      ${S.meta.bilanPublieLe?`<p class="by" style="margin:2px 0 8px">Publiée le ${esc(fmtQuand(S.meta.bilanPublieLe))}</p>`:""}
      <p style="white-space:pre-wrap;font-size:13.5px;line-height:1.6;color:var(--ink);margin:0">${esc(bilanPublie())}</p></div>`;
  }

  if(!html) html = `<div class="compose"><h3 class="serif">Bilans moraux</h3><p class="hint" style="margin:8px 0 0">Les bilans moraux ne sont pas ouverts pour le moment.</p></div>`;
  return html;
}

/* ---- Approbation formelle du PV : un PV n'a de valeur qu'une fois approuvé
       par le CA, en général à la réunion suivante. ---- */
function pvApprouve(m){ return m && m.pvStatut==="approuve"; }
function blocApprobationPV(m){
  const ok=pvApprouve(m);
  const badge = ok
    ? `<p style="margin:0;font-size:13px;font-weight:600;color:var(--green)">✓ PV approuvé${m.pvApprouveLe?" le "+esc(fmtQuand(m.pvApprouveLe)):""}${m.pvApprouveNote?` — ${esc(m.pvApprouveNote)}`:""}</p>`
    : `<p style="margin:0;font-size:13px;color:var(--stamp);font-weight:600">Projet de PV — non encore approuvé par le CA.</p>`;
  const boutons = estSecretaire()
    ? `<div class="row-btn" style="margin-top:8px">${ok
        ? `<button class="btn ghost sm" data-action="reu-pv-brouillon" data-id="${m.id}">Repasser en projet</button>`
        : `<button class="btn sm" data-action="reu-pv-approuver" data-id="${m.id}">Marquer le PV comme approuvé</button>`}</div>`
    : "";
  return `<div class="grp-h" style="margin-top:26px"><h2 class="serif">Procès-verbal</h2><span class="l"></span></div>
    <div class="card2">${badge}
      <p class="du" style="margin:8px 0 0">Tant qu'il n'est pas approuvé, le texte reste un projet : il peut être corrigé, et il n'engage pas le CA.</p>
      ${boutons}</div>`;
}

/* ---- onglet IDEES & AVIS : espace de contribution des coopte-es.
       Ils ecrivent, le CA lit. Aucune valeur decisionnelle. ---- */
/* Sondage consultatif sur une idee. Aucune valeur decisionnelle :
   les decisions du CA passent par l'onglet Votes, ou les cooptes n'entrent pas. */
const AVIS_CHOIX=[["pour","\ud83d\udc4d Pour"],["mitige","\ud83e\udd14 Mitig\u00e9"],["contre","\ud83d\udc4e Contre"]];
function barreAvisVote(avisId){
  const V=(S.avisVotes||[]).filter(v=>v.avisId===avisId);
  const moi=(S.session||{}).id;
  const mien=(V.find(v=>v.membreId===moi)||{}).valeur||"";
  const n=v=>V.filter(x=>x.valeur===v).length;
  const boutons=AVIS_CHOIX.map(([k,lab])=>`<button class="chip" data-action="avis-vote" data-id="${avisId}" data-val="${k}" style="${mien===k?"background:var(--ink);color:#fff;border-color:var(--ink)":""}">${lab}${n(k)?" \u00b7 "+n(k):""}</button>`).join("");
  return `<div style="margin:10px 0 0">
    <div style="display:flex;flex-wrap:wrap;gap:7px">${boutons}${mien?`<button class="link" data-action="avis-vote" data-id="${avisId}" data-val="" style="font-size:12px">retirer mon avis</button>`:""}</div>
    <p class="du" style="margin:6px 0 0;font-size:11.5px">Sondage indicatif \u2014 il n'engage pas le CA.</p></div>`;
}
function tabAvis(){
  const A=(S.avis||[]).slice();
  const moi=(S.session||{}).id;
  const invit = peutGererCooptes() ? `<div class="card2" style="margin-bottom:16px">
    <h3 class="serif" style="margin-top:0">Inviter un\u00b7e coopt\u00e9\u00b7e</h3>
    <p class="du" style="margin:0 0 8px">Ce lien permet \u00e0 une personne coopt\u00e9e de cr\u00e9er un compte. Elle acc\u00e9dera \u00e0 l'agenda des \u00e9v\u00e9nements et \u00e0 cet espace, et \u00e0 rien d'autre. Sa demande doit \u00eatre valid\u00e9e par le propri\u00e9taire.</p>
    ${S.meta.codeCoopte?`<p style="color:var(--slate);font-size:12px;margin:0 0 8px">Code en cours : <b>${esc(S.meta.codeCoopte)}</b> \u00b7 ${cooptesActifs().length} coopt\u00e9\u00b7e(s) valid\u00e9\u00b7e(s)</p>`:""}
    <div class="row-btn"><button class="btn" data-action="coopte-lien">Copier le lien d'invitation</button>
      ${S.meta.codeCoopte?`<button class="btn ghost" data-action="coopte-newcode">G\u00e9n\u00e9rer un nouveau code</button>`:""}</div></div>` : "";
  const compose = invit + `<div class="compose"><h3 class="serif">D\u00e9poser un avis ou une id\u00e9e</h3>
    <p style="color:var(--ink-soft);font-size:13px;margin:0 0 8px">${estCoopte()?"Vos contributions sont lues par les membres du CA. Elles n'ont pas valeur de vote : les d\u00e9cisions restent prises par le conseil.":"Vous pouvez aussi d\u00e9poser une id\u00e9e ici."}</p>
    <input class="f" id="av_sujet" placeholder="Sujet (ex. Organisation de la soir\u00e9e de rentr\u00e9e)">
    <textarea class="f" id="av_texte" rows="4" placeholder="Votre avis, votre proposition\u2026"></textarea>
    <div class="row-btn"><button class="btn" data-action="avis-add">Envoyer</button></div></div>`;
  if(!A.length) return compose+`<div class="empty">Aucune contribution pour l'instant.</div>`;
  const list=A.map(x=>`<div class="vote">
    <div class="vote-h"><h4 class="serif">${esc(x.sujet||"Sans sujet")}</h4><span class="badge">${esc(x.auteur||"")}</span></div>
    <p style="white-space:pre-wrap;margin:8px 0 0;font-size:14px">${esc(x.texte||"")}</p>
    ${barreAvisVote(x.id)}
    <div class="foot-line"><span class="by">${x.ts?esc(fmtQuand(x.ts)):""}</span>
      ${(x.membreId===moi||(S.session&&S.session.role==="owner"))?`<button class="link" data-action="avis-del" data-id="${x.id}" style="margin-left:auto">Supprimer</button>`:""}</div></div>`).join("");
  return compose+list;
}

/* ---- onglet RÉUNIONS (ordre du jour, présences, PV) ---- */
function tabReunions(){

        ${(!pt.parId || (S.session && (S.session.id===pt.parId || S.session.role==="owner"))) ? `<button class="link" data-action="reu-delpoint" data-pt="${pt.id}">✕</button>` : ""}</div>
      ${(estSecretaire()&&pt.fait&&pt.notes)?`<button class="link" data-action="pt-tache" data-pt="${pt.id}" style="font-size:12px">➕ Cr\u00e9er une t\u00e2che depuis cette d\u00e9cision</button>`:""}
      <textarea data-change="reunote" data-pt="${pt.id}" ${estSecretaire()?"":"readonly style=\"opacity:.75\""} placeholder="${estSecretaire()?"Notes / décisions (pour le PV)…":"Notes rédigées par le secrétariat"}">${esc(pt.notes||"")}</textarea></div>`).join(""):`<div class="empty">Aucun point à l'ordre du jour.</div>`;

function blocPresence(evId){

  const meId=S.session&&S.session.id;

  const b=(r,lbl,col)=>`<button class="btn ghost sm" data-action="ev-presence" data-id="${evId}" data-r="${r}" style="${mr===r?("border-color:"+col+";color:"+col):""}">${lbl}</button>`;
  return `<div class="compose" style="padding:12px 14px">
    <div style="display:flex;gap:8px;flex-wrap:wrap">${b("oui","✅ Je viens ("+c("oui")+")","var(--green)")}${b("non","❌ Je ne viens pas ("+c("non")+")","var(--red)")}${b("peut","🤔 Peut-être ("+c("peut")+")","var(--amber)")}</div>
    <p class="by" style="margin-top:10px">Présents : ${noms("oui")}<br>Absents : ${noms("non")}<br>Peut-être : ${noms("peut")}</p>
  </div>`;
}

/* ---- onglet CALENDRIER ---- */
function tabCalendrier(){
  const evs=evenementsCalendrier();
  const now=new Date();
  let cur = S.calMonth ? new Date(S.calMonth+"-01T00:00") : new Date(now.getFullYear(), now.getMonth(), 1);
  if(isNaN(cur.getTime())) cur=new Date(now.getFullYear(), now.getMonth(), 1);
  const y=cur.getFullYear(), mo=cur.getMonth();
  const first=new Date(y,mo,1); const startDow=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,mo+1,0).getDate();
  const moLabel=cur.toLocaleDateString("fr-BE",{month:"long",year:"numeric"});
  const key=y+"-"+String(mo+1).padStart(2,"0");
  const byDay={}; evs.forEach(e=>{ if(e.date.slice(0,7)===key){ const d=parseInt(e.date.slice(8,10),10); (byDay[d]=byDay[d]||[]).push(e); } });
  const todayStr=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
  const cells=[];
  for(let i=0;i<startDow;i++) cells.push(`<div class="cal-cell cal-empty"></div>`);
  for(let d=1;d<=daysInMonth;d++){
    const ds=key+"-"+String(d).padStart(2,"0"); const list=byDay[d]||[];
    cells.push(`<div class="cal-cell${ds===todayStr?" cal-today":""}"><div class="cal-d">${d}</div>${list.map(e=>`<div class="cal-ev-chip ${e.cls}" title="${esc(e.type+" : "+e.titre+(e.lieu?(" \u2014 "+e.lieu):""))}">${esc(e.titre)}</div>`).join("")}</div>`);
  }
  const prevKey=(()=>{ const p=new Date(y,mo-1,1); return p.getFullYear()+"-"+String(p.getMonth()+1).padStart(2,"0"); })();
  const nextKey=(()=>{ const p=new Date(y,mo+1,1); return p.getFullYear()+"-"+String(p.getMonth()+1).padStart(2,"0"); })();
  const dows=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
  const aVenir=evs.filter(e=>e.date>=todayStr).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,10);
  return `<div class="compose">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <h3 class="serif" style="margin:0;text-transform:capitalize">${esc(moLabel)}</h3>
      <div class="row-btn" style="margin:0">
        <button class="btn ghost sm" data-action="cal-nav" data-mo="${prevKey}">\u25c0</button>
        <button class="btn ghost sm" data-action="cal-today2">Aujourd'hui</button>
        <button class="btn ghost sm" data-action="cal-nav" data-mo="${nextKey}">\u25b6</button>
        <button class="btn sm" data-action="cal-ics">\u2b07 Exporter (.ics)</button>
      </div>
    </div>
    <div class="cal-legend"><span class="cal-ev-chip cal-reu">R\u00e9union</span><span class="cal-ev-chip cal-ev">\u00c9v\u00e9nement</span><span class="cal-ev-chip cal-tache">\u00c9ch\u00e9ance t\u00e2che</span></div>
    <div class="cal-grid-h">${dows.map(d=>`<div>${d}</div>`).join("")}</div>
    <div class="cal-grid">${cells.join("")}</div>
    <p style="font-size:11.5px;color:var(--slate);margin:10px 0 0">Le calendrier reprend automatiquement vos r\u00e9unions, \u00e9v\u00e9nements et \u00e9ch\u00e9ances de t\u00e2ches. L'export .ics s'ouvre dans Google Agenda, Apple Calendrier, Outlook\u2026</p>
  </div>
  <div class="compose">
    <h3 class="serif">\u00c0 venir</h3>
    ${aVenir.length? `<div class="mail-hist">${aVenir.map(e=>`<div class="mail-hist-row"><span class="mail-hist-txt"><b>${esc(e.type)}</b> \u2014 ${esc(e.titre)}${e.lieu?` <span style="color:var(--slate)">(${esc(e.lieu)})</span>`:""}</span><span class="mail-hist-meta">${esc(fmtDateLong(e.date))}</span></div>`).join("")}</div>` : `<div class="empty">Rien de pr\u00e9vu.</div>`}
  </div>`;
}

/* ---- Notification e-mail : nouvelle demande d'inscription ---- */
async function traiterInscriptions(){
  if(!sb||!S.session) return;
  if(S.session.statut!=="actif") return;                 // seul un membre actif d\u00e9clenche l'envoi
  const attentes=(S.admins||[]).filter(a=>a.statut==="attente");
  if(!attentes.length) return;
  const owners=(S.admins||[]).filter(a=>a.email && a.statut==="actif" && a.role==="owner").map(a=>a.email);
  if(!owners.length) return;
  for(const a of attentes){
    try{
      /* Cle datee : une demande refusee puis renouvelee redeclenche l'alerte.
         On marque APRES l'envoi, sinon un envoi rate bloquerait l'alerte pour toujours. */
      const cle="inscription:"+a.id+":"+todayISO();
      const deja=await sb.from("ca_rappels_envoyes").select("cle").eq("cle",cle).maybeSingle();
      if(deja&&deja.data) continue;
      const nom=((a.prenom||"")+" "+(a.nom||"")).trim()||a.email||"Nouveau membre";
      const estC = !!a.viaCode;
      await envoyerNotifCAListe(owners, estC?"Nouvelle demande \u2014 coopt\u00e9\u00b7e":"Nouvelle demande d'inscription en attente",
        ("<p>Une nouvelle demande est <b>en attente de validation</b>"+(estC?" \u2014 <b>coopt\u00e9\u00b7e</b> (code "+caMailEsc(a.viaCode)+")":"")+" :</p><p><b>"+caMailEsc(nom)+"</b>"+(a.fonction?(" \u2014 "+caMailEsc(a.fonction)):"")+"</p><p>"+caMailEsc(a.email||"")+"</p><p>Connectez-vous \u00e0 l'espace CA pour la valider.</p>"), true);
      try{ await sb.from("ca_rappels_envoyes").insert({cle:cle}); }catch(_){ }
      logAct("Notification d'inscription envoy\u00e9e pour "+nom);
    }catch(e){}
  }
}

/* ---- pseudo-onglet RECHERCHE globale ---- */
function tabSearch(){
  const q=(S.searchQ||"").trim().toLowerCase();
  const compose=`<div class="compose"><h3 class="serif">Recherche</h3>
    <input class="f" id="search_q" data-change="search" value="${esc(S.searchQ||"")}" placeholder="Tâche, contact, événement, annonce, membre…" autofocus>
    <div class="row-btn"><button class="btn sm" data-action="noop">Rechercher</button></div></div>`;
  if(q.length<2) return compose+`<div class="empty">Tapez au moins 2 caractères, puis validez (Entrée).</div>`;
  const res=[];
  const add=(label,sub,tab)=>res.push({label,sub,tab});
  (S.taches||[]).forEach(t=>{ if((t.titre||"").toLowerCase().includes(q)) add(t.titre,"Tâche","taches"); });
  (S.contacts||[]).forEach(c=>{ if([c.nom,c.email,c.notes,c.type].some(x=>(x||"").toLowerCase().includes(q))) add(c.nom,"Contact · "+(c.type||""),"contacts"); });
  (S.annonces||[]).forEach(a=>{ if([a.texte,a.auteur].some(x=>(x||"").toLowerCase().includes(q))) add((a.texte||"").slice(0,60),"Annonce · "+(a.auteur||""),"annonces"); });
  (S.evenements||[]).forEach(e=>{ if([e.titre,e.lieu,e.responsable].some(x=>(x||"").toLowerCase().includes(q))) add(e.titre,"Événement","evenements"); });
  (S.reunions||[]).forEach(m=>{ if((m.titre||"").toLowerCase().includes(q)) add(m.titre,"Réunion","reunions"); });
  (S.budgets||[]).forEach(b=>{ if([b.titre,b.desc].some(x=>(x||"").toLowerCase().includes(q))) add(b.titre,"Budget & projet","budgets"); });
  (S.docs||[]).forEach(d=>{ if([d.titre,d.cat].some(x=>(x||"").toLowerCase().includes(q))) add(d.titre,"Document","docs"); });
  PERSONNES.forEach(p=>{ if((p.prenom+" "+p.nom+" "+p.fonction).toLowerCase().includes(q)) add(p.prenom+" "+p.nom,"Membre · "+p.fonction,"org"); });
  if(res.length===0) return compose+`<div class="empty">Aucun résultat pour « ${esc(S.searchQ)} ».</div>`;
  const rows=res.slice(0,50).map(r=>`<button class="msg-row" data-action="set-tab" data-tab="${r.tab}"><span><span class="nm">${esc(r.label)}</span><br><span class="fn">${esc(r.sub)}</span></span></button>`).join("");
  return compose+`<div class="msg-list">${rows}</div>`;
}

      .catch(()=>{ if(window.alert) window.alert("Impossible de lire ce fichier. Formats acceptés : .xlsx, .xls, .csv"); });

    /* budgets */
    case "add-budget": { const t=val("b_titre").trim(); if(!t||!sb) return; const cout=parseFloat(String(val("b_cout")).replace(",","."))||0;
      const ins=await sb.from("ca_budgets").insert({titre:t,type:val("b_type"),cout:cout,description:val("b_desc").trim(),demandeur:me.sig,statut:"vote",cree_par:S.session.id});
      if(ins&&ins.error){ modaleInfo("La demande n'a pas pu être enregistrée : "+ins.error.message); break; }
      await loadBudgets(); render();
      /* Un budget soumis au vote est toujours notifié : ce n'est pas une info facultative. */
      let res=null;
      try{ res=await notifCreationCA("Nouveau budget/projet soumis au vote", t, cout?(cout.toFixed(2)+" €"):""); }
      catch(e){ res=null; }
      const exclus = (res&&res.desabonnes)? " "+res.desabonnes+" adresse(s) désabonnée(s) ont été écartées." : "";
      if(!res || res.total===0){ modaleInfo("Demande enregistrée, mais aucun e-mail n'a pu être envoyé : aucun destinataire disponible."+exclus, "Budget soumis au vote"); }
      else if(res.err && !res.ok){ modaleInfo("Demande enregistrée, mais l'envoi des e-mails a échoué. Vérifiez la connexion et prévenez les membres autrement."+exclus, "Budget soumis au vote"); }
      else if(res.err){ modaleInfo(res.ok+" membre(s) prévenu(s), "+res.err+" échec(s)."+exclus, "Budget soumis au vote"); }
      else { modaleInfo("✓ "+res.total+" membre(s) prévenu(s) par e-mail."+exclus, "Budget soumis au vote"); }
      break; }
    case "bvote": { if(!sb) break; const b=(S.budgets||[]).find(x=>x.id===id); if(!b||b.statut!=="vote") break; const r=await sb.from("ca_budget_votes").upsert({budget_id:id,membre_id:S.session.id,nom:me.sig,choix:el.dataset.choix},{onConflict:"budget_id,membre_id"}); if(r&&r.error){ if(window.alert) window.alert("Vote non enregistré : "+r.error.message); break; } await loadBudgets(); render(); break; }
    case "bdecide": { if(!estPresidente()||!sb) break; const st=el.dataset.st; await sb.from("ca_budgets").update({statut:st,decide_par:st==="vote"?null:me.sig,decide_le:st==="vote"?null:new Date().toISOString()}).eq("id",id); await loadBudgets(); render(); break; }
    case "del-budget": { if(!estPresidente()||!sb) break; if(!(await modaleConfirm("Supprimer cette demande de budget ?"))) break; await sb.from("ca_budgets").delete().eq("id",id); logAct("Budget supprimé"); await loadBudgets(); render(); break; }
    /* votes */
    case "add-vote": { const q=val("v_q").trim(); const opts=[0,1,2,3,4].map(i=>val("v_o"+i).trim()).filter(Boolean); if(!q||opts.length<2||!sb) return;
      let vdocs=[];
      const fEl=document.getElementById("v_files");
      if(fEl&&fEl.files&&fEl.files.length){
        for(const f of fEl.files){
          const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,"_"); const path=uid()+"-"+safe;
          const up=await sb.storage.from("ca-documents").upload(path,f);
          if(up&&up.error){ if(window.alert) window.alert("Échec du document « "+f.name+" » : "+up.error.message); continue; }
          vdocs.push({name:f.name,path:path});
        }
      }
      const {data,error}=await sb.from("ca_votes").insert({question:q,statut:"open",cree_par:S.session.id,docs:vdocs}).select().single(); if(error||!data) break; await sb.from("ca_vote_options").insert(opts.map(l=>({vote_id:data.id,label:l}))); await loadVotes(); { const vn=document.getElementById("v_notify"); if(vn&&vn.checked){ notifVoteCA(q); } } render(); break; }
    case "vpick": { if(!sb) break; const v=(S.votes||[]).find(x=>x.id===id); if(!v||v.statut!=="open") break; const r=await sb.from("ca_vote_ballots").upsert({vote_id:id,membre_id:S.session.id,option_id:el.dataset.opt,nom:me.sig},{onConflict:"vote_id,membre_id"}); if(r&&r.error){ if(window.alert) window.alert("Vote non enregistré : "+r.error.message); break; } await loadVotes(); render(); break; }
    case "vdoc": { if(!sb) break; const {data,error}=await sb.storage.from("ca-documents").createSignedUrl(el.dataset.path,3600);
      if(error||!data){ if(window.alert) window.alert("Document introuvable."); break; }
      window.open(data.signedUrl,"_blank","noopener"); break; }
    case "vtoggle": { if(!sb) break; const v=(S.votes||[]).find(x=>x.id===id); if(!v) break; await sb.from("ca_votes").update({statut:v.statut==="open"?"closed":"open"}).eq("id",id); await loadVotes(); render(); break; }
    case "del-vote": if(!sb) break; await sb.from("ca_votes").delete().eq("id",id); await loadVotes(); render(); break;
    /* documents */

    case "upload-doc": {
      const t=val("d_titre").trim(), cat=val("d_cat");
      const derr=m=>{ const el2=document.getElementById("d_err"); if(el2){el2.textContent=m;el2.style.display="block";} };
      const fi=document.getElementById("d_file"); const file=fi&&fi.files&&fi.files[0];
      if(!t) return derr("Donnez un nom au document.");
      if(!file) return derr("Choisissez un fichier.");
      if(!sb) return derr("Serveur indisponible.");
      derr("Envoi en cours…"); const el3=document.getElementById("d_err"); if(el3) el3.style.color="var(--ink-soft)";
      const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      const path=uid()+"-"+safe;
      const up=await sb.storage.from("ca-documents").upload(path, file);
      if(up && up.error) return derr("Échec de l'envoi : "+up.error.message);
      const ins=await sb.from("ca_docs").insert({ titre:t, categorie:cat, chemin:path, cree_par:S.session.id });
      if(ins && ins.error) return derr("Fichier envoyé mais non enregistré : "+ins.error.message);
      await loadDocs();
      { const dn=document.getElementById("d_notify"), dt=document.getElementById("d_treso"); if(dn&&dn.checked){ notifDocCA(t, cat, !!(dt&&dt.checked)); } }
      render(); break;
    }
    case "open-doc": {
      const d=(S.docs||[]).find(x=>x.id===id); if(!d) break;
      const {data,error}=await sb.storage.from("ca-documents").createSignedUrl(d.chemin, 3600);
      if(error||!data){ if(window.alert) window.alert("Impossible d'ouvrir le fichier."); break; }
      window.open(data.signedUrl, "_blank"); break;
    }
    case "del-doc": {
      const d=(S.docs||[]).find(x=>x.id===id); if(!d) break;
      if(!((S.session&&S.session.role==="owner")||d.cree_par_id===(S.session&&S.session.id))) break;
      if(!(await modaleConfirm("Supprimer ce document ?"))) break;
      try{ await sb.storage.from("ca-documents").remove([d.chemin]); }catch(e){}
      try{ await sb.from("ca_docs").delete().eq("id",id); }catch(e){}
      await loadDocs(); render(); break;
    }
    /* annonces */
    case "add-annonce": { const tx=val("a_txt").trim(); if(!tx) return; if(!sb) break; await sb.from("ca_annonces").insert({auteur:me.sig,texte:tx,cree_par:S.session.id}); await loadAnnonces(); { const an=document.getElementById("an_notify"); if(an&&an.checked){ notifAnnonceCA(tx); } } render(); break; }
    case "ev-presence": { if(!sb||!me) break; const r=el.dataset.r; const nom=(me.nom||me.sig||"").trim();
      const mine=(S.presence||[]).find(x=>x.evenement_id===id&&x.membre_id===me.id);
      if(mine&&mine.reponse===r){ await sb.from("ca_event_presence").delete().eq("evenement_id",id).eq("membre_id",me.id); }
      else if(mine){ await sb.from("ca_event_presence").update({reponse:r,nom:nom}).eq("evenement_id",id).eq("membre_id",me.id); }
      else { await sb.from("ca_event_presence").insert({evenement_id:id,membre_id:me.id,nom:nom,reponse:r}); }
      await loadPresence(); render(); break; }
    case "rappel-now": { if(!sb) break; await appelRappel(el.dataset.type, id, null); break; }
    case "rappel-prog": { if(!sb) break;
      const inp=document.querySelector('[data-rappel-when="'+id+'"]');
      const v=inp&&inp.value;
      if(!v){ modaleInfo("Choisissez d'abord une date et une heure dans le champ à côté du bouton."); break; }
      const t=new Date(v);
      if(isNaN(t.getTime())){ modaleInfo("Date invalide."); break; }
      if(t.getTime()<Date.now()){ modaleInfo("Cette date est déjà passée."); break; }
      await appelRappel(el.dataset.type, id, t.toISOString()); break; }
    case "rappel-annuler": { if(!sb) break; const tbl=({budget:"ca_budgets",vote:"ca_votes",evenement:"ca_evenements"})[el.dataset.type]; if(!tbl) break;
      await sb.from(tbl).update({rappel_prog_at:null}).eq("id",id); await rechargerObjet(el.dataset.type); render(); break; }
    case "vote-relance": { if(!sb) break; await appelRappel("vote", id, null); break; }
    case "del-annonce": { if(!sb) break; const a=(S.annonces||[]).find(x=>x.id===id); if(!peutModifier(a&&a.creeParId)) break; if(!(await modaleConfirm("Supprimer cette annonce ?"))) break; await sb.from("ca_annonces").delete().eq("id",id); await loadAnnonces(); render(); break; }
  }
});

async function boot(){
  try{ const params=new URLSearchParams(location.search); if(params.get("desabo")!=null){ await pageDesabo(params.get("desabo"), params.get("t")||""); return; } }catch(e){}
  /* Lien de participation : ?go=bilan mène à l'onglet Bilans moraux, après connexion. */
  try{ const params=new URLSearchParams(location.search); const g=params.get("go");
    const c=params.get("c");
    const retourAuth = /access_token|type=signup|type=magiclink|type=invite/.test(String(location.hash||""));
    if(g){ S.goto=g; S.view="ca"; try{ sessionStorage.setItem("ca:goto",g); }catch(_){ } }
    else if(retourAuth){
      /* Uniquement au retour du lien de confirmation : sinon l'adresse normale
         doit afficher la page d'accueil Caisse / CA. */
      try{ const m=sessionStorage.getItem("ca:goto"); if(m){ S.goto=m; S.view="ca"; } }catch(_){ }
    }
    if(g==="coopte"){ S.authMode="signup"; }
    if(c){ S.viaCode=c; try{ sessionStorage.setItem("ca:c",c); }catch(_){ } }
    else if(retourAuth){ try{ const m=sessionStorage.getItem("ca:c"); if(m) S.viaCode=m; }catch(_){ } }
  }catch(e){}
  /* Retour depuis le lien de confirmation d'e-mail : Supabase renvoie sur la racine,
     on repart directement dans l'espace CA plutot que sur la page d'accueil. */
  try{ const h=String(location.hash||"");
    if(/access_token|type=signup|type=magiclink|type=invite/.test(h)) S.view="ca";
  }catch(e){}
  if(!sb){ render(); return; }
  try{ const h=String(location.hash||""); if(/type=recovery/.test(h)||/[?&]type=recovery/.test(location.search)){ S.recovery=true; } }catch(e){}
  try{ await refreshSession(); }catch(e){} render();
  if(S.session){ traiterEnvoisProgrammes().then(()=>{ if(S.tab==="mail") render(); }).catch(()=>{}); traiterRappels().catch(()=>{}); traiterRecapIdees().catch(()=>{}); traiterInscriptions().catch(()=>{}); }
  try{ sb.auth.onAuthStateChange(async (evt)=>{ if(evt==="PASSWORD_RECOVERY"){ S.recovery=true; render(); return; } if(S.recovery) return; await refreshSession(); render(); }); }catch(e){} }
boot();

</script>
