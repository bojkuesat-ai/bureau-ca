        <p style="color:var(--ink-soft);font-size:14px;line-height:1.55;margin:8px auto 0;max-width:520px">Vous allez remplir un court bilan pour chaque membre du bureau. Pour chacun, indiquez ses <b style="color:var(--green)">points positifs</b> et ses <b style="color:var(--stamp)">points à améliorer</b>. Vos réponses sont <b>anonymes</b> : elles ne portent aucune trace de leur auteur, elles sont mélangées à celles des autres dès l'envoi, et personne ne peut les lire pendant la collecte. Après la clôture, le secrétariat lit l'ensemble sans savoir qui a écrit quoi, puis publie une synthèse.</p>
        <div class="row-btn" style="justify-content:center;margin-top:16px"><button class="btn" data-action="bilan-start">Commencer →</button></div></div>`;
    } else if(ui.step>=0 && ui.step<T.length){
      const p=T[ui.step]; const d=ui.draft[p.id]||{};
      html += `<div class="compose">
        <p class="by" style="margin:0 0 4px">Étape ${ui.step+1} / ${T.length}</p>
        <h3 class="serif" style="font-size:20px;margin:0">Bilan de ${esc(p.label)}</h3>
        <p style="color:var(--ink-soft);font-size:12.5px;margin:2px 0 10px">${esc(p.fonction)}</p>
        <label style="display:block;font-size:12px;font-weight:600;color:var(--green)">Points positifs</label>
        <p style="color:var(--slate);font-size:11.5px;margin:2px 0 0">Ce qui a bien fonctionné, à conserver.</p>
        <textarea id="bil_pos" placeholder="Ses points forts…">${esc(d.positifs||"")}</textarea>
        <label style="display:block;font-size:12px;font-weight:600;color:var(--stamp);margin:8px 0 0">Points à améliorer</label>
        <p style="color:var(--slate);font-size:11.5px;margin:2px 0 0">Ce qui n'a pas marché ou pourrait être mieux.</p>
        <textarea id="bil_amel" placeholder="Ce qui pourrait être amélioré…">${esc(d.ameliorer||"")}</textarea>
        <div class="foot-line" style="border-top:none;padding-top:6px">
          <button class="btn ghost sm" data-action="bilan-prev">← Précédent</button>
          <button class="btn sm" data-action="bilan-next" style="margin-left:auto">${ui.step===T.length-1?"Voir le récapitulatif →":"Suivant →"}</button>
        </div></div>`;
    } else {
      html += `<div class="compose"><h3 class="serif">Récapitulatif</h3>
        <p style="color:var(--ink-soft);font-size:13px;margin:0">Relisez vos réponses. Vous pouvez revenir en modifier une, puis envoyer. <b>L'envoi est définitif.</b></p></div>`;
      html += T.map((p,i)=>{ const d=ui.draft[p.id]||{}; return `<div class="vote"><div class="vote-h"><div>
          <h4 class="serif" style="font-size:16px">${esc(p.label)}</h4>
          <p class="by" style="margin:2px 0 0">${esc(p.fonction)}</p></div>
          <button class="link" data-action="bilan-goto" data-i="${i}">Modifier</button></div>
        <p class="b-desc"><b style="color:var(--green)">Positifs — </b>${d.positifs?esc(d.positifs):"<span style='color:var(--slate)'>—</span>"}</p>
        <p class="b-desc" style="margin-top:4px"><b style="color:var(--stamp)">À améliorer — </b>${d.ameliorer?esc(d.ameliorer):"<span style='color:var(--slate)'>—</span>"}</p></div>`;}).join("");
      html += `<div class="foot-line" style="border-top:none">
        <button class="btn ghost sm" data-action="bilan-prev">← Revenir</button>
        <button class="btn" data-action="bilan-send" style="margin-left:auto">Envoyer mes bilans (anonyme)</button></div>`;
    }
    if(estSecretaire()||(S.session&&S.session.role==="owner")){
      const rendus=bilanNbDeposes(); const attendus=membresActifs().length; const manquants=Math.max(0,attendus-rendus);
      const relanceOk = manquants>=CA_SEUIL_RELANCE;
      html += `<div class="card2" style="margin-top:22px"><h3 class="serif" style="margin-top:0">Suivi de la campagne</h3>
        <p class="du" style="font-size:22px;color:var(--ink);margin:0 0 4px"><b>${rendus}/${attendus}</b></p>
        <p class="du" style="margin:0">bilan(s) déposé(s) — il en manque ${manquants}. Le contenu reste illisible tant que la campagne n'est pas clôturée, et vous ne pouvez pas savoir qui a déposé.</p>
        ${S.meta.bilanRelanceLe?`<p class="by" style="margin:8px 0 0">Dernier rappel envoyé le ${esc(fmtQuand(S.meta.bilanRelanceLe))}.</p>`:""}
        <div class="row-btn">
          ${manquants>0?`<button class="btn ghost" data-action="bilan-relance"${relanceOk?"":" disabled"}>Relancer les ${manquants} manquant(s)</button>`:""}
          ${estSecretaire()?`<button class="btn" data-action="bilan-cloturer">Clôturer la campagne</button>`:""}
        </div>
        ${(manquants>0&&!relanceOk)?`<p class="hint" style="margin:8px 0 0;color:var(--stamp)">Rappel désactivé : avec moins de ${CA_SEUIL_RELANCE} manquants, savoir qu'un mail est parti reviendrait à désigner les personnes. Passez par une annonce générale.</p>`:""}
        ${relanceOk?`<p class="hint" style="margin:8px 0 0">Le rappel part uniquement à ceux qui n'ont pas encore déposé, un mail par personne. La liste est établie sur le serveur : ni vous ni l'application ne la recevez.</p>`:""}
        <div class="row-btn" style="margin-top:10px"><button class="btn ghost sm" data-action="bilan-lien">Copier le lien de participation</button></div>
        <p class="hint" style="margin:6px 0 0">À diffuser dans le groupe. Il ouvre directement les bilans moraux ; ceux qui n'ont pas de compte pourront en créer un, mais devront être validés avant de participer.</p></div>`;
    }
  }

  /* 2. Après clôture : le secrétariat lit, prépare et publie. */
  if(etat==="cloture"){
    if(peutLireBilans()){
      const byCible={}; (S.bilans||[]).forEach(b=>{ (byCible[b.cible]=byCible[b.cible]||[]).push(b); });
      const total=(S.bilans||[]).length;
      html += `<div class="compose"><h3 class="serif">Bilans moraux — campagne clôturée</h3>
        <p style="color:var(--ink-soft);font-size:13px;margin:4px 0 0">Vous êtes la seule personne à voir ces retours bruts. Ils sont <b>anonymes et mélangés</b> : rien n'indique qui a écrit quoi, et l'ordre d'affichage ne suit pas l'ordre des dépôts. Relisez-les, préparez le texte à publier (vous pouvez retirer ou reformuler ce qui doit l'être), puis publiez-le : il devient alors visible par tous les membres et leur est envoyé par e-mail.</p></div>`;
      html += `<div class="grp-h" style="margin:24px 0 12px"><h2 class="serif">Retours reçus (anonymes)</h2><span class="c">${total}</span><span class="l"></span></div>`;
      if(!total){ html += `<div class="empty">Aucun retour déposé.</div>`; }
      else {
        html += Object.keys(byCible).map(cid=>{
          const list=byCible[cid];
          const pos=list.map(x=>x.positifs).filter(Boolean);
          const am=list.map(x=>x.ameliorer).filter(Boolean);
          return `<div class="vote"><div class="vote-h"><div><h4 class="serif" style="font-size:16px">${esc(bilanNomCible(cid))}</h4><p class="by" style="margin:2px 0 0">${esc(bilanFonctionCible(cid))} · ${list.length} retour(s)</p></div></div>
            ${pos.length?`<p class="b-desc"><b style="color:var(--green)">Points positifs</b></p><ul style="margin:2px 0 6px;padding-left:18px">${pos.map(t=>`<li style="font-size:13px;color:var(--ink-soft);margin:0 0 3px">${esc(t)}</li>`).join("")}</ul>`:""}
            ${am.length?`<p class="b-desc"><b style="color:var(--stamp)">Points à améliorer</b></p><ul style="margin:2px 0 0;padding-left:18px">${am.map(t=>`<li style="font-size:13px;color:var(--ink-soft);margin:0 0 3px">${esc(t)}</li>`).join("")}</ul>`:""}</div>`;
        }).join("");
        html += `<div class="compose" style="margin-top:22px"><h3 class="serif">Texte à publier</h3>
          <p style="color:var(--ink-soft);font-size:13px;margin:0 0 8px">Cliquez sur « Préparer » pour pré-remplir le texte à partir des retours, corrigez-le librement, puis publiez.</p>
          <textarea id="bil_pub" data-change="bilpub" style="min-height:220px" placeholder="Le texte publié apparaîtra ici…">${esc(S.bilanPubDraft!==undefined?S.bilanPubDraft:bilanPublie())}</textarea>
          <div class="row-btn"><button class="btn ghost" data-action="bilan-preparer">Préparer le texte</button>
            <button class="btn ghost" data-action="generate-bilan">Version imprimable</button>
            <button class="btn" data-action="bilan-publier">Publier et prévenir les membres</button></div>
          ${bilanPublie()?`<p class="hint" style="margin:10px 0 0;color:var(--green)">✓ Une version est déjà publiée${S.meta.bilanPublieLe?" ("+esc(fmtQuand(S.meta.bilanPublieLe))+")":""}. Republier remplace la précédente.</p>`:""}</div>`;
      }
    } else if(!bilanPublie()){
      html += `<div class="compose"><h3 class="serif">Bilans moraux</h3><p class="hint" style="margin:8px 0 0">La campagne est clôturée. Le secrétariat relit les retours ; la synthèse sera publiée ici.</p></div>`;
    }
  }

  /* 3. Synthèse publiée : visible par tous les membres. */
  if(bilanPublie() && !(etat==="cloture" && peutLireBilans())){
    html += `<div class="compose"><h3 class="serif">Bilans moraux — synthèse publiée</h3>
      ${S.meta.bilanPublieLe?`<p class="by" style="margin:2px 0 8px">Publiée le ${esc(fmtQuand(S.meta.bilanPublieLe))}</p>`:""}
      <p style="white-space:pre-wrap;font-size:13.5px;line-height:1.6;color:var(--ink);margin:0">${esc(bilanPublie())}</p></div>`;
  }

  if(!html) html = `<div class="compose"><h3 class="serif">Bilans moraux</h3><p class="hint" style="margin:8px 0 0">Les bilans moraux ne sont pas ouverts pour le moment.</p></div>`;
  return html;
}

/* ---- onglet MESSAGES (directs 1 à 1, démo locale) ---- */
function msgMeId(){ const k=((S.session&&S.session.nom)||"").trim().toLowerCase(); const p=PERSONNES.find(x=>(x.prenom+" "+x.nom).toLowerCase()===k); return p?p.id:S.session.id; }
/* ===================== MÉDIATION v2 =====================
   Toute la logique de confidentialité est dans la base (fonctions ca_med_*) :
   l'app n'affiche que ce que la base lui renvoie déjà masqué. */
const CA_MED_FN = SB_URL + "/functions/v1/mediation";
const MED_STATUT = {
  a_attribuer:["En attente d'un médiateur","--slate"],
  en_cours:["En cours","--amber"],
  a_reattribuer:["À réattribuer (pas de réponse en 12 h)","--red"],
  regle:["Réglé","--green"],
  escalade:["Non réglé — transmis","--red"],
  tranche:["Décision rendue","--green"]
};
async function loadMediateurs(){
  if(!(S.session&&S.session.role==="owner")){ S.mediateurs=[]; return; }
  try{ const r=await sb.rpc("ca_med_liste_mediateurs"); S.mediateurs=(r&&!r.error&&Array.isArray(r.data))?r.data:[]; }catch(e){ S.mediateurs=[]; }
}
async function loadMediation(){
  await loadMediateurs();
  S.med=S.med||{dossiers:[],personnes:[],msgs:{},ouvert:null};
  try{ const r=await sb.rpc("ca_med_dossiers_vue"); S.med.dossiers=(r&&!r.error&&r.data)||[]; S.med.erreur=(r&&r.error)?r.error.message:""; }catch(e){ S.med.dossiers=[]; }
  try{ const r=await sb.rpc("ca_med_personnes"); S.med.personnes=(r&&!r.error&&r.data)||[]; }catch(e){ S.med.personnes=[]; }
}
async function loadMedMessages(id){
  try{ const r=await sb.rpc("ca_med_lire",{p_dossier:id}); S.med.msgs[id]=(r&&!r.error&&r.data)||[]; }catch(e){ S.med.msgs[id]=[]; }
}
/* Mails : envoyés par la fonction serveur, qui seule connaît les adresses. */
async function medNotif(evenement, dossier){
  try{ const h=await caSendHeaders(); const r=await fetch(CA_MED_FN,{method:"POST",headers:h,body:JSON.stringify({evenement:evenement,dossier:dossier||null})}); return r.ok; }
  catch(e){ return false; }
}
async function traiterRetardsMediation(){
  if(!sb||!S.session||S.session.statut!=="actif") return;
  try{ const r=await sb.rpc("ca_med_verifier_retards"); if(r&&!r.error&&r.data>0){ await medNotif("retard"); } }catch(e){}
  /* Un dossier signalé en retard par un autre appareil doit aussi partir chez le propriétaire. */
  if(S.session.role==="owner"){ try{ await medNotif("retard"); }catch(e){} }
}
function medBadge(d){
  const s=MED_STATUT[d.statut]||[d.statut,"--slate"];
  let lib=s[0];
  /* Les parties ne savent pas qu'un médiateur a tardé : ça reste « en cours » pour elles. */
  if((d.role==="demandeur"||d.role==="vise") && d.statut==="a_reattribuer") lib=MED_STATUT.en_cours[0];
  if((d.role==="demandeur"||d.role==="vise") && d.statut==="a_attribuer") lib="En attente d'un médiateur";
  if(d.statut==="escalade" && d.escalade && d.role!=="owner") lib="Non réglé — transmis à "+d.escalade;
  if(d.statut==="escalade" && d.role==="owner") lib="Non réglé — transmis à "+(d.escalade||"?");
  return `<span class="badge" style="background:var(${s[1]});color:#fff">${esc(lib)}</span>`;
}
function medCarte(d){
  const titre = d.role==="owner"||d.role==="escalade"
      ? `${esc(d.demandeur||"?")} ↔ ${esc(d.vise||"?")}`
    : d.role==="demandeur" ? `Votre demande concernant ${esc(d.vise||"?")}`
    : d.role==="vise" ? `Demande de ${esc(d.demandeur||"un membre")}`
    : d.role==="mediateur" ? `${esc(d.demandeur||"Demandeur (anonyme)")} ↔ ${esc(d.vise||"?")}`
    : "Médiation réglée";
  const ligne2 = d.role==="owner"
      ? `Déposée le ${esc(dateFR(d.created_at))}${d.anonyme?" · anonyme":""}${d.mediateur?" · médiateur : "+esc(d.mediateur):""}${d.presidente_concernee?" · présidence concernée":""}`
      : `Déposée le ${esc(dateFR(d.created_at))}`;
  const ouvrir = (d.role!=="owner"&&d.role!=="rapport")
      ? `<div class="row-btn"><button class="btn sm" data-action="med-open" data-id="${d.id}" data-role="${d.role}">Ouvrir le dossier</button></div>` : "";
  const rapport = d.role==="rapport"
      ? `<p class="b-desc"><b>Conclusion du médiateur :</b> ${esc(d.conclusion||"—")}</p><p class="du">Clos le ${esc(d.clos_le?dateFR(d.clos_le):"—")}</p>` : "";
  let attrib="";
  if(d.role==="owner" && ["a_attribuer","a_reattribuer","en_cours"].indexOf(d.statut)>=0){
    const pool=(S.admins||[]).filter(a=>a.statut==="actif" && directionExtra().indexOf(a.id)>=0 && a.id!==S.session.id
      && ((a.prenom||"")+" "+(a.nom||"")).trim()!==d.demandeur && ((a.prenom||"")+" "+(a.nom||"")).trim()!==d.vise);
    attrib = `<div class="foot-line" style="flex-direction:column;align-items:stretch;gap:7px">
      ${d.statut==="a_reattribuer"?`<p class="du" style="color:var(--red);margin:0">${esc(d.mediateur||"Le médiateur")} n'a pas répondu dans les 12 h.</p>`:""}
      <select class="f" id="med_sel_${d.id}" style="max-width:340px"><option value="">— Choisir un médiateur sans lien avec les deux personnes —</option>
        ${pool.map(a=>`<option value="${a.id}">${esc(((a.prenom||"")+" "+(a.nom||"")).trim())}${a.fonction?" · "+esc(a.fonction):""}</option>`).join("")}</select>
      <label style="display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer"><input type="checkbox" class="sw" role="switch" id="med_pres_${d.id}" ${d.presidente_concernee?"checked":""}> La présidence a un lien avec une des deux personnes</label>
      <div><button class="btn sm" data-action="med-attribuer" data-id="${d.id}">${d.statut==="a_attribuer"?"Attribuer":"Réattribuer"}</button></div>
      ${pool.length?"":`<p class="du" style="color:var(--red);margin:0">Aucun médiateur disponible : cochez-en dans Admin › Droits médiation.</p>`}</div>`;
  }
  return `<div class="vote"><div class="vote-h"><h4 class="serif">${titre}</h4>${medBadge(d)}</div>
    <p class="du" style="margin:4px 0 0">${ligne2}</p>${rapport}${attrib}${ouvrir}</div>`;
}
function medBulles(liste){
  if(!liste.length) return `<div class="empty" style="border:none;color:var(--slate)">Aucun message.</div>`;
  return liste.map(m=>`<div class="bub ${m.de_moi?"me":"them"}" style="max-width:90%">${esc(m.texte)}<div class="m-meta">${esc(m.auteur)} · ${esc(fmtQuand(m.created_at))}</div></div>`).join("");
}
function medFil(){
  const o=S.med.ouvert; const d=(S.med.dossiers||[]).find(x=>x.id===o.id&&x.role===o.role);
  if(!d){ S.med.ouvert=null; return tabConflits(); }
  const msgs=S.med.msgs[d.id]||[];
  const clos = d.statut==="regle"||d.statut==="tranche";
  const gestion = (d.role==="mediateur" && ["en_cours","a_reattribuer"].indexOf(d.statut)>=0) || (d.role==="escalade" && d.statut==="escalade");
  const zone=(cote,titre)=>{
    const l=msgs.filter(m=>m.cote===cote);
    return `<div class="card2" style="margin-bottom:14px"><h3 class="serif" style="margin-top:0">${titre}</h3>
      <div class="msg-thread" style="min-height:0">${medBulles(l)}</div>
      ${(!clos && (gestion || d.role===cote))?`<textarea id="med_txt_${cote}" placeholder="Votre message…"></textarea>
        <div class="row-btn"><button class="btn sm" data-action="med-ecrire" data-id="${d.id}" data-cote="${cote}">Envoyer</button></div>`:""}</div>`;
  };
  let corps="";
  if(d.role==="mediateur"||d.role==="escalade"){
    corps = zone("demandeur","Échange avec "+(d.demandeur||"le demandeur (anonyme)"))
          + zone("vise","Échange avec "+(d.vise||"la personne concernée"));
  } else {
    corps = zone(d.role, "Échange avec "+(d.statut==="escalade"?(d.escalade||"le responsable"):"le médiateur"));
  }
  const infos = (d.conclusion?`<p class="b-desc"><b>Conclusion du médiateur :</b> ${esc(d.conclusion)}</p>`:"")
              + (d.decision?`<p class="b-desc"><b>Décision :</b> ${esc(d.decision)}</p>`:"");
  let actions="";
  if(d.role==="mediateur" && ["en_cours","a_reattribuer"].indexOf(d.statut)>=0){
    actions=`<div class="card2"><h3 class="serif" style="margin-top:0">Clôturer la médiation</h3>
      <textarea id="med_concl" placeholder="Conclusion (sans détail inutile : elle figure dans le rapport)…"></textarea>
      <div class="row-btn"><button class="btn sm" data-action="med-clore" data-id="${d.id}" data-regle="1" style="background:var(--green);border-color:var(--green)">✓ Réglé</button>
      <button class="btn ghost sm" data-action="med-clore" data-id="${d.id}" data-regle="0" style="border-color:var(--red);color:var(--red)">✕ Non réglé</button></div>
      <p class="du">Non réglé : le dossier est transmis à la présidence (ou, si elle est concernée, à un autre responsable), avec les noms et les messages.</p></div>`;
  }
  if(d.role==="escalade" && d.statut==="escalade"){
    actions=`<div class="card2"><h3 class="serif" style="margin-top:0">Trancher le litige</h3>
      <textarea id="med_dec" placeholder="Votre décision…"></textarea>
      <div class="row-btn"><button class="btn sm" data-action="med-trancher" data-id="${d.id}">Rendre la décision</button></div></div>`;
  }
  return `<div class="msg-head"><button class="btn ghost sm" data-action="med-back">← Médiation</button>${medBadge(d)}</div>${infos}${corps}${actions}`;
}
function tabConflits(){
  S.med=S.med||{dossiers:[],personnes:[],msgs:{},ouvert:null};
  if(S.med.ouvert) return medFil();
  const D=S.med.dossiers||[];
  const groupe=(role,titre,vide)=>{ const l=D.filter(d=>d.role===role); if(!l.length) return vide?`<h3 class="serif" style="margin-top:22px">${titre}</h3><div class="empty">${vide}</div>`:"";
    return `<h3 class="serif" style="margin-top:22px">${titre}</h3>${l.map(medCarte).join("")}`; };
  const form=`<div class="compose"><h3 class="serif">Demander une médiation</h3>
    <p class="du">Votre message n'est lu que par la ou les personnes désignées pour la médiation. Aucun autre membre n'y a accès.</p>
    <select class="f" id="cf_vise"><option value="">— Avec qui avez-vous un problème ? —</option>
      ${(S.med.personnes||[]).map(p=>`<option value="${p.id}">${esc(p.nom||"")}${p.fonction?" · "+esc(p.fonction):""}</option>`).join("")}</select>
    <textarea id="cf_texte" placeholder="Décrivez la situation…"></textarea>
    <label style="display:flex;align-items:center;gap:9px;margin:8px 0;font-size:14px;cursor:pointer"><input type="checkbox" class="sw" role="switch" id="cf_anon"> Envoyer de manière anonyme</label>
    <p class="du" style="margin:0 0 8px">Anonyme : la personne qui vous répond ne voit pas votre nom.</p>
    <p class="du" style="margin:0 0 8px">Si la médiation n'aboutit pas, le dossier est transmis à la présidence.</p>
    <div class="row-btn"><button class="btn" data-action="cf-envoyer">Envoyer</button></div></div>`;
  const owner = S.session && S.session.role==="owner";
  const aAttribuer = D.filter(d=>d.role==="owner" && (d.statut==="a_attribuer"||d.statut==="a_reattribuer"));
  const suivi = D.filter(d=>d.role==="owner" && !(d.statut==="a_attribuer"||d.statut==="a_reattribuer"));
  return (S.med.erreur?`<p class="du" style="color:var(--red)">Médiation indisponible : ${esc(S.med.erreur)}</p>`:"")
    + form
    + (owner?`<h3 class="serif" style="margin-top:22px">À attribuer</h3>${aAttribuer.length?aAttribuer.map(medCarte).join(""):`<div class="empty">Aucun dossier à attribuer.</div>`}
       <h3 class="serif" style="margin-top:22px">Suivi des dossiers</h3><p class="du">Vous voyez les noms et l'état, jamais les messages.</p>${suivi.length?suivi.map(medCarte).join(""):`<div class="empty">Aucun dossier.</div>`}`:"")
    + groupe("mediateur","Dossiers qui vous sont confiés")
    + groupe("escalade","Dossiers non réglés à trancher")
    + groupe("demandeur","Mes demandes")
    + groupe("vise","Médiations qui me concernent")
    + groupe("rapport","Rapports — médiations réglées");
}
function tabMessages(){

    <div class="msg-thread">${bubbles}</div>
    ${S.msgUI.file?`<p class="attach-chip">📎 ${esc(S.msgUI.file.name)} · <button class="link" data-action="msg-unattach">retirer</button></p>`:""}

      <label class="filebtn" title="Joindre un fichier">📎<input type="file" data-change="msgfile"></label>

/* ---- Approbation formelle du PV : un PV n'a de valeur qu'une fois approuvé
       par le CA, en général à la réunion suivante. ---- */
function pvApprouve(m){ return m && m.pvStatut==="approuve"; }
function blocApprobationPV(m){
  const ok=pvApprouve(m);
  const badge = ok
    ? `<p style="margin:0;font-size:13px;font-weight:600;color:var(--green)">✓ PV approuvé${m.pvApprouveLe?" le "+esc(fmtQuand(m.pvApprouveLe)):""}${m.pvApprouveNote?` — ${esc(m.pvApprouveNote)}`:""}</p>`
    : `<p style="margin:0;font-size:13px;color:var(--stamp);font-weight:600">Projet de PV — non encore approuvé par le CA.</p>`;
  const boutons = estSecretaire()
    ? `<div class="row-btn" style="margin-top:8px">${ok
        ? `<button class="btn ghost sm" data-action="reu-pv-brouillon" data-id="${m.id}">Repasser en projet</button>`
        : `<button class="btn sm" data-action="reu-pv-approuver" data-id="${m.id}">Marquer le PV comme approuvé</button>`}</div>`
    : "";
  return `<div class="grp-h" style="margin-top:26px"><h2 class="serif">Procès-verbal</h2><span class="l"></span></div>
    <div class="card2">${badge}
      <p class="du" style="margin:8px 0 0">Tant qu'il n'est pas approuvé, le texte reste un projet : il peut être corrigé, et il n'engage pas le CA.</p>
      ${boutons}</div>`;
}

/* ---- onglet IDEES & AVIS : espace de contribution des coopte-es.
       Ils ecrivent, le CA lit. Aucune valeur decisionnelle. ---- */
/* Sondage consultatif sur une idee. Aucune valeur decisionnelle :
   les decisions du CA passent par l'onglet Votes, ou les cooptes n'entrent pas. */
const AVIS_CHOIX=[["pour","\ud83d\udc4d Pour"],["mitige","\ud83e\udd14 Mitig\u00e9"],["contre","\ud83d\udc4e Contre"]];
const AVIS_STATUTS=[["nouveau","\u00c0 traiter","--slate"],["retenue","Retenue","--green"],["discuter","\u00c0 discuter","--stamp"],["ecartee","\u00c9cart\u00e9e","--red"]];

/* Meme regle que les budgets : majorite simple sur l'effectif du conseil,
   pas sur le nombre de votants. Le decompte eclaire ; il ne decide pas. */
function verdictAvis(a){
  const n=effectifCA(), seuil=seuilMajorite();
  if(!n) return "";
  const pour=voixMembres(a.id,"pour"), contre=voixMembres(a.id,"contre"), mitige=voixMembres(a.id,"mitige");
  const co=voixCooptes(a.id);
  const atteint=pour>=seuil;
  const detail=`${pour} pour \u00b7 ${mitige} mitig\u00e9 \u00b7 ${contre} contre`
    + (co?` \u00b7 ${co} avis de coopt\u00e9\u00b7e(s), hors d\u00e9compte`:"");
  return `<p class="du" style="margin:8px 0 0;color:${atteint?"var(--green)":"var(--ink-soft)"}">`
    + (atteint
        ? `\u2713 Majorit\u00e9 atteinte \u2014 ${pour} voix pour sur ${n} membres (il en faut ${seuil}).`
        : `${seuil - pour} voix manquent pour la majorit\u00e9 (${seuil} sur ${n} membres).`)
    + `<br><span style="color:var(--slate)">${detail}</span></p>`;
}
function libelleStatutAvis(k){ const e=AVIS_STATUTS.find(x=>x[0]===k)||AVIS_STATUTS[0]; return e; }
/* Le vote des membres eclaire, mais la decision revient au proprietaire.
   La policy ca_avis_repondre dit exactement la meme chose cote base. */
function peutRepondreAvis(){ return !!(S.session && S.session.role==="owner"); }
/* Repere « coopte » deduit du role au moment de l'affichage, sans colonne a tenir. */
function avisDeCoopte(a){ const m=(S.admins||[]).find(x=>x.id===a.membreId); return !!(m && m.role==="coopte"); }
/* Les voix qui comptent sont celles des membres du conseil. Les coopte·es
   peuvent se prononcer, mais ils ne siegent pas : leur avis est affiche a
   part et n'entre pas dans la majorite. */
function voixMembres(id, valeur){
  const membres=new Set(membresActifs().map(a=>a.id));
  return (S.avisVotes||[]).filter(v=>v.avisId===id && v.valeur===valeur && membres.has(v.membreId)).length;
}
function voixCooptes(id){
  const co=new Set(cooptesActifs().map(a=>a.id));
  return (S.avisVotes||[]).filter(v=>v.avisId===id && co.has(v.membreId)).length;
}
function avisPour(id){ return voixMembres(id,"pour"); }
/* Prochaine reunion a venir : celle vers laquelle une idee retenue est dirigee. */
function prochaineReunion(){
  const auj=todayISO();
  return (S.reunions||[]).filter(m=>m.date && m.date>=auj)
    .sort((a,b)=>(a.date||"").localeCompare(b.date||""))[0] || null;
}
function barreAvisVote(avisId){
  const V=(S.avisVotes||[]).filter(v=>v.avisId===avisId);
  const moi=(S.session||{}).id;
  const mien=(V.find(v=>v.membreId===moi)||{}).valeur||"";
  const n=v=>V.filter(x=>x.valeur===v).length;
  const boutons=AVIS_CHOIX.map(([k,lab])=>`<button class="chip" data-action="avis-vote" data-id="${avisId}" data-val="${k}" style="${mien===k?"background:var(--ink);color:#fff;border-color:var(--ink)":""}">${lab}${n(k)?" \u00b7 "+n(k):""}</button>`).join("");
  return `<div style="margin:10px 0 0">
    <div style="display:flex;flex-wrap:wrap;gap:7px">${boutons}${mien?`<button class="link" data-action="avis-vote" data-id="${avisId}" data-val="" style="font-size:12px">retirer mon avis</button>`:""}</div>
    <p class="du" style="margin:6px 0 0;font-size:11.5px">Vote du conseil \u00b7 majorit\u00e9 simple sur l'effectif. La d\u00e9cision finale revient au bureau.</p></div>`;
}
function tabAvis(){
  const A=(S.avis||[]).slice();
  const moi=(S.session||{}).id;
  const invit = peutGererCooptes() ? `<div class="card2" style="margin-bottom:16px">
    <h3 class="serif" style="margin-top:0">Inviter un\u00b7e coopt\u00e9\u00b7e</h3>
    <p class="du" style="margin:0 0 8px">Ce lien permet \u00e0 une personne coopt\u00e9e de cr\u00e9er un compte. Elle acc\u00e9dera \u00e0 l'agenda des \u00e9v\u00e9nements et \u00e0 cet espace, et \u00e0 rien d'autre. Sa demande doit \u00eatre valid\u00e9e par le propri\u00e9taire.</p>
    ${S.meta.codeCoopte?`<p style="color:var(--slate);font-size:12px;margin:0 0 8px">Code en cours : <b>${esc(S.meta.codeCoopte)}</b> \u00b7 ${cooptesActifs().length} coopt\u00e9\u00b7e(s) valid\u00e9\u00b7e(s)</p>`:""}
    <div class="row-btn"><button class="btn" data-action="coopte-lien">Copier le lien d'invitation</button>
      ${S.meta.codeCoopte?`<button class="btn ghost" data-action="coopte-newcode">G\u00e9n\u00e9rer un nouveau code</button>`:""}</div></div>` : "";
  const compose = invit + `<div class="compose"><h3 class="serif">D\u00e9poser un avis ou une id\u00e9e</h3>
    <p style="color:var(--ink-soft);font-size:13px;margin:0 0 8px">${estCoopte()?"Vos contributions sont lues par les membres du CA. Elles n'ont pas valeur de vote : les d\u00e9cisions restent prises par le conseil.":"Vous pouvez aussi d\u00e9poser une id\u00e9e ici."}</p>
    <input class="f" id="av_sujet" placeholder="Sujet (ex. Organisation de la soir\u00e9e de rentr\u00e9e)">
    <textarea class="f" id="av_texte" rows="4" placeholder="Votre avis, votre proposition\u2026"></textarea>
    <div class="row-btn"><button class="btn" data-action="avis-add">Envoyer</button></div></div>`;
  if(!A.length) return compose+`<div class="empty">Aucune contribution pour l'instant.</div>`;
  const repond=peutRepondreAvis();
  const reu=prochaineReunion();
  const seuilAvis=seuilMajorite();
  const list=A.map(x=>{
    const [,libelle,coul]=libelleStatutAvis(x.statut);
    const pour=avisPour(x.id);
    const prete = x.statut!=="ecartee" && !x.odjReunion && (x.statut==="retenue" || (seuilAvis>0 && pour>=seuilAvis));
    /* Une idee venue de l'exterieur du conseil : le CA gagne a le savoir en la lisant. */
    const marque = avisDeCoopte(x) ? `<span class="badge" style="background:var(--surface2);color:var(--slate)">coopt\u00e9\u00b7e</span>` : "";
    const reponse = x.reponse
      ? `<div style="margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--surface2);border-left:3px solid var(${coul})">
          <p class="du" style="margin:0 0 4px">R\u00e9ponse du bureau${x.reponduPar?" \u2014 "+esc(x.reponduPar):""}${x.reponduLe?" \u00b7 "+esc(dateFR(x.reponduLe)):""}</p>
          <p style="white-space:pre-wrap;margin:0;font-size:14px">${esc(x.reponse)}</p></div>`
      : "";
    const odjFait = x.odjReunion
      ? `<p class="du" style="margin:8px 0 0;color:var(--green)">\u2713 Port\u00e9e \u00e0 l'ordre du jour d'une r\u00e9union.</p>` : "";
    /* Bloc de suivi : reserve au secretariat et au proprietaire. */
    const suivi = repond ? `<div class="foot-line" style="flex-direction:column;align-items:stretch;gap:7px">
        <select class="f" id="av_st_${x.id}" style="max-width:220px">${AVIS_STATUTS.map(([k,l])=>`<option value="${k}" ${x.statut===k?"selected":""}>${l}</option>`).join("")}</select>
        <textarea class="f" id="av_rep_${x.id}" rows="2" placeholder="Mot d'explication envoy\u00e9 \u00e0 l'auteur\u2026">${esc(x.reponse||"")}</textarea>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sm" data-action="avis-repondre" data-id="${x.id}">Enregistrer et pr\u00e9venir l'auteur</button>
          ${prete?`<button class="btn ghost sm" data-action="avis-odj" data-id="${x.id}">\u2192 ${reu?"Porter \u00e0 l'ordre du jour du "+esc(fmtDateLong(reu.date)):"Aucune r\u00e9union \u00e0 venir"}</button>`:""}
        </div></div>` : "";
    return `<div class="vote">
    <div class="vote-h"><h4 class="serif">${esc(x.sujet||"Sans sujet")}</h4>
      <span class="badge" style="background:var(${coul});color:#fff">${libelle}</span>${marque}
      <span class="badge">${esc(x.auteur||"")}</span></div>
    <p style="white-space:pre-wrap;margin:8px 0 0;font-size:14px">${esc(x.texte||"")}</p>
    ${barreAvisVote(x.id)}
    ${verdictAvis(x)}

    ${reponse}${odjFait}
    ${suivi}
    <div class="foot-line"><span class="by">${x.ts?esc(fmtQuand(x.ts)):""}</span>
      ${(x.membreId===moi||(S.session&&S.session.role==="owner"))?`<button class="link" data-action="avis-del" data-id="${x.id}" style="margin-left:auto">Supprimer</button>`:""}</div></div>`;
  }).join("");
  return compose+list;
}

/* ---- onglet RÉUNIONS (ordre du jour, présences, PV) ---- */
function tabReunions(){
  if(!S.reuUI) S.reuUI={sel:null};
  const R=S.reunions||[];
  if(!S.reuUI.sel){
    const list=R.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(m=>`<button class="msg-row" data-action="reu-open" data-id="${m.id}"><span class="msg-av">${esc((m.date||"").slice(8,10)||"·")}</span><span><span class="nm">${esc(m.titre)}</span><br><span class="fn">${m.date?fmtDateLong(m.date):"date ?"} · ${(m.ordre||[]).length} point(s)</span></span></button>`).join("");
    return `${estSecretaire()?`<div class="compose"><h3 class="serif">Nouvelle réunion</h3>
      <input class="f" id="reu_titre" placeholder="Ex. Réunion du bureau">
      <input class="f" id="reu_date" type="date">
      <input class="f" id="reu_lieu" placeholder="Lieu (facultatif)">
      <label style="display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px"><input type="checkbox" class="sw" role="switch" id="reu_modele" checked> Pr\u00e9-remplir avec les points r\u00e9currents</label>
      <label style="display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px"><input type="checkbox" class="sw" role="switch" id="reu_notify"> Prévenir les membres par e-mail</label>
      <div class="row-btn"><button class="btn" data-action="reu-create">Créer la réunion</button></div></div>`:`<p class="du" style="margin-bottom:12px">Les réunions sont créées par le secrétariat. Vous pouvez les consulter et proposer des points à l'ordre du jour.</p>`}
      <div class="row-btn" style="margin-bottom:12px"><button class="btn ghost" data-action="registre-pv">Registre des PV</button>${peutVoirRapports()?`<button class="btn ghost" data-action="rapport-activite">Rapport d'activit\u00e9</button><button class="btn ghost" data-action="suivi-presence">Suivi de pr\u00e9sence</button>`:""}</div>
      ${R.length?`<div class="msg-list">${list}</div>`:`<div class="empty">Aucune réunion pour l'instant.</div>`}`;
  }
  const m=R.find(x=>x.id===S.reuUI.sel); if(!m){ S.reuUI.sel=null; return tabReunions(); }
  const ordre=m.ordre||[]; const pres=m.presences||{};
  const cnt=v=>Object.keys(pres).filter(k=>pres[k]===v).length;
  const points=ordre.length?ordre.map(pt=>`<div class="vote">
      <div class="vote-h" style="align-items:flex-start;gap:8px">
        <button class="link" ${estSecretaire()?"":"disabled style=\"opacity:.5;cursor:default\""} data-action="reu-togglepoint" data-pt="${pt.id}" style="font-size:17px;text-decoration:none">${pt.fait?"☑":"☐"}</button>
        <span style="flex:1"><span class="serif" style="font-size:15px;display:block;${pt.fait?"opacity:.55;text-decoration:line-through":""}">${esc(pt.texte)}</span>${pt.par?`<span class="du" style="font-size:11.5px;color:var(--slate)">proposé par ${esc(pt.par)}</span>`:""}</span>
        ${(!pt.parId || (S.session && (S.session.id===pt.parId || S.session.role==="owner"))) ? `<button class="link" data-action="reu-delpoint" data-pt="${pt.id}">✕</button>` : ""}</div>
      ${(estSecretaire()&&pt.fait&&pt.notes)?`<button class="link" data-action="pt-tache" data-pt="${pt.id}" style="font-size:12px">➕ Cr\u00e9er une t\u00e2che depuis cette d\u00e9cision</button>`:""}
      <textarea data-change="reunote" data-pt="${pt.id}" ${estSecretaire()?"":"readonly style=\"opacity:.75\""} placeholder="${estSecretaire()?"Notes / décisions (pour le PV)…":"Notes rédigées par le secrétariat"}">${esc(pt.notes||"")}</textarea></div>`).join(""):`<div class="empty">Aucun point à l'ordre du jour.</div>`;
  const presRows=membresActifs().map(a=>{const v=pres[a.id]; const nom=((a.prenom||"")+" "+(a.nom||"")).trim()||a.email;
    return `<div class="doc" style="cursor:default;padding:9px 13px">
      <span class="meta"><p class="dt" style="font-size:13.5px">${esc(nom)}</p><p class="du">${esc(a.fonction||"")}</p></span>
      <div class="mini">
        <button aria-pressed="${v==='present'}" ${estSecretaire()?"":"disabled"} data-action="reu-pres" data-person="${esc(a.id)}" data-val="present">Présent</button>
        <button aria-pressed="${v==='absent'}" ${estSecretaire()?"":"disabled"} data-action="reu-pres" data-person="${esc(a.id)}" data-val="absent">Absent</button>
        <button aria-pressed="${v==='excuse'}" ${estSecretaire()?"":"disabled"} data-action="reu-pres" data-person="${esc(a.id)}" data-val="excuse">Excusé</button>
      </div></div>`;}).join("")||`<div class="empty">Aucun membre validé à pointer.</div>`;
  return `<div class="msg-head"><button class="btn ghost sm" data-action="reu-back">← Réunions</button>
      <span><span class="u-nom">${esc(m.titre)}</span> <span class="u-id">${m.date?fmtDateLong(m.date):""}</span></span>
      ${estSecretaire()?`<button class="link" data-action="reu-del" data-id="${m.id}" style="margin-left:auto">Supprimer</button>`:""}</div>
    ${(peutRappelerReunion() && (!m.date || String(m.date).slice(0,10)>=todayISO()))?`<div class="row-btn" style="margin:0 0 12px;align-items:center"><button class="btn sm" data-action="reu-rappel" data-id="${m.id}">🔔 Rappeler la réunion aux membres</button>${(S.reuRappelLe&&S.reuRappelLe[m.id])?`<span class="du">Dernier rappel : ${esc(fmtQuand(S.reuRappelLe[m.id]))}</span>`:""}</div>`:""}
    <div class="grp-h"><h2 class="serif">Ordre du jour</h2><span class="c">${ordre.length}</span><span class="l"></span></div>
    ${(ordreFerme(m)&&!estSecretaire())?`<p class="du">L'ordre du jour est cl\u00f4tur\u00e9 (les propositions ferment ${(S.meta.clotureOdj||0)}h avant la r\u00e9union).</p>`:`<div class="compose"><input class="f" id="reu_point" placeholder="Ajouter un point…"><div class="row-btn"><button class="btn sm" data-action="reu-addpoint">Ajouter</button></div></div>`}
    ${points}
    <div class="grp-h" style="margin-top:26px"><h2 class="serif">Présences</h2><span class="c">${cnt('present')} prés. · ${cnt('excuse')} exc. · ${cnt('absent')} abs.</span><span class="l"></span></div>
    ${presRows}
    ${blocApprobationPV(m)}
    ${estSecretaire()?`<div class="row-btn" style="margin-top:16px"><button class="btn" data-action="reu-gen">Générer le PV</button></div>`:`<p class="du" style="margin-top:16px">Le PV est rédigé et diffusé par le secrétariat.</p>`}`;
}

/* ---- onglet ÉVÉNEMENTS (fiche : budget, checklist, notes) ---- */

      <input class="f" id="ev_date" type="date">

      <div class="row-btn"><button class="btn" data-action="ev-create">Créer l'événement</button></div></div>
      ${E.length?`<div class="msg-list">${list}</div>`:`<div class="empty">Aucun événement. Créez-en un ci-dessus.</div>`}`;
  }
  const ev=E.find(x=>x.id===S.evUI.sel); if(!ev){ S.evUI.sel=null; return tabEvenements(); }
  const chk=ev.checklist||[];
  const prevu=parseFloat(String(ev.budgetPrevu).replace(",","."))||0, reel=parseFloat(String(ev.budgetReel).replace(",","."))||0; const ecart=prevu-reel;
  const L=(t)=>`<label style="display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:8px 0 0">${t}</label>`;
  const chkHtml=chk.length?chk.map(c=>`<div class="doc" style="cursor:default;padding:9px 13px">
      <button class="link" data-action="ev-toggleitem" data-it="${c.id}" style="font-size:17px;text-decoration:none">${c.fait?"☑":"☐"}</button>
      <span class="meta"><p class="dt" style="font-size:13.5px;${c.fait?"opacity:.55;text-decoration:line-through":""}">${esc(c.texte)}</p></span>
      <button class="link" data-action="ev-delitem" data-it="${c.id}">✕</button></div>`).join(""):`<div class="empty" style="border:none;color:var(--slate)">Checklist vide.</div>`;
  return `<div class="msg-head"><button class="btn ghost sm" data-action="ev-back">← Événements</button>
      <span><span class="u-nom">${esc(ev.titre)}</span> <span class="u-id">${ev.date?fmtDateLong(ev.date):""}</span></span>
      ${peutSupprimerEvenement(ev)?`<button class="link" data-action="ev-del" data-id="${ev.id}" style="margin-left:auto">Supprimer</button>`:""}</div>
    <div class="compose"><h3 class="serif">Informations</h3>
      ${L("Lieu")}<input class="f" data-change="evfield" data-field="lieu" value="${esc(ev.lieu||"")}" placeholder="Lieu">
      ${L("Responsable")}<input class="f" data-change="evfield" data-field="responsable" value="${esc(ev.responsable||"")}" placeholder="Qui pilote ?">
      <div class="two">
        <div>${L("Budget prévu (€)")}<input class="f" data-change="evfield" data-field="budgetPrevu" value="${esc(ev.budgetPrevu||"")}" inputmode="decimal" placeholder="0"></div>
        <div>${L("Budget réel (€)")}<input class="f" data-change="evfield" data-field="budgetReel" value="${esc(ev.budgetReel||"")}" inputmode="decimal" placeholder="0"></div>
      </div>
      <p class="by" style="margin-top:8px">Écart : <b style="color:${ecart<0?"var(--red)":"var(--green)"}">${eur(ecart)}</b> · prévu ${eur(prevu)} · réel ${eur(reel)}</p>
    </div>
    <div class="grp-h"><h2 class="serif">Checklist</h2><span class="c">${chk.filter(c=>c.fait).length}/${chk.length}</span><span class="l"></span></div>
    <div class="compose"><input class="f" id="ev_item" placeholder="Ajouter une tâche à la checklist…"><div class="row-btn"><button class="btn sm" data-action="ev-additem">Ajouter</button></div></div>
    ${chkHtml}
    <div class="grp-h" style="margin-top:22px"><h2 class="serif">Présence</h2><span class="l"></span></div>
    ${blocPresence(ev.id)}
    ${blocRappel("evenement", ev)}
    <div class="grp-h" style="margin-top:22px"><h2 class="serif">Notes</h2><span class="l"></span></div>
    <textarea data-change="evfield" data-field="notes" placeholder="Notes sur l'événement…">${esc(ev.notes||"")}</textarea>`;
}

function blocPresence(evId){
  const P=(S.presence||[]).filter(x=>x.evenement_id===evId);
  const meId=S.session&&S.session.id;
  const mine=P.find(x=>x.membre_id===meId); const mr=mine?mine.reponse:null;
  const c=r=>P.filter(x=>x.reponse===r).length;
  const noms=r=>P.filter(x=>x.reponse===r).map(x=>esc(x.nom||"?")).join(", ")||"—";
  const b=(r,lbl,col)=>`<button class="btn ghost sm" data-action="ev-presence" data-id="${evId}" data-r="${r}" style="${mr===r?("border-color:"+col+";color:"+col):""}">${lbl}</button>`;
  return `<div class="compose" style="padding:12px 14px">
    <div style="display:flex;gap:8px;flex-wrap:wrap">${b("oui","✅ Je viens ("+c("oui")+")","var(--green)")}${b("non","❌ Je ne viens pas ("+c("non")+")","var(--red)")}${b("peut","🤔 Peut-être ("+c("peut")+")","var(--amber)")}</div>
    <p class="by" style="margin-top:10px">Présents : ${noms("oui")}<br>Absents : ${noms("non")}<br>Peut-être : ${noms("peut")}</p>
  </div>`;
}

  ${(()=>{ const h=(S.journal||[]).filter(j=>String(j.txt||"").indexOf("Mail envoyé")===0).slice(0,20);

        : `<div class="empty">Aucun mail envoyé pour l'instant.</div>`}
    </div>`; })()}`;

/* ---- onglet CALENDRIER ---- */
function tabCalendrier(){
  const evs=evenementsCalendrier();
  const now=new Date();
  let cur = S.calMonth ? new Date(S.calMonth+"-01T00:00") : new Date(now.getFullYear(), now.getMonth(), 1);
  if(isNaN(cur.getTime())) cur=new Date(now.getFullYear(), now.getMonth(), 1);
  const y=cur.getFullYear(), mo=cur.getMonth();
  const first=new Date(y,mo,1); const startDow=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,mo+1,0).getDate();
  const moLabel=cur.toLocaleDateString("fr-BE",{month:"long",year:"numeric"});
  const key=y+"-"+String(mo+1).padStart(2,"0");
  const byDay={}; evs.forEach(e=>{ if(e.date.slice(0,7)===key){ const d=parseInt(e.date.slice(8,10),10); (byDay[d]=byDay[d]||[]).push(e); } });
  const todayStr=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
  const cells=[];
  for(let i=0;i<startDow;i++) cells.push(`<div class="cal-cell cal-empty"></div>`);
  for(let d=1;d<=daysInMonth;d++){
    const ds=key+"-"+String(d).padStart(2,"0"); const list=byDay[d]||[];
    cells.push(`<div class="cal-cell${ds===todayStr?" cal-today":""}"><div class="cal-d">${d}</div>${list.map(e=>`<div class="cal-ev-chip ${e.cls}" title="${esc(e.type+" : "+e.titre+(e.lieu?(" \u2014 "+e.lieu):""))}">${esc(e.titre)}</div>`).join("")}</div>`);
  }
  const prevKey=(()=>{ const p=new Date(y,mo-1,1); return p.getFullYear()+"-"+String(p.getMonth()+1).padStart(2,"0"); })();
  const nextKey=(()=>{ const p=new Date(y,mo+1,1); return p.getFullYear()+"-"+String(p.getMonth()+1).padStart(2,"0"); })();
  const dows=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
  const aVenir=evs.filter(e=>e.date>=todayStr).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,10);
  return `<div class="compose">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <h3 class="serif" style="margin:0;text-transform:capitalize">${esc(moLabel)}</h3>
      <div class="row-btn" style="margin:0">
        <button class="btn ghost sm" data-action="cal-nav" data-mo="${prevKey}">\u25c0</button>
        <button class="btn ghost sm" data-action="cal-today2">Aujourd'hui</button>
        <button class="btn ghost sm" data-action="cal-nav" data-mo="${nextKey}">\u25b6</button>
        <button class="btn sm" data-action="cal-ics">\u2b07 Exporter (.ics)</button>

/* ---- Génération de VRAIS fichiers PDF (téléchargement direct) ----
   Le document est rendu VISIBLE à l'écran (derrière un voile) le temps de la
   capture : html2canvas produirait une page blanche s'il était hors écran. */
function chargerHtml2pdf(){
  if(window.__h2pReady) return window.__h2pReady;
  window.__h2pReady=new Promise((resolve,reject)=>{
    if(window.html2pdf) return resolve(window.html2pdf);
    let n=0; const attendre=()=>{ if(window.html2pdf) return resolve(window.html2pdf); if(n++>60) return charger(); setTimeout(attendre,100); };
    const charger=()=>{ const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.3/dist/html2pdf.bundle.min.js"; s.integrity="sha384-1Rq385dzyHeeImKREXc2dTf1lhBKJHL8YR6phOUkikTCsUwGgDyWRoGv8KVG2+qY"; s.crossOrigin="anonymous"; s.onload=()=>resolve(window.html2pdf); s.onerror=()=>{ window.__h2pReady=null; reject(new Error("html2pdf")); }; document.head.appendChild(s); };
    if(window.html2pdf) resolve(window.html2pdf); else attendre();
  });
  return window.__h2pReady;
}
/* nomFichier: "budgets-2026-05-01.pdf"  |  styleCSS: le contenu du <style> du document
   (les règles "body{…}" sont automatiquement appliquées à la page)  |  corpsHTML: le contenu du <body> */
async function telechargerPDF(nomFichier, styleCSS, corpsHTML, orientation, mode){
  let h2p;
  try{ h2p=await chargerHtml2pdf(); }
  catch(e){ if(window.alert) window.alert("Générateur PDF indisponible. Vérifiez votre connexion et réessayez."); return; }
  const paysage = orientation==="landscape";
  const largeur = paysage?1123:794;
  const css=String(styleCSS||"").replace(/(^|[^-\w.#])body\b/g,"$1.pdf-page");
  const antiCoupure="tr,li,.b,.k,section,.pt{page-break-inside:avoid}thead{display:table-header-group}";
  /* voile affiché (feedback) + feuille blanche calée en HAUT-GAUCHE (origine 0,0).
     Ne PAS centrer la feuille : un décalage horizontal ferait couper le bord gauche à la capture. */
  const overlay=document.createElement("div");
  overlay.style.cssText="position:fixed;inset:0;z-index:2147483000;background:rgba(20,24,40,.55);overflow:auto";
  const info=document.createElement("div");
  info.textContent="Génération du PDF…";
  info.style.cssText="position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:2147483001;color:#fff;font:600 14px system-ui,sans-serif;background:rgba(0,0,0,.5);padding:8px 16px;border-radius:20px";
  const feuille=document.createElement("div");
  feuille.style.cssText="position:absolute;left:0;top:0;background:#fff;width:"+largeur+"px";
  feuille.innerHTML="<style>"+css+"\n"+antiCoupure+"</style><div class=\"pdf-page\" style=\"max-width:none;width:auto;margin:0;padding:20px 24px;box-sizing:border-box\">"+corpsHTML+"</div>";
  overlay.appendChild(feuille); document.body.appendChild(overlay); document.body.appendChild(info);
  const cible=feuille.querySelector(".pdf-page");
  await new Promise(r=>setTimeout(r,150)); /* laisser peindre avant capture */
  const opt={
    margin:10,
    filename:nomFichier||("document-"+todayISO()+".pdf"),
    image:{type:"jpeg",quality:0.98},
    html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff",windowWidth:largeur,scrollX:0,scrollY:0,x:0,y:0,logging:false},
    jsPDF:{unit:"mm",format:"a4",orientation:paysage?"landscape":"portrait"},
    pagebreak:{mode:["css","legacy"]}
  };
  let sortie=null;
  try{
    const tache=h2p().set(opt).from(cible);
    if(mode==="blob") sortie=await tache.outputPdf("blob"); else await tache.save();
  }
  catch(e){ if(mode!=="blob" && window.alert) window.alert("La génération du PDF a échoué. Réessayez."); }
  finally{ overlay.remove(); info.remove(); }
  return sortie;
}

/* Prénom seul. Les votes anciens n'ont pas de membre_id : on retombe sur la

function prenomVotant(v){
  const a=(S.admins||[]).find(x=>x.id===v.membreId);
  if(a && String(a.prenom||"").trim()) return String(a.prenom).trim();
  const s=String(v.nom||"").split("\u00b7")[0].trim();
  return s||"\u2014";
}
function sigMembre(a){ return ((a.prenom||a.nom||"")+(a.fonction?" \u00b7 "+a.fonction:"")).trim().toLowerCase(); }
function prenomsParChoix(b, ch){ return (b.votes||[]).filter(v=>v.choix===ch).map(prenomVotant); }
function nomDepuisEmail(e){
  const loc = String(e||"").split("@")[0] || "";
  const mot = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : "";
  return loc.split(/[._-]+/).filter(Boolean).map(mot).join(" ") || String(e||"");
}
function prenomsNonVotants(b){
  const parId=new Set((b.votes||[]).map(v=>v.membreId).filter(Boolean));
  /* Votes déposés avant l'ajout de membre_id : on ne peut les rattacher que par
     la signature. Si la fonction a changé depuis, on retombe sur le prénom seul. */
  const anciens=(b.votes||[]).filter(v=>!v.membreId);
  const parSig=new Set(anciens.map(v=>String(v.nom||"").trim().toLowerCase()));
  const parPrenom=new Set(anciens.map(v=>String(v.nom||"").split("\u00b7")[0].trim().toLowerCase()).filter(Boolean));
  const inscrits = membresActifs()
    .filter(a=>!parId.has(a.id) && !parSig.has(sigMembre(a)) && !parPrenom.has(String(a.prenom||"").trim().toLowerCase()))
    .map(a=>String(a.prenom||"").trim()||String(a.nom||"").trim()||"\u2014");
  /* Les membres du CA sans compte ne peuvent pas voter : ils comptent toujours
     comme non-votants, comme dans le compteur de rappel juste au-dessus. */
  const sansCompte = nonInscrits().map(e => nomDepuisEmail(e) + " (pas encore inscrit·e)");
  return inscrits.concat(sansCompte);
}

/* Blob → base64 pour la pièce jointe. */
function blobEnBase64(blob){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{ const s=String(r.result||""); res(s.slice(s.indexOf(",")+1)); };
    r.onerror=()=>rej(new Error("lecture"));
    r.readAsDataURL(blob);
  });
}
/* Envoi avec pièce jointe réelle. Le lien signé est TOUJOURS dans le corps :
   si la pièce jointe est refusée par le serveur, le mail reste utilisable. */
async function envoyerAvecPiece(dest, subject, corpsHtml, piece, opts){
  opts=opts||{};
  /* opts.tous : document officiel (procuration) — envoyé même aux adresses désabonnées des annonces. */
  const liste=[...new Set((dest||[]).map(x=>String(x||"").toLowerCase().trim()).filter(Boolean))].filter(e=>opts.tous||!estDesabonne(e));
  if(!liste.length) return {ok:0,err:0,total:0,sansPiece:false};
  const html=`<div style="font-family:Arial,Helvetica,sans-serif;max-width:560px;margin:0 auto;color:#1a1a2e">${corpsHtml}${opts.sansInvitation?"":blocInvitationCA()}${blocNoReplyCA()}</div>`;
  const headers=await caSendHeaders();
  let ok=0, err=0, avec=!!piece, sansPiece=false, okAvecPiece=0;
  for(const to of liste){
    let bon=false;
    if(avec){
      try{ const r=await fetch(CA_SEND_FN,{method:"POST",headers:headers,body:JSON.stringify({to,subject,html,attachments:[piece]})}); bon=!(r&&r.ok===false); }catch(e){ bon=false; }
      if(bon) okAvecPiece++;
    }
    if(!bon){
      /* Second essai sans la pièce : le lien signé suffit à ne rien perdre. */
      try{ const r=await fetch(CA_SEND_FN,{method:"POST",headers:headers,body:JSON.stringify({to,subject,html})}); bon=!(r&&r.ok===false); }catch(e){ bon=false; }
      /* Si aucune pièce jointe n'est jamais passée, c'est le serveur qui la refuse :
         inutile de la retenter pour les suivants. Après un premier envoi réussi avec
         pièce, un échec isolé est un incident réseau : on garde la pièce. */
      if(avec && !okAvecPiece){ avec=false; sansPiece=true; }
    }
    if(bon) ok++; else err++;
    await new Promise(r=>setTimeout(r,120));
  }
  return {ok, err, total:liste.length, sansPiece};
}

}
async function cloturerBudget(id, force){
  if(!sb) return;
  const owner = !!(S.session && S.session.role==="owner");
  if(!owner){ modaleInfo("Seul le propri\u00e9taire peut cl\u00f4turer ou d\u00e9cider d\u2019un budget."); return; }
  if(force && !owner){ modaleInfo("Seul le propri\u00e9taire peut approuver hors seuil."); return; }
  const b=(S.budgets||[]).find(x=>x.id===id);
  if(!b || b.statut!=="vote") return;
  const n=effectifCA(), seuil=seuilMajorite();
  if(!n){ modaleInfo("La liste des membres n'est pas charg\u00e9e : le seuil de majorit\u00e9 ne peut pas \u00eatre calcul\u00e9. Rechargez la page et r\u00e9essayez."); return; }
  const pour=(b.votes||[]).filter(v=>v.choix==="pour").length;
  const st = force ? "approuve" : (pour>=seuil ? "approuve" : "refuse");
  const question = force
    ? "Approuver « "+(b.titre||"")+" » alors que la majorit\u00e9 n'est pas atteinte ("+pour+" voix pour sur "+n+", il en faut "+seuil+") ?\n\nLa mention « hors seuil » figurera dans le PDF et dans le mail envoy\u00e9 \u00e0 tout le CA."
    : "Cl\u00f4turer « "+(b.titre||"")+" » ?\n\nR\u00e9sultat : "+(st==="approuve"?"APPROUV\u00c9":"REFUS\u00c9")+" ("+pour+" voix pour sur "+n+", majorit\u00e9 simple : "+seuil+").\nLe PDF de la d\u00e9cision sera envoy\u00e9 \u00e0 tous les membres du CA.";
  if(!(await modaleConfirm(question, force?"Approuver hors seuil":"Cl\u00f4turer le vote"))) return;
  const reserve=await modaleReserve(b.titre||""); if(reserve===null) return;
  const sig=(S.session&&S.session.sig)||"\u2014";
  const maj=await sb.from("ca_budgets").update({statut:st, decide_par:sig+(force?" (hors seuil)":""), decide_le:new Date().toISOString()}).eq("id",id).select();
  if(maj&&maj.error){ modaleInfo("La cl\u00f4ture n'a pas pu \u00eatre enregistr\u00e9e : "+maj.error.message); return; }
  /* Filet indispensable : une mise \u00e0 jour bloqu\u00e9e par les droits (RLS) ne renvoie
     PAS d'erreur, mais 0 ligne. Sans ce contr\u00f4le, le bouton restait actif et un
     PDF/mail annon\u00e7ait une d\u00e9cision jamais enregistr\u00e9e. */
  if(!maj||!maj.data||!maj.data.length){
    await loadBudgets(); render();
    modaleInfo("La cl\u00f4ture a \u00e9t\u00e9 refus\u00e9e par le serveur : aucune ligne n'a \u00e9t\u00e9 modifi\u00e9e.\n\nC'est presque toujours une question de droits (r\u00e8gle RLS sur la table ca_budgets) : la base n'autorise pas ce compte \u00e0 cl\u00f4turer un budget. Rien n'a chang\u00e9, aucun PDF ni mail n'a \u00e9t\u00e9 envoy\u00e9.","Cl\u00f4ture non enregistr\u00e9e"); return; }
  await enregistrerReserve(id, reserve);
  logAct("Budget "+(st==="approuve"?"approuv\u00e9":"refus\u00e9")+(force?" hors seuil":"")+(reserve!=="aucune"?" (r\u00e9serve du tr\u00e9sorier)":"")+" : "+(b.titre||""));
  await loadBudgets(); render();
  /* Le PDF documente la décision qui vient d'être prise. On ne se fie pas au
     rechargement : s'il échoue, l'objet en mémoire est resté « en vote » et le
     PDF annoncerait un refus. Statut et signataire sont donc imposés ici. */
  const bf=Object.assign({}, (S.budgets||[]).find(x=>x.id===id)||b,
    {statut:st, decidePar:sig+(force?" (hors seuil)":""), decideLe:new Date().toISOString(), reserve:reserve});

  await diffuserDecisionBudget(bf, st, force, sig, n, seuil);
}
/* Budget voté en CA physique : popup date, statut approuvé, puis PDF + mail à tout le CA.
   id = null → nouveau budget (formulaire) ; id = budget en vote → clôture en présentiel. */
async function voteCAPhysique(id){
  if(!sb) return;
  if(!(S.session && S.session.role==="owner")){ modaleInfo("Seul le propri\u00e9taire peut enregistrer une d\u00e9cision du CA."); return; }
  let b=null, donnees=null;
  if(id){ b=(S.budgets||[]).find(x=>x.id===id); if(!b || b.statut!=="vote") return; }
  else{
    const t=val("b_titre").trim(); if(!t){ modaleInfo("Indiquez au moins un titre."); return; }
    donnees={titre:t,type:val("b_type"),cout:parseFloat(String(val("b_cout")).replace(",","."))||0,description:val("b_desc").trim()};
  }
  const titre=id?b.titre:donnees.titre;
  const jour=await modaleDate("Date de la s\u00e9ance du CA qui a approuv\u00e9 « "+(titre||"")+" » \u00e0 la majorit\u00e9 simple.\n\n"+(id?"Le vote en ligne sera cl\u00f4tur\u00e9. ":"Aucun vote en ligne ne sera ouvert. ")+"Le PDF de la d\u00e9cision sera envoy\u00e9 \u00e0 tous les membres du CA.","Vot\u00e9 en CA physique");
  if(!jour) return;
  const reserve=await modaleReserve(titre||""); if(reserve===null) return;
  const sig=(S.session&&S.session.sig)||"\u2014";
  const decidePar="CA physique \u00b7 "+sig, decideLe=new Date(jour+"T12:00:00").toISOString();
  let r;
  if(id) r=await sb.from("ca_budgets").update({statut:"approuve",decide_par:decidePar,decide_le:decideLe}).eq("id",id).select();
  else r=await sb.from("ca_budgets").insert(Object.assign({},donnees,{demandeur:sig,statut:"approuve",cree_par:S.session.id,decide_par:decidePar,decide_le:decideLe})).select();
  if(r&&r.error){ modaleInfo("Enregistrement impossible : "+r.error.message); return; }
  if(!r||!r.data||!r.data.length){ await loadBudgets(); render(); modaleInfo("Le serveur a refus\u00e9 l'enregistrement (aucune ligne modifi\u00e9e) \u2014 r\u00e8gle de droits (RLS) sur ca_budgets. Aucun PDF ni mail n'a \u00e9t\u00e9 envoy\u00e9.","D\u00e9cision non enregistr\u00e9e"); return; }
  const ligne=r.data[0];
  await enregistrerReserve(ligne.id, reserve);
  logAct("Budget vot\u00e9 en CA physique"+(reserve!=="aucune"?" (r\u00e9serve du tr\u00e9sorier)":"")+" : "+(titre||""));
  await loadBudgets(); render();
  const bf=Object.assign({}, (S.budgets||[]).find(x=>x.id===ligne.id)||(b||{titre:ligne.titre,type:ligne.type,cout:ligne.cout,desc:ligne.description,demandeur:ligne.demandeur,votes:[]}),
    {statut:"approuve",decidePar:decidePar,decideLe:decideLe,reserve:reserve});
  await diffuserDecisionBudget(bf,"approuve",false,sig,effectifCA(),seuilMajorite());
}
/* Ouvre le PDF de décision envoyé ; à défaut (anciens budgets), le régénère. */
async function ouvrirPDFDecision(id){
  const b=(S.budgets||[]).find(x=>x.id===id); if(!b||!sb) return;
  const nom=nomPDF("budget-"+(b.titre||""));
  if(b.pdfPath){
    try{
      const su=await sb.storage.from("ca-documents").createSignedUrl(b.pdfPath, 600, {download:nom});
      if(su&&su.data&&su.data.signedUrl){ window.open(su.data.signedUrl,"_blank"); return; }
    }catch(_){ }
  }
  try{ await telechargerPDF(nom, cssDocImprimable(), corpsPDFBudget(b)); }
  catch(e){ modaleInfo("Le PDF n'a pas pu \u00eatre g\u00e9n\u00e9r\u00e9."); }
}
/* PDF de la décision + dépôt + mail à tout le CA. Commun au vote en ligne et au vote en présentiel. */
async function diffuserDecisionBudget(bf, st, force, sig, n, seuil){
  const presentiel=budgetPresentiel(bf);
  /* PDF fabriqué dans le navigateur, puis déposé dans ca-documents pour le lien. */
  const nomFichier=nomPDF("budget-"+(bf.titre||""));
  let blob=null;
  try{ blob=await telechargerPDF(nomFichier, cssDocImprimable(), corpsPDFBudget(bf), null, "blob"); }catch(e){ blob=null; }
  if(!blob){ modaleInfo((presentiel?"Budget enregistr\u00e9 comme vot\u00e9 en CA physique.":"Vote cl\u00f4tur\u00e9 : "+(st==="approuve"?"approuv\u00e9":"refus\u00e9")+".")+"\nLe PDF n'a pas pu \u00eatre g\u00e9n\u00e9r\u00e9, aucun mail n'a \u00e9t\u00e9 envoy\u00e9.","Cl\u00f4ture enregistr\u00e9e"); return; }
  let lien="", ennuiDepot="";
  try{
    const chemin=uid()+"-"+nomFichier;
    const up=await sb.storage.from("ca-documents").upload(chemin, blob, {contentType:"application/pdf", upsert:false});
    if(up&&up.error){ ennuiDepot="d\u00e9p\u00f4t refus\u00e9 \u2014 "+up.error.message; }
    else{
      /* Trace du PDF envoyé. Si la colonne pdf_path n'existe pas encore, l'erreur est ignorée. */
      if(bf.id){ try{ const pm=await sb.from("ca_budgets").update({pdf_path:chemin}).eq("id",bf.id); if(!(pm&&pm.error)){ const loc=(S.budgets||[]).find(x=>x.id===bf.id); if(loc){ loc.pdfPath=chemin; render(); } } }catch(_){ } }
      const su=await sb.storage.from("ca-documents").createSignedUrl(chemin, CA_LIEN_DUREE, {download:nomFichier});
      if(su&&su.error) ennuiDepot="lien refus\u00e9 \u2014 "+su.error.message;
      else if(su&&su.data&&su.data.signedUrl) lien=su.data.signedUrl;
      else ennuiDepot="lien vide, sans message d'erreur";
    }
  }catch(e){ ennuiDepot="d\u00e9p\u00f4t impossible \u2014 "+((e&&e.message)||e); }
  if(ennuiDepot){ try{ console.error("[CA] PDF de d\u00e9cision : "+ennuiDepot); }catch(_){ } }

  let piece=null;
  try{
    const b64=await blobEnBase64(blob);
    if(b64.length < 4500000) piece={filename:nomFichier, content:b64, contentType:"application/pdf"};
  }catch(e){ piece=null; }

  const pourL=prenomsParChoix(bf,"pour"), contreL=prenomsParChoix(bf,"contre"), abstL=prenomsParChoix(bf,"abst");
  const titreMail=(st==="approuve"?"Budget approuv\u00e9 \u2014 ":"Budget refus\u00e9 \u2014 ")+(bf.titre||"");
  const corps=`<h2 style="margin:0 0 10px">${st==="approuve"?"Budget approuv\u00e9":"Budget refus\u00e9"}</h2>`
    +`<p style="font-size:16px"><b>${caMailEsc(bf.titre||"")}</b>${bf.cout>0?" \u2014 "+caMailEsc(eur(bf.cout)):""}</p>`
    +(presentiel?`<p><b>${caMailEsc(mentionPresentiel(bf))}</b></p>`:`<p>${caMailEsc(pourL.length+" voix pour sur "+n+" membres (majorit\u00e9 simple : "+seuil+").")}</p>`)
    +(force?`<p style="background:#fff4f4;border:1px solid #e8c4c4;border-radius:8px;padding:10px;color:#8a2b2b"><b>Approbation hors seuil</b> \u2014 la majorit\u00e9 simple n'\u00e9tait pas atteinte. D\u00e9cision prise par ${caMailEsc(sig)}.</p>`:"")
    +(presentiel?"":`<p><b>Pour (${pourL.length}) :</b> ${caMailEsc(listePrenoms(pourL))}<br>`
    +`<b>Contre (${contreL.length}) :</b> ${caMailEsc(listePrenoms(contreL))}<br>`
    +`<b>Abstention (${abstL.length}) :</b> ${caMailEsc(listePrenoms(abstL))}</p>`)
    +(reserveInfo(bf)?(reserveInfo(bf).reserve
        ?`<p style="background:#fff8ec;border:1px solid #ecd3a6;border-radius:8px;padding:10px;color:#7a4a12"><b>\u26a0 R\u00e9serve du tr\u00e9sorier</b>${reserveInfo(bf).texte?" : "+caMailEsc(reserveInfo(bf).texte):""}</p>`
        :`<p><b>\u2713 Aucune r\u00e9serve du tr\u00e9sorier.</b></p>`):"")
    +(lien?`<p><a href="${lien}" style="background:#241c46;color:#fff;padding:11px 20px;border-radius:8px;text-decoration:none;font-weight:bold;display:inline-block">T\u00e9l\u00e9charger le PDF de la d\u00e9cision</a></p>`:"")
    +(presentiel?`<p>Le PDF de la d\u00e9cision est joint \u00e0 ce message.</p>`:`<p>Le d\u00e9tail complet, non-votants compris, figure dans le PDF de la d\u00e9cision.</p>`);
  const res=await envoyerAvecPiece(destinatairesDecision(), titreMail, corps, piece);
  const tete=presentiel?"Vot\u00e9 en CA physique \u2014 approuv\u00e9":"Vote cl\u00f4tur\u00e9 \u2014 "+(st==="approuve"?"approuv\u00e9":"refus\u00e9");
  if(!res.total) modaleInfo("D\u00e9cision enregistr\u00e9e, mais aucun destinataire disponible.",tete);
  else modaleInfo("\u2713 "+res.ok+" membre(s) pr\u00e9venu(s)"+(res.err?", "+res.err+" \u00e9chec(s)":"")+"."
    +((res.sansPiece&&res.ok)?"\n\u26a0 Le serveur a refus\u00e9 la pi\u00e8ce jointe : le mail contient le lien de t\u00e9l\u00e9chargement.":"")
    +(ennuiDepot?"\n\u26a0 Pas de lien de t\u00e9l\u00e9chargement dans le mail ("+ennuiDepot+")."+(piece?" Le PDF reste joint au message.":" Le PDF n'a donc pas \u00e9t\u00e9 transmis."):""),tete);
}

/* ---- Notification e-mail : nouvelle demande d'inscription ---- */
async function traiterInscriptions(){
  if(!sb||!S.session) return;
  if(S.session.statut!=="actif") return;                 // seul un membre actif d\u00e9clenche l'envoi
  const attentes=(S.admins||[]).filter(a=>a.statut==="attente");
  if(!attentes.length) return;
  const owners=(S.admins||[]).filter(a=>a.email && a.statut==="actif" && a.role==="owner").map(a=>a.email);
  if(!owners.length) return;
  for(const a of attentes){
    try{
      /* Cle datee : une demande refusee puis renouvelee redeclenche l'alerte.
         On marque APRES l'envoi, sinon un envoi rate bloquerait l'alerte pour toujours. */
      const cle="inscription:"+a.id+":"+todayISO();
      const deja=await sb.from("ca_rappels_envoyes").select("cle").eq("cle",cle).maybeSingle();
      if(deja&&deja.data) continue;
      const nom=((a.prenom||"")+" "+(a.nom||"")).trim()||a.email||"Nouveau membre";
      const estC = !!a.viaCode;
      await envoyerNotifCAListe(owners, estC?"Nouvelle demande \u2014 coopt\u00e9\u00b7e":"Nouvelle demande d'inscription en attente",
        ("<p>Une nouvelle demande est <b>en attente de validation</b>"+(estC?" \u2014 <b>coopt\u00e9\u00b7e</b> (code "+caMailEsc(a.viaCode)+")":"")+" :</p><p><b>"+caMailEsc(nom)+"</b>"+(a.fonction?(" \u2014 "+caMailEsc(a.fonction)):"")+"</p><p>"+caMailEsc(a.email||"")+"</p><p>Connectez-vous \u00e0 l'espace CA pour la valider.</p>"), true);
      try{ await sb.from("ca_rappels_envoyes").insert({cle:cle}); }catch(_){ }
      logAct("Notification d'inscription envoy\u00e9e pour "+nom);
    }catch(e){}
  }
}

/* ---- pseudo-onglet NOTIFICATIONS (à traiter) ---- */
function tabNotifs(){
  const owner=S.session.role==="owner";

  const budVote=(S.budgets||[]).filter(b=>b.statut==="vote" && !monVoteBudget(b));

/* ---- pseudo-onglet RECHERCHE globale ---- */
function tabSearch(){
  const q=(S.searchQ||"").trim().toLowerCase();
  const compose=`<div class="compose"><h3 class="serif">Recherche</h3>
    <input class="f" id="search_q" data-change="search" value="${esc(S.searchQ||"")}" placeholder="Tâche, contact, événement, annonce, membre…" autofocus>
    <div class="row-btn"><button class="btn sm" data-action="noop">Rechercher</button></div></div>`;
  if(q.length<2) return compose+`<div class="empty">Tapez au moins 2 caractères, puis validez (Entrée).</div>`;
  const res=[];
  const add=(label,sub,tab)=>res.push({label,sub,tab});
  (S.taches||[]).forEach(t=>{ if((t.titre||"").toLowerCase().includes(q)) add(t.titre,"Tâche","taches"); });
  (S.contacts||[]).forEach(c=>{ if([c.nom,c.email,c.notes,c.type].some(x=>(x||"").toLowerCase().includes(q))) add(c.nom,"Contact · "+(c.type||""),"contacts"); });
  (S.annonces||[]).forEach(a=>{ if([a.texte,a.auteur].some(x=>(x||"").toLowerCase().includes(q))) add((a.texte||"").slice(0,60),"Annonce · "+(a.auteur||""),"annonces"); });
  (S.evenements||[]).forEach(e=>{ if([e.titre,e.lieu,e.responsable].some(x=>(x||"").toLowerCase().includes(q))) add(e.titre,"Événement","evenements"); });
  (S.reunions||[]).forEach(m=>{ if((m.titre||"").toLowerCase().includes(q)) add(m.titre,"Réunion","reunions"); });
  (S.budgets||[]).forEach(b=>{ if([b.titre,b.desc].some(x=>(x||"").toLowerCase().includes(q))) add(b.titre,"Budget & projet","budgets"); });
  (S.docs||[]).forEach(d=>{ if([d.titre,d.cat].some(x=>(x||"").toLowerCase().includes(q))) add(d.titre,"Document","docs"); });
  PERSONNES.forEach(p=>{ if((p.prenom+" "+p.nom+" "+p.fonction).toLowerCase().includes(q)) add(p.prenom+" "+p.nom,"Membre · "+p.fonction,"org"); });
  if(res.length===0) return compose+`<div class="empty">Aucun résultat pour « ${esc(S.searchQ)} ».</div>`;
  const rows=res.slice(0,50).map(r=>`<button class="msg-row" data-action="set-tab" data-tab="${r.tab}"><span><span class="nm">${esc(r.label)}</span><br><span class="fn">${esc(r.sub)}</span></span></button>`).join("");
  return compose+`<div class="msg-list">${rows}</div>`;
}

async function boot(){
  try{ const params=new URLSearchParams(location.search); if(params.get("desabo")!=null){ await pageDesabo(params.get("desabo"), params.get("t")||""); return; } }catch(e){}
  /* Lien de participation : ?go=bilan mène à l'onglet Bilans moraux, après connexion. */
  try{ const params=new URLSearchParams(location.search); const g=params.get("go");
    const c=params.get("c");
    const retourAuth = /access_token|type=signup|type=magiclink|type=invite/.test(String(location.hash||""));
    if(g){ S.goto=g; S.view="ca"; try{ sessionStorage.setItem("ca:goto",g); }catch(_){ } }
    else if(retourAuth){
      /* Uniquement au retour du lien de confirmation : sinon l'adresse normale
         doit afficher la page d'accueil Caisse / CA. */
      try{ const m=sessionStorage.getItem("ca:goto"); if(m){ S.goto=m; S.view="ca"; } }catch(_){ }
    }
    if(g==="coopte"){ S.authMode="signup"; }
    if(c){ S.viaCode=c; try{ sessionStorage.setItem("ca:c",c); }catch(_){ } }
    else if(retourAuth){ try{ const m=sessionStorage.getItem("ca:c"); if(m) S.viaCode=m; }catch(_){ } }
  }catch(e){}
  /* Retour depuis le lien de confirmation d'e-mail : Supabase renvoie sur la racine,
     on repart directement dans l'espace CA plutot que sur la page d'accueil. */
  try{ const h=String(location.hash||"");
    if(/access_token|type=signup|type=magiclink|type=invite/.test(h)) S.view="ca";
  }catch(e){}
  etuDemarrer();
  if(!sb){ render(); return; }
  try{ const h=String(location.hash||""); if(/type=recovery/.test(h)||/[?&]type=recovery/.test(location.search)){ S.recovery=true; } }catch(e){}
  try{ await refreshSession(); }catch(e){} render();
  if(S.session){ traiterEnvoisProgrammes().then(()=>{ if(S.tab==="mail") rendreEnPreservant(); }).catch(()=>{}); traiterRappels().catch(()=>{}); traiterRecapIdees().catch(()=>{}); traiterInscriptions().catch(()=>{}); traiterRetardsMediation().catch(()=>{}); }
  try{ sb.auth.onAuthStateChange(async (evt)=>{
    if(evt==="PASSWORD_RECOVERY"){ S.recovery=true; render(); return; }
    if(S.recovery) return;
    const avant=(S.session&&S.session.id)||null;
    await refreshSession();
    const apres=(S.session&&S.session.id)||null;
    /* Meme personne qu'avant : c'est un simple rafraichissement de jeton, pas
       une connexion. On redessine en gardant la saisie en cours. */
    if(avant===apres) rendreEnPreservant(); else render();
  }); }catch(e){} }
