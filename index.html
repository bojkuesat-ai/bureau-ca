const soutTE=new TextEncoder(), soutTD=new TextDecoder();
function soutB64(buf){ const b=new Uint8Array(buf); let s=""; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function soutUnB64(s){ const bin=atob(String(s||"")); const b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b; }
function soutHex(buf){ return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
async function soutSha(str){ return crypto.subtle.digest("SHA-256", soutTE.encode(str)); }
function soutCodeAleatoire(groupes){
  const out=[]; const r=crypto.getRandomValues(new Uint8Array(groupes*4*2)); let k=0;
  for(let g=0; g<groupes; g++){ let s=""; while(s.length<4){ const v=r[k++]; if(k>=r.length){ crypto.getRandomValues(r); k=0; } if(v<SOUT_ALPHA.length*8){ s+=SOUT_ALPHA[v%SOUT_ALPHA.length]; } } out.push(s); }
  return out.join("-");
}
function soutNormaliser(s){
  const brut=String(s||"").toUpperCase().replace(/O/g,"0").replace(/[IL]/g,"1").replace(/[^A-Z0-9]/g,"");
  return (brut.match(/.{1,4}/g)||[]).join("-");
}
async function soutAcces(token){ return soutHex(await soutSha("be-soutien-acces:"+soutNormaliser(token))); }
async function soutCleJeton(token){
  return crypto.subtle.importKey("raw", await soutSha("be-soutien-cle:"+soutNormaliser(token)), {name:"AES-GCM"}, false, ["encrypt","decrypt"]);
}
async function soutClePhrase(phrase, selB64){
  const base=await crypto.subtle.importKey("raw", soutTE.encode(soutNormaliser(phrase)), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:soutUnB64(selB64), iterations:310000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function soutChiffrer(cle, obj, aad){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM", iv, additionalData:soutTE.encode(aad||"")}, cle, soutTE.encode(JSON.stringify(obj)));
  return {iv:soutB64(iv), ct:soutB64(ct)};
}
async function soutDechiffrer(cle, iv, ct, aad){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:soutUnB64(iv), additionalData:soutTE.encode(aad||"")}, cle, soutUnB64(ct));
  return JSON.parse(soutTD.decode(pt));
}
/* Bourrage : avant chiffrement, chaque message est complété jusqu'à un palier
   (256 o, 1 Ko, 4 Ko, 16 Ko, puis par tranches de 4 Ko). Un « ok » et un long
   message ont ainsi la même taille dans la base : leur longueur ne trahit rien. */
const SOUT_PALIERS=[256,1024,4096,16384];
function soutBourrer(obj){
  const o=Object.assign({}, obj); delete o._;
  const n=soutTE.encode(JSON.stringify(Object.assign({}, o, {_:""}))).length;
  let cible=SOUT_PALIERS.find(x=>x>=n) || Math.ceil(n/4096)*4096;
  if(cible>29000) cible=n;                       /* reste sous la limite du serveur */
  o._=" ".repeat(Math.max(0, cible-n));
  return o;
}
async function soutChiffrerMsg(cle, obj, aad){ return soutChiffrer(cle, soutBourrer(obj), aad); }
async function soutEnvelopper(cle, obj, aad){ const r=await soutChiffrer(cle, obj, aad); return r.iv+"."+r.ct; }
async function soutDesenvelopper(cle, s, aad){ const p=String(s||"").split("."); return soutDechiffrer(cle, p[0], p[1], aad); }
async function soutPaire(){ return crypto.subtle.generateKey({name:"ECDH", namedCurve:"P-256"}, true, ["deriveBits"]); }
async function soutPub(jwk){ return crypto.subtle.importKey("jwk", {kty:jwk.kty, crv:jwk.crv, x:jwk.x, y:jwk.y, ext:true}, {name:"ECDH", namedCurve:"P-256"}, false, []); }
async function soutPriv(jwk){ return crypto.subtle.importKey("jwk", jwk, {name:"ECDH", namedCurve:"P-256"}, false, ["deriveBits"]); }
function soutPubJwk(jwk){ return {kty:jwk.kty, crv:jwk.crv, x:jwk.x, y:jwk.y}; }
/* Clé de conversation : ECDH (ma clé privée + clé publique de l'autre) puis HKDF. */
async function soutCleConv(priv, pubJwk, convId){
  const bits=await crypto.subtle.deriveBits({name:"ECDH", public:await soutPub(pubJwk)}, priv, 256);
  const hk=await crypto.subtle.importKey("raw", bits, "HKDF", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"HKDF", hash:"SHA-256", salt:soutTE.encode(String(convId)), info:soutTE.encode("be-soutien-v1")}, hk, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
/* Code de vérification : identique chez le membre et chez Lamia si personne ne s'interpose. */
async function soutCodeVerif(pubLamia, pubMembre){
  const h=new Uint8Array(await soutSha("be-soutien-verif|"+pubLamia.x+"."+pubLamia.y+"|"+pubMembre.x+"."+pubMembre.y));
  const n=((h[0]<<24)>>>0)+(h[1]<<16)+(h[2]<<8)+h[3];
  const s=String(n%100000000).padStart(8,"0");
  return s.slice(0,4)+" · "+s.slice(4);
}

/* ---------- État ---------- */
function soutEtat(){
  const etu=!!S.etu;
  const uidMe=etu?"etu":((S.session&&S.session.id)||null);
  if(!S.sout || S.sout.uid!==uidMe){
    S.sout={uid:uidMe, mode:etu?"etu":"ca", info:null, charge:false, chargement:false, erreur:"", vue:"accueil", convs:[], ouverte:null,
      lamia:{cle:null, liste:[], ouverte:null, stats:null, espace:"ca", nb:{ca:0,etu:0}}, occupe:false};
  }
  return S.sout;
}
function soutCleLocale(){ return (S.sout&&S.sout.mode==="etu")?"soutien:etu:convs":"soutien:convs:"+((S.session&&S.session.id)||""); }
function soutConvsLocales(){ const l=store.get(soutCleLocale(), []); return Array.isArray(l)?l.filter(x=>x&&x.t):[]; }
function soutSauverConvs(l){ store.set(soutCleLocale(), l); }
function soutCleLamiaLocale(){ return "soutien:lamia:"+((S.session&&S.session.id)||""); }

async function soutRpc(fn, args){
  if(S.sout && S.sout.mode==="etu"){                       /* page publique : client anonyme, fonctions etu_psy_* */
    if(!SOUT_RPC_ETU[fn]) throw new Error("Action non disponible.");
    return etuRpc(SOUT_RPC_ETU[fn], args);
  }
  if(!sb) throw new Error("Serveur indisponible.");
  const r=await sb.rpc(fn, args||{});
  if(r&&r.error){
    const m=String(r.error.message||"Erreur serveur.");
    if(/Could not find the function|does not exist|schema cache/i.test(m)) throw new Error("L'espace Soutien n'est pas encore installé sur le serveur : le script SQL doit être exécuté dans Supabase.");
    throw new Error(m);
  }
  return r?r.data:null;
}
function soutRedessiner(){ if(S.etu || ((S.tab==="soutien"||S.tab==="soutien_etu") && S.session)){ try{ rendreEnPreservant(); }catch(e){ render(); } } }
function soutNonLus(espace){
  const s=S.sout; if(!s||!s.info||s.mode==="etu") return 0;
  if(s.info.est_lamia) return (s.lamia.nb&&s.lamia.nb[espace||"ca"])||0;
  return espace==="etu"?0:(s.convs||[]).filter(c=>c.non_lu).length;
}
/* Lamia passe d'un espace à l'autre (CA / étudiants) : même clé, listes séparées. */
function soutLamiaEspace(e){
  const s=soutEtat(); if(s.mode==="etu") return;
  if(s.lamia.espace===e) return;
  s.lamia.espace=e; s.lamia.ouverte=null; s.lamia.liste=[]; s.lamia.stats=null; s.vue="accueil";
  if(s.lamia.cle) soutLamiaListe().then(soutRedessiner).catch(()=>{});
}

/* ---------- Chargement ---------- */
async function soutCharger(){
  const s=soutEtat(); if(s.chargement||(!S.session&&s.mode!=="etu")) return;
  s.chargement=true; s.erreur="";
  try{
    s.info=await soutRpc("soutien_info");
    if(s.info.est_lamia){ await soutLamiaCleLocale(); await soutLamiaListe(); }
    else { await soutResume(); }
    s.charge=true;
  }catch(e){ s.erreur=e.message||String(e); }
  s.chargement=false;
  soutRedessiner();
}
/* Badge de l'onglet au démarrage (aucun déchiffrement). */
async function loadSoutien(){
  try{ const s=soutEtat(); if(!S.session) return;
    s.info=await soutRpc("soutien_info");
    if(s.info.est_lamia){
      await soutLamiaCleLocale();                          /* clé déjà sur l'appareil : pas de verrouillage inutile */
      try{ const l=(await soutRpc("soutien_lamia_liste",{p_espace:"etu"}))||[]; s.lamia.nb.etu=l.filter(c=>c.non_lu).length; }catch(e){}
      await soutLamiaListe();
    } else await soutResume();
    s.charge=true; s.erreur="";
  }catch(e){ /* onglet pas encore installé : silencieux */ }
}
async function soutResume(){
  const s=soutEtat(); const loc=soutConvsLocales();
  if(!loc.length){ s.convs=[]; return; }
  const acces=await Promise.all(loc.map(c=>soutAcces(c.t)));
  const r=await soutRpc("soutien_resume", {p_acces:acces});
  const gardees=[]; const convs=[];
  (r||[]).forEach(x=>{ const c=loc[x.i-1]; if(!c) return; if(x.existe){ gardees.push(c); convs.push({t:c.t, code:x.code, non_lu:!!x.non_lu}); } });
  if(gardees.length!==loc.length) soutSauverConvs(gardees);
  s.convs=convs;
}
async function soutRafraichir(){
  const s=S.sout; if(!s||!s.info||s.occupe||(!S.session&&s.mode!=="etu")) return;
  try{
    const avant=JSON.stringify([s.convs, s.lamia.liste, s.ouverte&&s.ouverte.msgs.length, s.lamia.ouverte&&s.lamia.ouverte.msgs.length]);
    s.info=Object.assign(s.info, await soutRpc("soutien_info"));
    if(s.info.est_lamia){
      if(!s.lamia.cle) return;
      await soutLamiaListe();
      if(s.lamia.ouverte) await soutLamiaOuvrir(s.lamia.ouverte.id, true);
    } else {
      await soutResume();
      if(s.ouverte) await soutMembreOuvrir(s.ouverte.token, true);
    }
    const apres=JSON.stringify([s.convs, s.lamia.liste, s.ouverte&&s.ouverte.msgs.length, s.lamia.ouverte&&s.lamia.ouverte.msgs.length]);
    if(avant!==apres) soutRedessiner();
  }catch(e){}
}

/* ---------- Déchiffrement d'une liste de messages ---------- */
async function soutDechiffrerMsgs(cle, convId, msgs){
  const out=[];
  for(const m of (msgs||[])){
    let d=null;
    try{ d=await soutDechiffrer(cle, m.iv, m.contenu, convId+":"+m.auteur+":"+m.type); }catch(e){ d=null; }
    if(d && typeof d==="object") delete d._;
    out.push({id:m.id, auteur:m.auteur, type:m.type, ts:m.cree_le, d:d});
  }
  return out;
}

/* ======================= CÔTÉ MEMBRE ======================= */
async function soutMembreNouvelle(){
  const s=soutEtat(); if(s.occupe) return;
  if(!s.info||!s.info.pub_lamia){ modaleInfo("L'espace Soutien n'est pas encore activé par Lamia. Réessayez un peu plus tard.","Soutien psychologique"); return; }
  if(s.info.pause_jusqua){ modaleInfo(soutTextePause(s.info.pause_jusqua),"Soutien psychologique"); return; }
  if(!(await modaleConfirm("Vous allez ouvrir une conversation privée avec Lamia.\n\n• Lamia ne saura pas qui vous êtes.\n• Vos messages sont chiffrés de bout en bout : seule Lamia peut les lire.\n• Un code de récupération va s'afficher : notez-le, c'est le seul moyen de retrouver la conversation sur un autre appareil.","Écrire à Lamia"))) return;
  s.occupe=true;
  try{
    const token=soutCodeAleatoire(5);
    const acces=await soutAcces(token);
    const paire=await soutPaire();
    const privJwk=await crypto.subtle.exportKey("jwk", paire.privateKey);
    const pubJwk=soutPubJwk(await crypto.subtle.exportKey("jwk", paire.publicKey));
    const enveloppe=await soutEnvelopper(await soutCleJeton(token), privJwk, "membre-priv");
    const r=await soutRpc("soutien_creer", {p_acces:acces, p_pub:pubJwk, p_priv:enveloppe});
    const loc=soutConvsLocales(); loc.unshift({t:token, code:r.code}); soutSauverConvs(loc);
    s.occupe=false;
    await soutMembreOuvrir(token);
    s.vue="conv"; soutRedessiner();
    soutAfficherCode(token, true);
  }catch(e){ s.occupe=false; modaleInfo("La conversation n'a pas pu être créée : "+(e.message||e),"Soutien psychologique"); }
}
function soutAfficherCode(token, nouveau){
  modaleInfo((nouveau?"Votre conversation est ouverte.\n\n":"")+"Votre code de récupération :\n\n"+soutNormaliser(token)+"\n\nNotez-le sur papier ou dans un gestionnaire de mots de passe. C'est le seul moyen de retrouver cette conversation sur un autre appareil ou si vous videz votre navigateur.\n\nPersonne — ni Lamia, ni le bureau — ne peut le retrouver pour vous. Ne le partagez avec personne.","🔑 Code de récupération");
}
async function soutMembreRetrouver(){
  const s=soutEtat();
  const saisie=await modaleChamp("Saisissez le code de récupération de votre conversation (ex. K7QM-4XPA-…).","Retrouver une conversation",{placeholder:"XXXX-XXXX-XXXX-XXXX-XXXX",bouton:"Ouvrir"});
  if(saisie===null) return;
  const token=soutNormaliser(saisie);
  if(token.replace(/-/g,"").length<20){ modaleInfo("Ce code est incomplet. Il compte 20 caractères."); return; }
  try{
    await soutMembreOuvrir(token);
    const loc=soutConvsLocales();
    if(!loc.some(c=>soutNormaliser(c.t)===token)){ loc.unshift({t:token, code:s.ouverte.code}); soutSauverConvs(loc); }
    await soutResume().catch(()=>{});
    s.vue="conv"; soutRedessiner();
  }catch(e){ modaleInfo(e.message||String(e),"Retrouver une conversation"); }
}
async function soutMembreOuvrir(token, silencieux){
  const s=soutEtat();
  const acces=await soutAcces(token);
  const c=await soutRpc("soutien_ouvrir", {p_acces:acces});
  let cle=(s.ouverte&&s.ouverte.id===c.id)?s.ouverte.cle:null, verif=(s.ouverte&&s.ouverte.id===c.id)?s.ouverte.verif:"";
  if(!cle){
    let privJwk;
    try{ privJwk=await soutDesenvelopper(await soutCleJeton(token), c.priv_membre_chiffree, "membre-priv"); }
    catch(e){ throw new Error("Code de récupération incorrect pour cette conversation."); }
    if(!s.info.pub_lamia) throw new Error("La clé de Lamia est introuvable.");
    cle=await soutCleConv(await soutPriv(privJwk), s.info.pub_lamia, c.id);
    verif=await soutCodeVerif(s.info.pub_lamia, c.pub_membre);
  }
  const msgs=await soutDechiffrerMsgs(cle, c.id, c.messages);
  s.ouverte={token:token, acces:acces, id:c.id, code:c.code, cle:cle, verif:verif, msgs:msgs,
    clause:c.clause_signee_le, avis:c.avis, aReponse:!!c.a_reponse, creeLe:c.cree_le, bloquee:c.bloquee_le||null};
  const l=(s.convs||[]).find(x=>soutNormaliser(x.t)===soutNormaliser(token)); if(l) l.non_lu=false;
  if(!silencieux) soutRedessiner();
}
async function soutMembreEnvoyer(){
  const s=soutEtat(); const o=s.ouverte; if(!o||s.occupe) return;
  const champ=document.getElementById("sout_txt"); const texte=String(champ?champ.value:"").trim();
  if(!texte) return;
  if(texte.length>8000){ modaleInfo("Message trop long (8 000 caractères maximum)."); return; }
  s.occupe=true;
  try{
    const e=await soutChiffrerMsg(o.cle, {t:texte}, o.id+":membre:texte");
    const r=await soutRpc("soutien_envoyer", {p_acces:o.acces, p_iv:e.iv, p_contenu:e.ct});
    if(champ) champ.value="";
    s.occupe=false;
    await soutMembreOuvrir(o.token);
    /* Prévenir Lamia (sans identité ni contenu) : au premier message, puis au plus une fois par 15 min. */
    const dernier=r&&r.dernier?new Date(r.dernier).getTime():0;
    if(r&&(r.premier || Date.now()-dernier>15*60*1000)) soutNotifierLamia().catch(()=>{});
  }catch(e){ s.occupe=false; modaleInfo("Message non envoyé : "+(e.message||e)); }
}
function soutEmailLamia(){
  const s=S.sout; const id=s&&s.info&&s.info.lamia_id;
  const l=(S.admins||[]).find(a=>a.id===id); return (l&&l.email)||"";
}
async function soutNotifierLamia(){
  if(S.sout && S.sout.mode==="etu"){ soutNotifServeur("psy_etu"); return; }
  const dest=soutEmailLamia(); if(!dest) return;
  const corps=`<h2 style="margin:0 0 10px;color:#241c46">Espace Soutien psychologique</h2>`
    +`<p>Vous avez un nouveau message dans l'espace Soutien.</p>`
    +`<p>Ouvrez l'application, onglet <b>Soutien psychologique</b>, pour le lire.</p>`
    +`<p style="font-size:12px;color:#666">Pour protéger la personne, ce mail ne contient ni son identité ni le contenu du message.</p>`;
  await envoyerAvecPiece([dest], "Espace Soutien — nouveau message", corps, null, {sansInvitation:true, tous:true});
}
async function soutMembreEffacer(){
  const s=soutEtat(); const o=s.ouverte; if(!o) return;
  if(!(await modaleConfirm("Effacer définitivement cette conversation ?\n\nTous les messages seront supprimés tout de suite, pour vous comme pour Lamia. C'est irréversible.","Effacer maintenant"))) return;
  try{
    await soutRpc("soutien_effacer", {p_acces:o.acces});
    soutSauverConvs(soutConvsLocales().filter(c=>soutNormaliser(c.t)!==soutNormaliser(o.token)));
    s.ouverte=null; s.vue="accueil"; await soutResume().catch(()=>{});
    soutRedessiner(); modaleInfo("La conversation a été effacée.","Effacer maintenant");
  }catch(e){ modaleInfo("Effacement impossible : "+(e.message||e)); }
}
async function soutMembreAvis(v){
  const s=soutEtat(); const o=s.ouverte; if(!o) return;
  try{ await soutRpc("soutien_avis", {p_acces:o.acces, p_valeur:v}); o.avis=v; soutRedessiner(); modaleInfo("Merci pour votre avis. Il est anonyme.","Avis"); }
  catch(e){ modaleInfo(e.message||String(e)); }
}

/* ======================= CÔTÉ LAMIA ======================= */
async function soutLamiaCleLocale(){
  const s=soutEtat(); if(s.lamia.cle) return;
  const jwk=store.get(soutCleLamiaLocale(), null);
  if(!jwk || !s.info.pub_lamia) return;
  if(jwk.x!==s.info.pub_lamia.x){ store.set(soutCleLamiaLocale(), null); return; } /* clé remplacée entre-temps */
  try{ s.lamia.cle=await soutPriv(jwk); }catch(e){ store.set(soutCleLamiaLocale(), null); }
}
async function soutLamiaConfigurer(reinit){
  const s=soutEtat(); if(s.occupe) return;
  if(reinit){
    if(!(await modaleConfirm("Réinitialiser vos clés ?\n\nÀ utiliser uniquement si vous avez perdu votre phrase de récupération.\n\nTOUTES les conversations en cours seront effacées définitivement (elles deviendraient illisibles de toute façon).","Phrase perdue"))) return;
  } else {
    if(!(await modaleConfirm("Vous allez activer l'espace Soutien.\n\nUne phrase de récupération va s'afficher. Notez-la sur papier et gardez-la en lieu sûr : elle seule permet de lire les messages sur un nouveau téléphone. Personne ne peut la retrouver pour vous.","Activer l'espace Soutien"))) return;
  }
  const phrase=soutCodeAleatoire(6);
  modaleInfo("Votre phrase de récupération :\n\n"+phrase+"\n\nNotez-la maintenant. Vous allez devoir la retaper pour confirmer.","🔑 Phrase de récupération");
  await new Promise(r=>{ const t=setInterval(()=>{ if(!document.getElementById("ca_modal_info")){ clearInterval(t); r(); } },200); });
  let ok=false, err="";
  for(let i=0;i<3 && !ok;i++){
    const v=await modaleChamp("Retapez votre phrase de récupération pour confirmer que vous l'avez bien notée.","Confirmer la phrase",{placeholder:"XXXX-XXXX-XXXX-XXXX-XXXX-XXXX",bouton:"Confirmer",erreur:err});
    if(v===null) return;
    if(soutNormaliser(v)===phrase) ok=true; else err="La phrase ne correspond pas. Vérifiez ce que vous avez noté.";
  }
  if(!ok){ modaleInfo("Activation annulée : la phrase n'a pas été confirmée. Recommencez quand vous êtes prête."); return; }
  s.occupe=true;
  try{
    const sel=soutB64(crypto.getRandomValues(new Uint8Array(16)));
    const paire=await soutPaire();
    const privJwk=await crypto.subtle.exportKey("jwk", paire.privateKey);
    const pubJwk=soutPubJwk(await crypto.subtle.exportKey("jwk", paire.publicKey));
    const enveloppe=await soutEnvelopper(await soutClePhrase(phrase, sel), privJwk, "lamia-priv");
    await soutRpc("soutien_lamia_init", {p_pub:pubJwk, p_priv:enveloppe, p_sel:sel, p_reinit:!!reinit});
    store.set(soutCleLamiaLocale(), privJwk);
    s.info=await soutRpc("soutien_info"); s.lamia.cle=null; s.lamia.ouverte=null;
    await soutLamiaCleLocale(); await soutLamiaListe();
    s.occupe=false; s.vue="accueil"; soutRedessiner();
    modaleInfo("✓ L'espace Soutien est activé. Les membres peuvent maintenant vous écrire.","Soutien psychologique");
  }catch(e){ s.occupe=false; modaleInfo("Activation impossible : "+(e.message||e)); }
}
async function soutLamiaDeverrouiller(){
  const s=soutEtat(); let err="";
  for(let i=0;i<5;i++){
    const v=await modaleChamp("Saisissez votre phrase de récupération pour lire les messages sur cet appareil.","🔑 Déverrouiller",{placeholder:"XXXX-XXXX-XXXX-XXXX-XXXX-XXXX",bouton:"Déverrouiller",erreur:err});
    if(v===null) return;
    try{
      const privJwk=await soutDesenvelopper(await soutClePhrase(v, s.info.sel), s.info.cle_privee, "lamia-priv");
      store.set(soutCleLamiaLocale(), privJwk);
      s.lamia.cle=await soutPriv(privJwk);
      await soutLamiaListe(); soutRedessiner(); return;
    }catch(e){ err="Phrase incorrecte."; }
  }
}
function soutLamiaVerrouiller(){
  const s=soutEtat(); store.set(soutCleLamiaLocale(), null);
  s.lamia.cle=null; s.lamia.ouverte=null; s.vue="accueil"; soutRedessiner();
  modaleInfo("La clé a été retirée de cet appareil. Votre phrase de récupération sera demandée à la prochaine ouverture.","Verrouillé");
}
async function soutLamiaListe(){ const s=soutEtat(); const e=s.lamia.espace||"ca";
  s.lamia.liste=(await soutRpc("soutien_lamia_liste",{p_espace:e}))||[]; s.lamia.nb[e]=s.lamia.liste.filter(c=>c.non_lu).length; }
async function soutLamiaOuvrir(id, silencieux){
  const s=soutEtat(); if(!s.lamia.cle) return;
  const c=await soutRpc("soutien_lamia_ouvrir", {p_id:id});

  if(!cle){ cle=await soutCleConv(s.lamia.cle, c.pub_membre, c.id); verif=await soutCodeVerif(s.info.pub_lamia, c.pub_membre); }
  const msgs=await soutDechiffrerMsgs(cle, c.id, c.messages);
  s.lamia.ouverte={id:c.id, code:c.code, cle:cle, verif:verif, msgs:msgs, clause:c.clause_signee_le, empreinte:c.clause_empreinte, bloquee:c.bloquee_le||null};

async function soutAuthentifier(email, quoi){
  quoi=quoi||"l'engagement de confidentialité";
  if(!email){ modaleInfo("Votre compte n'a pas d'adresse e-mail : signature impossible."); return false; }
  let err="";
  for(let essai=0; essai<3; essai++){
    const mdp=await modaleChamp("Pour signer "+quoi+", retapez le mot de passe de votre compte ("+email+").","Signer",{type:"password",placeholder:"Mot de passe",bouton:"🔒 Signer",erreur:err});
    if(mdp===null) return false;
    if(!mdp){ err="Saisissez votre mot de passe."; essai--; continue; }
    let r=null; try{ r=await sb.auth.signInWithPassword({email:email, password:mdp}); }catch(e){ r={error:e}; }
    if(!(r&&r.error)) return true;
    err="Mot de passe incorrect.";
  }
  modaleInfo("Mot de passe incorrect (3 essais). L'engagement n'a pas été signé.");
  return false;
}

      +`<p style="font-size:12px;color:#666">Le document a été transmis à la personne dans la conversation chiffrée. Ce mail ne contient aucune information sur son identité.</p>`;

async function soutLamiaEnvoyerRessources(){
  const s=soutEtat(); const o=s.lamia.ouverte; if(!o||!o.clause||o.bloquee||s.occupe) return;
  if(!(await modaleConfirm("Envoyer à la personne la liste des aides (urgences, Centre de Prévention du Suicide, Télé-Accueil, services de l'ULB) ?\n\nElle la recevra dans la conversation, avec des numéros qu'elle peut appeler d'un geste.","Envoyer la liste des aides"))) return;
  s.occupe=true;
  try{
    const e=await soutChiffrerMsg(o.cle, {t:soutRessourcesTexte(), res:1}, o.id+":lamia:texte");
    await soutRpc("soutien_lamia_repondre", {p_id:o.id, p_iv:e.iv, p_contenu:e.ct});
    s.occupe=false; await soutLamiaOuvrir(o.id, true); soutRedessiner();
  }catch(e){ s.occupe=false; modaleInfo("Envoi impossible : "+(e.message||e)); }
}

/* ---------- Statistiques ---------- */
function soutDelai(min){
  if(min==null) return "—"; min=Math.round(min);
  if(min<60) return min+" min";
  const h=Math.floor(min/60), m=min%60;
  if(h<24) return h+" h"+(m?" "+String(m).padStart(2,"0"):"");
  const j=Math.floor(h/24), hr=h%24; return j+" j"+(hr?" "+hr+" h":"");
}
function soutMoisLabel(d){ try{ return new Date(String(d).slice(0,10)+"T00:00").toLocaleDateString("fr-BE",{month:"long",year:"numeric"}); }catch(e){ return d; } }
function soutTableStats(st, pourPDF){
  const mois=(st&&st.mois)||[];
  const tot=mois.reduce((a,m)=>{ ["conversations","msgs_membres","msgs_lamia","clauses","avis_pos","avis_neg","delai_total_min","nb_delais","blocages"].forEach(k=>a[k]=(a[k]||0)+Number(m[k]||0)); return a; },{});
  const ligne=(lab,m,b)=>`<tr${b?' style="font-weight:bold"':""}><td>${esc(lab)}</td><td>${m.conversations||0}</td><td>${m.msgs_membres||0}</td><td>${m.msgs_lamia||0}</td><td>${m.clauses||0}</td><td>${m.avis_pos||0} / ${m.avis_neg||0}</td><td>${m.nb_delais?soutDelai(m.delai_total_min/m.nb_delais):"—"}</td><td>${m.blocages||0}</td></tr>`;
  const st2=pourPDF?"":` class="sout-table"`;
  return `<table${st2}><thead><tr><th>Mois</th><th>Conversations</th><th>Messages reçus</th><th>Réponses</th><th>Engagements signés</th><th>Avis 👍 / 👎</th><th>Délai moyen 1re réponse</th><th>Blocages</th></tr></thead><tbody>`
    +(mois.length?mois.map(m=>ligne(soutMoisLabel(m.mois),m)).join("")+ligne("Total",tot,true):`<tr><td colspan="8">Aucune activité pour le moment.</td></tr>`)
    +`</tbody></table>`;
}
function soutStatsPDF(){
  const s=S.sout; const st=s&&s.lamia.stats; if(!st) return;
  const corps=`<div style="max-width:900px"><h1>Statistiques — Soutien psychologique ${s.lamia.espace==="etu"?"(étudiant·es)":"(membres du CA)"}</h1>
    <p class="d">Document réservé à ${esc(S.session.nom||"")} — généré le ${esc(new Date().toLocaleString("fr-BE"))}</p>
    <p>Conversations actives au moment de l'export : <b>${Number(st.actives||0)}</b></p>
    ${soutTableStats(st, true)}
    <p class="d" style="margin-top:18px">Chiffres mensuels anonymes. Aucun contenu de message ni aucune identité n'est conservé.</p></div>`;
  telechargerPDF(nomPDF("statistiques-soutien"), cssDocImprimable(), corps, "landscape");
}

function soutTel(t){ return `<a href="tel:${esc(String(t).replace(/\s/g,""))}">${esc(t)}</a>`; }

function soutBandeauE2E(verif, pourLamia){
  return `<div class="sout-e2e">🔒 <b>Chiffré de bout en bout.</b> ${pourLamia
      ?"Seule vous pouvez lire ces messages. L'identité de la personne ne vous est jamais transmise."

    <span class="sout-small">Code de vérification : <span class="sout-verif">${esc(verif)}</span> — ${pourLamia?"la personne voit le même code de son côté.":"Lamia voit le même code de son côté : s'il est identique, personne ne s'interpose."}</span>
    · <button class="link" data-action="sout-aide" style="color:inherit">Comment ça marche ?</button></div>`;
}
function soutBulles(o, pourLamia){
  const moi=pourLamia?"lamia":"membre";
  const html=(o.msgs||[]).map(m=>{
    const mine=m.auteur===moi;
    const qui=mine?"Vous":(m.auteur==="lamia"?"Lamia":"Personne anonyme");
    if(m.type==="clause"){
      return `<div class="sout-clause-msg">✍ <b>Engagement de confidentialité signé</b><br>
        <span class="sout-small">par ${esc(m.d?m.d.nom:"Lamia")} le ${esc(fmtQuand(m.d?m.d.signeLe:m.ts))}${m.d?" — code "+esc(prEmpreinteCourte(m.d.empreinte)):""}</span><br>
        ${m.d?`<button class="btn ghost sm" data-action="sout-clause-pdf" data-id="${esc(m.id)}" style="margin-top:8px">📄 Lire / télécharger le PDF</button>`:`<span class="sout-small">Document illisible.</span>`}</div>`;
    }
    if(m.d && m.d.res) return soutFicheRessources(mine, m.ts);
    const txt=m.d&&typeof m.d.t==="string"?esc(m.d.t):`<i>Message illisible</i>`;
    return `<div class="bub ${mine?"me":"them"}"><div style="white-space:pre-wrap;word-break:break-word">${txt}</div><div class="m-meta">🔒 ${qui} · ${esc(fmtQuand(m.ts))}</div></div>`;
  }).join("");
  return html;
}
function soutComposer(placeholder, action, desactive){
  return `<div class="msg-compose sout-compose">

}

  modaleInfo("1. Votre message est verrouillé (chiffré) sur votre téléphone, avant de partir.\n\n2. Il voyage et il est stocké verrouillé : le serveur, le bureau et l'hébergeur ne voient qu'une suite de caractères illisibles.\n\n3. Seule la clé de Lamia, qui ne quitte jamais son appareil, peut l'ouvrir. Lamia ne sait pas qui vous êtes : la conversation n'est liée à aucun compte, seulement à votre code de récupération.\n\nLe code de vérification affiché en haut de la conversation est le même chez vous et chez Lamia : c'est la preuve que personne ne s'interpose.\n\nChaque message s'efface automatiquement 14 jours après son envoi, et une conversation sans activité pendant 14 jours disparaît entièrement."+((S.sout&&S.sout.info&&S.sout.info.engagement_proprio)?"\n\nLe programmeur de l'app a signé un engagement écrit : il n'a pas accès à vos messages et s'engage à ne jamais chercher à vous identifier.":""),"🔒 Comment ça marche ?");
}

document.addEventListener("click", async e=>{
  const el=e.target.closest("[data-action^='sout-']"); if(!el) return;
  const a=el.dataset.action, s=soutEtat();
  try{
    switch(a){
      case "sout-sortie": soutSortie(); break;
      case "sout-aide": soutAide(); break;
      case "sout-vue": s.vue=el.dataset.vue||"accueil"; render(); break;
      case "sout-retour": s.vue="accueil"; s.ouverte=null; s.lamia.ouverte=null; render(); soutRafraichir(); break;
      case "sout-recharger": s.erreur=""; s.charge=false; render(); break;
      case "sout-nouvelle": await soutMembreNouvelle(); break;
      case "sout-retrouver": await soutMembreRetrouver(); break;
      case "sout-ouvrir": await soutMembreOuvrir(el.dataset.t); s.vue="conv"; soutRedessiner(); break;
      case "sout-envoyer": await soutMembreEnvoyer(); break;
      case "sout-code": if(s.ouverte) soutAfficherCode(s.ouverte.token, false); break;
      case "sout-effacer": await soutMembreEffacer(); break;
      case "sout-avis": await soutMembreAvis(Number(el.dataset.v)); break;
      case "sout-clause-pdf": soutTelechargerClause(el.dataset.id); break;
      case "sout-activer": await soutLamiaConfigurer(false); break;
      case "sout-reinit": await soutLamiaConfigurer(true); break;
      case "sout-deverrouiller": await soutLamiaDeverrouiller(); break;
      case "sout-verrouiller": soutLamiaVerrouiller(); break;
      case "sout-l-ouvrir": await soutLamiaOuvrir(el.dataset.id); break;
      case "sout-l-signer": await soutLamiaSigner(); break;
      case "sout-l-repondre": await soutLamiaRepondre(); break;
      case "sout-statut": await soutLamiaStatut(el.dataset.st); break;
      case "sout-stats": await soutLamiaStats(); break;
      case "sout-stats-pdf": soutStatsPDF(); break;
      case "sout-proprio-signer": await soutProprioSigner(); break;
      case "sout-proprio-pdf": soutProprioPDF(); break;
      case "sout-l-ressources": await soutLamiaEnvoyerRessources(); break;
      case "sout-l-bloquer": await soutLamiaBloquer(el.dataset.v==="1"); break;
      case "sout-pause": await soutLamiaPause(Number(el.dataset.h)); break;
    }
  }catch(err){ modaleInfo(err.message||String(err),"Soutien psychologique"); }
});
/* Entrée = envoyer (Maj+Entrée = retour à la ligne) sur ordinateur. */
document.addEventListener("keydown", e=>{
  if(!S.etu && S.tab!=="soutien" && S.tab!=="soutien_etu") return;
  if(e.key==="Escape" && !document.querySelector(".ca-mod")){ soutSortie(); return; }
  if(e.key==="Enter" && !e.shiftKey && e.target && e.target.id==="sout_txt" && !("ontouchstart" in window)){
    e.preventDefault(); const s=S.sout; if(s&&s.info&&s.info.est_lamia) soutLamiaRepondre(); else soutMembreEnvoyer();
  }
});
/* Blocage du copier / couper / coller et du menu contextuel dans l'onglet Soutien. */
["copy","cut","paste","contextmenu","dragstart","drop"].forEach(t=>document.addEventListener(t, e=>{
  const n=e.target&&(e.target.nodeType===3?e.target.parentElement:e.target);
  if(n&&n.closest&&n.closest(".sout-zone")) e.preventDefault();
}, true));
document.addEventListener("selectstart", e=>{
  const n=e.target&&(e.target.nodeType===3?e.target.parentElement:e.target);
  if(n&&n.closest&&n.closest(".sout-zone") && !/^(TEXTAREA|INPUT)$/.test(n.tagName)) e.preventDefault();
}, true);
/* Nouveaux messages : vérification toutes les 15 s quand l'onglet est ouvert. */
setInterval(()=>{ if(document.visibilityState!=="visible") return;
  if((S.session && (S.tab==="soutien"||S.tab==="soutien_etu")) || (S.etu && S.etu.vue==="psy")) soutRafraichir(); }, SOUT_POLL_MS);

   ===================================================================== */
const ETU_BASE="https://bojkuesat-ai.github.io/bureau-ca/";
const ETU_LIENS={general:ETU_BASE+"?soutien", psy:ETU_BASE+"?soutien=psy", social:ETU_BASE+"?soutien=social"};
const SOUT_NOTIF_FN=SB_URL+"/functions/v1/soutien-notif";
const SOUT_RPC_ETU={soutien_info:"etu_psy_info",soutien_creer:"etu_psy_creer",soutien_resume:"etu_psy_resume",
  soutien_ouvrir:"etu_psy_ouvrir",soutien_envoyer:"etu_psy_envoyer",soutien_effacer:"etu_psy_effacer",soutien_avis:"etu_psy_avis"};
/* Client Supabase sans session : l'étudiant n'a pas de compte, et un membre du CA
   qui ouvrirait le lien ne serait pas reconnu non plus. */
function sbAnon(){
  if(!window.__sbAnon && window.supabase && window.supabase.createClient)
    window.__sbAnon=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:"be-anon"}});
  return window.__sbAnon||null;
}
async function etuRpc(fn,args){
  const cli=sbAnon(); if(!cli) throw new Error("Serveur indisponible. Vérifiez votre connexion.");
  const r=await cli.rpc(fn,args||{});
  if(r&&r.error){ const m=String(r.error.message||"Erreur serveur.");
    if(/Could not find the function|does not exist|schema cache/i.test(m)) throw new Error("Cet espace n'est pas encore ouvert. Réessayez plus tard.");
    throw new Error(m); }
  return r?r.data:null;
}
async function cesRpcR(fn,args){ return soutRpcBrut(fn,args); }
async function soutRpcBrut(fn,args){
  if(!sb) throw new Error("Serveur indisponible.");
  const r=await sb.rpc(fn,args||{});
  if(r&&r.error){ const m=String(r.error.message||"Erreur serveur.");
    if(/Could not find the function|does not exist|schema cache/i.test(m)) throw new Error("Cette fonction n'est pas encore installée sur le serveur : le script SQL n°4 doit être exécuté dans Supabase.");
    throw new Error(m); }
  return r?r.data:null;
}

}

/* ---------- Signature manuscrite (doigt ou souris) ---------- */
function modaleSignature(titre, texte){
  return new Promise(resolve=>{
    const anc=document.getElementById("ca_modal_sig"); if(anc) anc.remove();
    const d=document.createElement("div"); d.id="ca_modal_sig"; d.className="ca-mod";
    d.innerHTML='<div class="ca-mod-box" role="dialog" aria-modal="true" style="max-width:520px">'
      +'<h3>'+esc(titre||"Signature")+'</h3><p style="color:var(--ink);font-size:13.5px">'+esc(texte||"Signez dans le cadre blanc, avec le doigt ou la souris.")+'</p>'
      +'<canvas id="sig_cv" style="width:100%;height:190px;background:#fff;border-radius:10px;touch-action:none;display:block;cursor:crosshair"></canvas>'
      +'<p id="sig_err" style="color:var(--red);font-size:13px;margin:8px 0 0;display:none">Signez dans le cadre avant de valider.</p>'
      +'<div class="ca-mod-btns" style="margin-top:12px;flex-wrap:wrap"><button class="btn ghost sm" id="sig_eff">Recommencer</button><button class="btn ghost sm" id="sig_no">Annuler</button><button class="btn sm" id="sig_ok">✍ Valider ma signature</button></div></div>';
    document.body.appendChild(d);
    const cv=d.querySelector("#sig_cv"); const ratio=Math.max(1,window.devicePixelRatio||1);
    const W=cv.clientWidth||460, H=cv.clientHeight||190; cv.width=W*ratio; cv.height=H*ratio;
    const ctx=cv.getContext("2d"); ctx.scale(ratio,ratio); ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#16213e";
    let actif=false, points=0;
    const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
    cv.addEventListener("pointerdown",e=>{ actif=true; const p=pos(e); try{ cv.setPointerCapture(e.pointerId); }catch(_){} ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); });
    cv.addEventListener("pointermove",e=>{ if(!actif) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); points++; e.preventDefault(); });
    const fin=()=>{ actif=false; }; cv.addEventListener("pointerup",fin); cv.addEventListener("pointercancel",fin); cv.addEventListener("pointerleave",fin);
    const rep=v=>{ d.remove(); resolve(v); };
    d.querySelector("#sig_eff").addEventListener("click",()=>{ ctx.clearRect(0,0,W,H); points=0; });
    d.querySelector("#sig_no").addEventListener("click",()=>rep(null));
    d.querySelector("#sig_ok").addEventListener("click",()=>{
      if(points<6){ d.querySelector("#sig_err").style.display="block"; return; }
      /* Image réduite (500 px de large) : légère dans le dossier et dans le PDF. */
      const out=document.createElement("canvas"); out.width=500; out.height=Math.round(500*H/W);
      const o=out.getContext("2d"); o.fillStyle="#fff"; o.fillRect(0,0,out.width,out.height); o.drawImage(cv,0,0,out.width,out.height);
      rep(out.toDataURL("image/png"));
    });
  });
}

async function soutNouvellePhrase(titre){
  const phrase=soutCodeAleatoire(6);

  await attendreFermetureInfo();
  let err="";

function cesIbanNet(s){ return String(s||"").replace(/\s+/g,"").toUpperCase(); }
function cesIbanValide(s){
  const v=cesIbanNet(s); if(!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(v)) return false;
  const r=v.slice(4)+v.slice(0,4); let m=0;
  for(const ch of r){ const n=/[A-Z]/.test(ch)?String(ch.charCodeAt(0)-55):ch; for(const d of n) m=(m*10+Number(d))%97; }
  return m===1;
}
function cesIbanFormat(s){ return (cesIbanNet(s).match(/.{1,4}/g)||[]).join(" "); }
function cesEmailValide(s){ return /^[^@\s]+@ulb\.(be|ac\.be)$/i.test(String(s||"").trim()); }

/* --- Crypto du dossier --- */
async function cesAcces(code, mdp){ return soutHex(await soutSha("be-ces-acces:"+soutNormaliser(code)+"\u0000"+mdp)); }
async function cesCleMdp(code, mdp){
  const base=await crypto.subtle.importKey("raw", soutTE.encode(soutNormaliser(code)+"\u0000"+mdp), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:soutTE.encode("be-ces-v1:"+soutNormaliser(code)), iterations:210000, hash:"SHA-256"}, base, {name:"AES-GCM",length:256}, false, ["encrypt","decrypt"]);
}
async function cesCleDossier(priv, pubAutreJwk, pubEtuJwk){
  const bits=await crypto.subtle.deriveBits({name:"ECDH", public:await soutPub(pubAutreJwk)}, priv, 256);
  const hk=await crypto.subtle.importKey("raw", bits, "HKDF", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"HKDF", hash:"SHA-256", salt:soutTE.encode("be-ces-dossier:"+pubEtuJwk.x), info:soutTE.encode("be-ces-v1")}, hk, {name:"AES-GCM",length:256}, false, ["encrypt","decrypt"]);
}
function cesAad(pubEtu, auteur, type){ return "ces:"+pubEtu.x+":"+auteur+":"+type; }
async function cesChiffrerEl(cle, pubEtu, auteur, type, obj){
  const f=(type==="message"||type==="changement"||type==="profil")?soutChiffrerMsg:soutChiffrer;
  return f(cle, obj, cesAad(pubEtu,auteur,type));
}
async function cesDechiffrerEls(cle, pubEtu, els){
  const out=[];
  for(const e of (els||[])){ let d=null;
    try{ d=await soutDechiffrer(cle, e.iv, e.contenu, cesAad(pubEtu,e.auteur,e.type)); if(d&&typeof d==="object") delete d._; }catch(_){ d=null; }
    out.push({id:e.id, auteur:e.auteur, type:e.type, ts:e.cree_le, d:d}); }
  return out;
}
/* Pièces jointes : chiffrées en un bloc, envoyées par morceaux de 500 000 caractères. */
const CES_PART=500000;
async function cesEnvoyerFichier(fichier, cle, creer, envoyerPart, progres){
  const buf=await fichier.arrayBuffer();
  const ctLen=buf.byteLength+16, b64Len=4*Math.ceil(ctLen/3), parts=Math.ceil(b64Len/CES_PART);
  const fid=await creer(parts, buf.byteLength);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM", iv, additionalData:soutTE.encode("ces-fichier:"+fid)}, cle, buf);
  const b64=soutB64(ct);
  for(let i=0;i<parts;i++){ await envoyerPart(fid, i, b64.slice(i*CES_PART,(i+1)*CES_PART)); if(progres) progres(i+1,parts); }
  return {fichier_id:fid, iv:soutB64(iv), nom:String(fichier.name||"document").slice(0,120), taille:buf.byteLength, mime:typeFichier(fichier)};
}
async function cesLireFichier(doc, meta, cle, lirePart){
  let b64=""; for(let i=0;i<meta.parts;i++){ const p=await lirePart(doc.fichier_id, i); if(p==null) throw new Error("Fichier incomplet."); b64+=p; }
  const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:soutUnB64(doc.iv), additionalData:soutTE.encode("ces-fichier:"+doc.fichier_id)}, cle, soutUnB64(b64));
  return new Blob([pt],{type:doc.mime||"application/octet-stream"});
}
function cesTailleLisible(n){ n=Number(n||0); return n>1048576?(n/1048576).toFixed(1).replace(".",",")+" Mo":Math.max(1,Math.round(n/1024))+" Ko"; }

  if(!p.nom||!p.prenom) e.push("Indiquez votre nom et votre prénom.");

  if(!cesEmailValide(p.email)) e.push("Merci d'utiliser votre adresse ULB (…@ulb.be ou …@ulb.ac.be).");
  if(!p.section) e.push("Choisissez votre section (Droit ou Criminologie).");

async function cesCreerDossier(){
  const c=cesEtat(); const b=c.brouillon; if(c.occupe) return;
  if((document.getElementById("ces_site")||{}).value) return;              /* piège à robots */
  if(Date.now()-(c.debut||0)<15000){ modaleInfo("Merci de prendre le temps de relire votre déclaration avant de signer."); return; }
  if(!(document.getElementById("ces_certifie")||{}).checked){ modaleInfo("Cochez « Je certifie sur l'honneur » pour continuer."); return; }
  const mdp=String(val("ces_mdp")||""), mdp2=String(val("ces_mdp2")||"");
  if(mdp.length<8){ modaleInfo("Le mot de passe doit faire au moins 8 caractères."); return; }
  if(mdp!==mdp2){ modaleInfo("Les deux mots de passe ne correspondent pas."); return; }
  const retenir=!!(document.getElementById("ces_retenir")||{}).checked;
  const sig=await modaleSignature("Signer ma déclaration","Signez dans le cadre blanc avec le doigt ou la souris. Votre signature figurera sur la déclaration (PDF) remise à la CES et à vous.");
  if(!sig) return;
  c.occupe=true;
  try{
    const code=soutCodeAleatoire(4), acces=await cesAcces(code,mdp);
    const paire=await soutPaire();
    const privJwk=await crypto.subtle.exportKey("jwk", paire.privateKey);
    const pubJwk=soutPubJwk(await crypto.subtle.exportKey("jwk", paire.publicKey));
    const env=await soutEnvelopper(await cesCleMdp(code,mdp), privJwk, "ces-etu-priv");
    const K=await cesCleDossier(paire.privateKey, c.info.pub_ces, pubJwk);
    const profil=Object.assign({}, b.profil, {maj:new Date().toISOString()});
    const texte=cesDeclarationTexte(profil);
    const base={v:CES_DECL_VERSION, nom:(profil.prenom+" "+profil.nom).trim(), matricule:profil.matricule, email:profil.email,
      signeLe:new Date().toISOString(), methode:"Mot de passe du dossier + signature manuscrite + case « je certifie »", sigHash:soutHex(await soutSha(sig))};
    const decl=Object.assign({}, base, {texte:texte, signature:sig, certifie:true, empreinte:await cesEmpreinte(base,texte)});
    const eP=await cesChiffrerEl(K,pubJwk,"etu","profil",profil);
    const eD=await cesChiffrerEl(K,pubJwk,"etu","declaration",decl);
    const eM=b.message?await cesChiffrerEl(K,pubJwk,"etu","message",{t:b.message}):{iv:"",ct:""};
    const r=await etuRpc("ces_creer",{p_acces:acces,p_pub:pubJwk,p_priv:env,p_categorie:b.categorie,p_profil_iv:eP.iv,p_profil:eP.ct,p_decl_iv:eD.iv,p_decl:eD.ct,p_msg_iv:eM.iv,p_msg:eM.ct});
    if(retenir){ const l=cesDossiersLocaux(); l.unshift({c:code,n:r.numero}); cesSauverLocaux(l.slice(0,10)); }
    soutNotifServeur("ces");
    c.brouillon=null; c.etape=1; c.occupe=false;
    await cesOuvrirDossier(code, mdp, {privJwk, K, pubJwk});
    modaleInfo("✓ Votre demande est envoyée.\n\nNuméro de dossier : "+r.numero+"\nCode d'accès : "+code+"\n\nNotez ce code avec votre mot de passe : ils sont indispensables pour revenir dans votre dossier. Personne ne peut les retrouver pour vous.\n\nVous pouvez maintenant ajouter vos justificatifs (PDF ou photo) dans l'onglet « Documents ».","Demande envoyée");
  }catch(e){ c.occupe=false; modaleInfo("La demande n'a pas pu être envoyée : "+(e.message||e)); }
}

/* --- Ouverture et vue du dossier (étudiant) --- */
async function cesOuvrirDossier(code, mdp, cache){
  const c=cesEtat();
  const acces=await cesAcces(code,mdp);
  const d=await etuRpc("ces_ouvrir",{p_acces:acces});
  let privJwk=cache&&cache.privJwk, K=cache&&cache.K;
  if(!K){
    try{ privJwk=await soutDesenvelopper(await cesCleMdp(code,mdp), d.priv_etu_chiffree, "ces-etu-priv"); }
    catch(e){ throw new Error("Mot de passe incorrect."); }
    K=await cesCleDossier(await soutPriv(privJwk), c.info.pub_ces, d.pub_etu);
  }
  const els=await cesDechiffrerEls(K, d.pub_etu, d.elements);
  const profils=els.filter(e=>e.type==="profil"&&e.d);
  c.ouvert={code, mdp, acces, privJwk, K, id:d.id, numero:d.numero, pubEtu:d.pub_etu, categorie:d.categorie, statut:d.statut, decision:d.decision,
    archive_le:d.archive_le, suppression_le:d.suppression_le, bloque_le:d.bloque_le, els, fichiers:d.fichiers||[], rdv:d.rdv||[],
    profil:profils.length?profils[profils.length-1].d:{}};
  c.vue="dossier";
  cesRedessiner();
}
async function cesRafraichirEtu(){
  const c=S.ces; if(!c||!c.ouvert||c.occupe) return;
  try{ const o=c.ouvert; const avant=JSON.stringify([o.els.length,o.statut,o.fichiers.length,o.rdv.length]);
    await cesOuvrirDossier(o.code,o.mdp,{privJwk:o.privJwk,K:o.K});
    const n=c.ouvert; if(avant!==JSON.stringify([n.els.length,n.statut,n.fichiers.length,n.rdv.length])) cesRedessiner(); }catch(e){}
}

function cesFil(els, moi){
  const lab={profil:"Profil mis à jour",changement:"Changement de situation signalé",declaration:"Déclaration sur l'honneur signée",engagement:"Engagement de confidentialité signé par la CES",decision:"Décision rendue",document:"Document ajouté"};

    const mine=e.auteur===moi, qui=e.auteur==="etu"?(moi==="etu"?"Vous":"Étudiant·e"):(moi==="ces"?"Vous":"CES");
    if(e.type==="message") return `<div class="bub ${mine?"me":"them"}"><div style="white-space:pre-wrap;word-break:break-word">${esc(e.d.t||"")}</div><div class="m-meta">🔒 ${qui} · ${esc(fmtQuand(e.ts))}</div></div>`;
    if(e.type==="changement") return `<div class="sout-clause-msg">🔔 <b>Changement de situation</b><div style="white-space:pre-wrap;text-align:left;margin-top:4px">${esc(e.d.t||"")}</div><span class="sout-small">${qui} · ${esc(fmtQuand(e.ts))}</span></div>`;
    if(e.type==="profil" && e.d.changements && e.d.changements.length) return `<div class="ces-evt">✎ Profil modifié : ${esc(e.d.changements.join(", "))} — ${esc(fmtQuand(e.ts))}</div>`;
    if(e.type==="profil") return "";

async function cesFichierChoisi(input, moi){

  if(f.size>5*1024*1024){ modaleInfo("Fichier trop lourd : 5 Mo maximum."); return; }
  const prog=(i,n)=>{ const el=document.getElementById("ces_prog"); if(el) el.textContent=" Envoi chiffré… "+Math.round(100*i/n)+" %"; };
  if(moi==="etu"){

        (fid,i,data)=>etuRpc("ces_fichier_part",{p_acces:o.acces,p_fichier:fid,p_idx:i,p_data:data}), prog);
      c.occupe=false; await cesEtuAjouter("document", meta); modaleInfo("✓ Document ajouté à votre dossier."); }
    catch(e){ c.occupe=false; modaleInfo("Envoi impossible : "+(e.message||e)); }

    const r=S.cesR, o=r.ouvert; r.occupe=true;
    try{ const meta=await cesEnvoyerFichier(f, o.K,
        (parts,taille)=>cesRpcR("ces_resp_fichier_creer",{p_id:o.id,p_parts:parts,p_taille:taille}),
        (fid,i,data)=>cesRpcR("ces_resp_fichier_part",{p_id:o.id,p_fichier:fid,p_idx:i,p_data:data}), prog);
      r.occupe=false; await cesRAjouter("document", meta); cesNotifEtudiant(o); modaleInfo("✓ Document envoyé à l'étudiant·e."); }
    catch(e){ r.occupe=false; modaleInfo("Envoi impossible : "+(e.message||e)); }
  }
}

function cesREtat(){ const uidMe=(S.session&&S.session.id)||null;
  if(!S.cesR||S.cesR.uid!==uidMe) S.cesR={uid:uidMe, info:null, cle:null, privJwk:null, liste:[], ouvert:null, vue:"accueil", recherche:"", filtre:"ouverts", creneaux:[], stats:null, charge:false, chargement:false, erreur:"", occupe:false, cles:{}};
  return S.cesR; }
function cesRCleLocale(){ return "ces:resp:"+((S.session&&S.session.id)||""); }
function cesNonLus(){ const r=S.cesR; if(!r||!r.info||!r.info.est_resp) return 0; return (r.liste||[]).filter(d=>d.non_lu).length; }
function cesOngletVisible(){ const r=S.cesR; return !!(r&&r.info&&(r.info.est_resp||r.info.est_successeur||r.info.est_owner)); }
async function loadCes(){
  try{ const r=cesREtat(); if(!S.session) return; r.info=await cesRpcR("ces_resp_info");
    if(r.info.est_resp){ r.liste=(await cesRpcR("ces_resp_liste"))||[]; } }catch(e){}
}
async function cesRCharger(){
  const r=cesREtat(); if(r.chargement||!S.session) return; r.chargement=true;
  try{ r.info=await cesRpcR("ces_resp_info");
    if(r.info.est_resp){ await cesRCleLocaleCharger(); await cesRListe(); }
    r.charge=true; r.erreur=""; }catch(e){ r.erreur=e.message||String(e); }
  r.chargement=false; cesRedessiner();
}
async function cesRCleLocaleCharger(){
  const r=S.cesR; if(r.cle||!r.info.pub_ces) return;
  const jwk=store.get(cesRCleLocale(),null); if(!jwk) return;
  if(jwk.x!==r.info.pub_ces.x){ store.set(cesRCleLocale(),null); return; }
  try{ r.cle=await soutPriv(jwk); r.privJwk=jwk; }catch(e){ store.set(cesRCleLocale(),null); }
}
async function cesRListe(){
  const r=S.cesR; r.liste=(await cesRpcR("ces_resp_liste"))||[];
  if(!r.cle) return;
  for(const d of r.liste){
    try{ if(!r.cles[d.id]) r.cles[d.id]=await cesCleDossier(r.cle, d.pub_etu, d.pub_etu);
      d.p=d.profil?await soutDechiffrer(r.cles[d.id], d.profil.iv, d.profil.contenu, cesAad(d.pub_etu,"etu","profil")):{}; if(d.p) delete d.p._; }catch(e){ d.p={}; }
  }
}
function cesNomP(p){ return ((p&&p.prenom||"")+" "+(p&&p.nom||"")).trim()||"(nom illisible)"; }
function cesDejaConnus(d){
  const r=S.cesR, p=d.p||{}; const mat=String(p.matricule||"").toLowerCase(), nom=cesNomP(p).toLowerCase();
  return (r.liste||[]).filter(x=>x.id!==d.id && x.p && ((mat && String(x.p.matricule||"").toLowerCase()===mat) || (nom.length>3 && cesNomP(x.p).toLowerCase()===nom)));

async function cesRActiver(){
  const r=S.cesR;
  if(!(await modaleConfirm("Activer l'aide sociale ?\n\nUne phrase de récupération va s'afficher : notez-la sur papier. Elle protège tous les dossiers et devra être conservée en lieu sûr.","Activer"))) return;
  const phrase=await soutNouvellePhrase(); if(!phrase) return;
  try{ const sel=soutB64(crypto.getRandomValues(new Uint8Array(16)));
    const paire=await soutPaire(); const privJwk=await crypto.subtle.exportKey("jwk",paire.privateKey); const pubJwk=soutPubJwk(await crypto.subtle.exportKey("jwk",paire.publicKey));
    await cesRpcR("ces_resp_init",{p_pub:pubJwk,p_priv:await soutEnvelopper(await soutClePhrase(phrase,sel),privJwk,"ces-priv"),p_sel:sel,p_reinit:false});
    store.set(cesRCleLocale(),privJwk); r.charge=false; r.cle=null; await cesRCharger();
    modaleInfo("✓ L'aide sociale est activée. Les étudiant·es peuvent maintenant déposer une demande.");
  }catch(e){ modaleInfo("Activation impossible : "+(e.message||e)); }
}
async function cesRDeverrouiller(){
  const r=S.cesR; let err="";
  for(let i=0;i<5;i++){

    if(v===null) return;
    try{ const privJwk=await soutDesenvelopper(await soutClePhrase(v,r.info.sel), r.info.priv_ces_chiffree, "ces-priv");
      store.set(cesRCleLocale(),privJwk); r.cle=await soutPriv(privJwk); r.privJwk=privJwk; await cesRListe(); cesRedessiner(); return;
    }catch(e){ err="Phrase incorrecte."; }
  }
}
async function cesRChangerPhrase(){

async function cesRPassation(){

document.addEventListener("click", async e=>{
  const el=e.target.closest("[data-action^='etu-'],[data-action^='ces-'],[data-action^='cesr-']"); if(!el) return;
  const a=el.dataset.action;
  try{ switch(a){
    case "etu-vue": S.etu.vue=el.dataset.vue; if(S.ces) S.ces.vue="accueil"; render(); window.scrollTo(0,0); break;
    case "etu-sortie": etuSortie(); break;
    case "etu-partage": etuModalePartage(); break;
    case "etu-bilan": await cesBilanAfficher(); break;
    /* étudiant */
    case "ces-recharger": { const c=cesEtat(); c.erreur=""; c.charge=false; render(); break; }
    case "ces-vue": { const c=cesEtat(); c.vue=el.dataset.vue; render(); window.scrollTo(0,0); break; }
    case "ces-nouvelle": { const c=cesEtat(); c.vue="creer"; c.etape=1; c.brouillon={categorie:"",profil:{},message:""}; render(); window.scrollTo(0,0); break; }
    case "ces-cat": { const c=S.ces; c.brouillon.categorie=el.dataset.cat; c.etape=2; render(); window.scrollTo(0,0); break; }
    case "ces-etape": { const c=S.ces; if(c.etape===2) c.brouillon.profil=cesLireProfil().p; if(c.etape===3) c.brouillon.message=String(val("ces_msg")||""); c.etape=Number(el.dataset.e); render(); break; }
    case "ces-profil-ok": { const c=S.ces; const r=cesLireProfil(); c.brouillon.profil=r.p; if(r.erreurs.length){ modaleInfo(r.erreurs.join("\n"),"À corriger"); break; } c.etape=3; render(); window.scrollTo(0,0); break; }
    case "ces-msg-ok": { const c=S.ces; const m=String(val("ces_msg")||"").trim(); if(m.length<10){ modaleInfo("Décrivez votre demande en quelques phrases."); break; } c.brouillon.message=m; c.etape=4; c.debut=Date.now(); render(); window.scrollTo(0,0); break; }
    case "ces-signer": await cesCreerDossier(); break;
    case "ces-login": { const sel=document.getElementById("ces_login_code"); let code=(sel&&sel.value)||String(val("ces_login_code_txt")||"");
      if(sel && !sel.value){ const t=document.getElementById("ces_login_code_txt"); if(t&&t.style.display==="none"){ t.style.display=""; t.focus(); break; } code=String(val("ces_login_code_txt")||""); }
      code=soutNormaliser(code); const mdp=String(val("ces_login_mdp")||"");
      if(code.replace(/-/g,"").length<16||!mdp){ modaleInfo("Saisissez le code de votre dossier et votre mot de passe."); break; }
      await cesOuvrirDossier(code,mdp);
      const l=cesDossiersLocaux(); if(!l.some(x=>soutNormaliser(x.c)===code) && await modaleConfirm("Mémoriser le numéro de ce dossier sur cet appareil ? (jamais le mot de passe)","Mémoriser")){ l.unshift({c:code,n:S.ces.ouvert.numero}); cesSauverLocaux(l.slice(0,10)); }
      break; }
    case "ces-fermer": { const c=S.ces; c.ouvert=null; c.vue="accueil"; render(); break; }
    case "ces-onglet": { const c=S.ces; c.onglet=el.dataset.o; c.creneauxCharges=false; render(); break; }
    case "ces-envoyer": { const t=String(val("ces_txt")||"").trim(); if(!t) break; await cesEtuAjouter("message",{t}); const f=document.getElementById("ces_txt"); if(f) f.value=""; break; }
    case "ces-changement": { const t=String(val("ces_chg")||"").trim(); if(t.length<5){ modaleInfo("Décrivez le changement."); break; } await cesEtuAjouter("changement",{t}); modaleInfo("✓ Changement signalé à la CES."); break; }
    case "ces-profil-maj": { const o=S.ces.ouvert; const r=cesLireProfil(); if(r.erreurs.length){ modaleInfo(r.erreurs.join("\n"),"À corriger"); break; }
      const ch=cesChangements(o.profil, r.p); if(!ch.length){ modaleInfo("Aucune modification."); break; }
      if(!(await modaleConfirm("Enregistrer ces modifications ?\n\n"+ch.join(", ")+"\n\nElles seront visibles, datées, par la CES.","Mettre à jour mon profil"))) break;
      await cesEtuAjouter("profil", Object.assign({}, r.p, {maj:new Date().toISOString(), changements:ch})); modaleInfo("✓ Profil mis à jour."); break; }
    case "ces-mdp": { const o=S.ces.ouvert;
      const ancien=await modaleChamp("Mot de passe actuel","Changer mon mot de passe",{type:"password"}); if(ancien===null) break;
      if(ancien!==o.mdp){ modaleInfo("Mot de passe actuel incorrect."); break; }
      const n1=await modaleChamp("Nouveau mot de passe (8 caractères minimum)","Changer mon mot de passe",{type:"password"}); if(n1===null) break;
      if(n1.length<8){ modaleInfo("8 caractères minimum."); break; }
      const n2=await modaleChamp("Confirmez le nouveau mot de passe","Changer mon mot de passe",{type:"password"}); if(n2!==n1){ modaleInfo("Les mots de passe ne correspondent pas."); break; }
      await etuRpc("ces_changer_acces",{p_acces:o.acces,p_acces_nouveau:await cesAcces(o.code,n1),p_priv:await soutEnvelopper(await cesCleMdp(o.code,n1),o.privJwk,"ces-etu-priv")});
      o.mdp=n1; o.acces=await cesAcces(o.code,n1); modaleInfo("✓ Mot de passe changé."); break; }
    case "ces-pdf": cesTelechargerPDFEl(S.ces.ouvert, el.dataset.id); break;
    case "ces-doc-lire": { const o=S.ces.ouvert; await cesOuvrirDoc(o, el.dataset.id, (fid,i)=>etuRpc("ces_fichier_lire",{p_acces:o.acces,p_fichier:fid,p_idx:i})); break; }
    case "ces-rdv-prendre": { const o=S.ces.ouvert; const c=(S.ces.creneaux||[]).find(x=>x.id===el.dataset.id);
      if(!(await modaleConfirm("Réserver ce rendez-vous ?\n\n"+(c?fmtQuand(c.debut)+" — "+c.lieu:""),"Rendez-vous"))) break;
      await etuRpc("ces_reserver",{p_acces:o.acces,p_creneau:el.dataset.id}); soutNotifServeur("ces"); S.ces.creneauxCharges=false;
      await cesOuvrirDossier(o.code,o.mdp,{privJwk:o.privJwk,K:o.K}); modaleInfo("✓ Rendez-vous réservé."); break; }
    case "ces-rdv-annuler": { const o=S.ces.ouvert; if(!(await modaleConfirm("Annuler ce rendez-vous ?","Rendez-vous"))) break;
      await etuRpc("ces_annuler_rdv",{p_acces:o.acces,p_creneau:el.dataset.id}); soutNotifServeur("ces"); S.ces.creneauxCharges=false;
      await cesOuvrirDossier(o.code,o.mdp,{privJwk:o.privJwk,K:o.K}); break; }
    /* responsable */
    case "cesr-recharger": { const r=cesREtat(); r.erreur=""; r.charge=false; render(); break; }
    case "cesr-activer": await cesRActiver(); break;
    case "cesr-deverrouiller": await cesRDeverrouiller(); break;
    case "cesr-verrouiller": { const r=S.cesR; store.set(cesRCleLocale(),null); r.cle=null; r.privJwk=null; r.cles={}; r.ouvert=null; r.vue="accueil"; render(); break; }
    case "cesr-phrase": await cesRChangerPhrase(); break;
    case "cesr-passation": await cesRPassation(); break;
    case "cesr-passation-recevoir": await cesRPassationRecevoir(); break;
    case "cesr-passation-annuler": { if(!(await modaleConfirm("Annuler la passation en cours ?","Passation"))) break; await cesRpcR("ces_passation_annuler"); S.cesR.info=await cesRpcR("ces_resp_info"); render(); break; }
    case "cesr-owner-designer": await cesROwnerDesigner(); break;
    case "cesr-vue": { const r=S.cesR; r.vue=el.dataset.vue; r.creneauxCharges=false; render(); break; }
    case "cesr-filtre": { S.cesR.filtre=el.dataset.f; render(); break; }
    case "cesr-ouvrir": { S.cesR.decisionForm=false; await cesROuvrir(el.dataset.id); break; }
    case "cesr-retour": { const r=S.cesR; r.ouvert=null; r.vue="accueil"; await cesRListe().catch(()=>{}); render(); break; }
    case "cesr-onglet": { S.cesR.ouvert.onglet=el.dataset.o; render(); break; }
    case "cesr-engagement": await cesRSignerEngagement(); break;
    case "cesr-envoyer": { const t=String(val("cesr_txt")||"").trim(); if(!t) break; await cesRAjouter("message",{t}); cesNotifEtudiant(S.cesR.ouvert); const f=document.getElementById("cesr_txt"); if(f) f.value=""; break; }
    case "cesr-decision-form": { S.cesR.decisionForm=true; render(); break; }
    case "cesr-decision-annuler": { S.cesR.decisionForm=false; render(); break; }
    case "cesr-decision": await cesRRendreDecision(); break;
    case "cesr-statut": { const r=S.cesR, o=r.ouvert, s=el.dataset.s;
      const q=s==="archive"?"Archiver le dossier "+o.numero+" ?\n\nIl passera en lecture seule et sera supprimé automatiquement dans 5 ans. Vous pourrez le rouvrir.":s==="rouvrir"?"Rouvrir le dossier "+o.numero+" ?":"Passer le dossier "+o.numero+" en « cours d'examen » ?";
      if(!(await modaleConfirm(q,"Dossier"))) break;
      await cesRpcR("ces_resp_statut",{p_id:o.id,p_statut:s}); await cesROuvrir(o.id,true); await cesRListe(); render(); if(s!=="rouvrir") cesNotifEtudiant(r.ouvert); break; }
    case "cesr-bloquer": { const r=S.cesR, o=r.ouvert, b=el.dataset.v==="1";
      if(!(await modaleConfirm(b?"Bloquer ce dossier ? L'étudiant·e ne pourra plus rien y ajouter.":"Débloquer ce dossier ?","Dossier"))) break;
      await cesRpcR("ces_resp_bloquer",{p_id:o.id,p_bloquer:b}); await cesROuvrir(o.id,true); render(); break; }
    case "cesr-pdf": cesTelechargerPDFEl(S.cesR.ouvert, el.dataset.id); break;
    case "cesr-doc-lire": { const o=S.cesR.ouvert; await cesOuvrirDoc(o, el.dataset.id, (fid,i)=>cesRpcR("ces_resp_fichier_lire",{p_id:o.id,p_fichier:fid,p_idx:i})); break; }
    case "cesr-creneau-creer": { const d=val("cesr_c_date"), h=val("cesr_c_heure"), du=Number(val("cesr_c_duree")||30), lieu=String(val("cesr_c_lieu")||"").trim();
      if(!d||!h||lieu.length<2){ modaleInfo("Indiquez la date, l'heure et le lieu."); break; }
      const debut=new Date(d+"T"+h); if(isNaN(debut)||debut<new Date()){ modaleInfo("Choisissez une date à venir."); break; }
      await cesRpcR("ces_resp_creneau_creer",{p_debut:debut.toISOString(),p_fin:new Date(debut.getTime()+du*60000).toISOString(),p_lieu:lieu});
      S.cesR.creneauxCharges=false; render(); break; }
    case "cesr-creneau-suppr": { const r=S.cesR; const c=(r.creneaux||[]).find(x=>x.id===el.dataset.id);
      if(!(await modaleConfirm(c&&c.numero?"Ce créneau est réservé (dossier "+c.numero+"). Le supprimer ? L'étudiant·e sera prévenu·e par e-mail.":"Supprimer ce créneau ?","Créneau"))) break;
      await cesRpcR("ces_resp_creneau_suppr",{p_creneau:el.dataset.id});
      if(c&&c.dossier_id){ const d=(r.liste||[]).find(x=>x.id===c.dossier_id); if(d&&d.p) cesNotifEtudiant({profil:d.p}); }
      r.creneauxCharges=false; render(); break; }
    case "cesr-stats": { const r=S.cesR; r.stats=await cesRpcR("ces_resp_stats"); r.vue="stats"; render(); break; }
    case "cesr-pause": { const h=Number(el.dataset.h); if(h>0 && !(await modaleConfirm("Mettre en pause les nouvelles demandes ? Les dossiers en cours continuent normalement.","Pause"))) break;
      await cesRpcR("ces_resp_pause",{p_jusqua:h>0?new Date(Date.now()+h*3600000).toISOString():null}); S.cesR.info=await cesRpcR("ces_resp_info"); render(); break; }
  } }catch(err){ const c=S.ces, r=S.cesR; if(c) c.occupe=false; if(r) r.occupe=false; modaleInfo(err.message||String(err)); }
});
document.addEventListener("change", e=>{
  const t=e.target; if(!t||!t.dataset) return;
  if(t.dataset.change==="ces-doc") cesFichierChoisi(t,"etu");
  else if(t.dataset.change==="cesr-doc") cesFichierChoisi(t,"ces");
  else if(t.id==="ces_login_code"){ const x=document.getElementById("ces_login_code_txt"); if(x) x.style.display=t.value?"none":""; }
});
document.addEventListener("input", e=>{
  const t=e.target; if(t&&t.id==="cesr_q"){ S.cesR.recherche=t.value; clearTimeout(window.__cesQ); window.__cesQ=setTimeout(()=>{ rendreEnPreservant(); const f=document.getElementById("cesr_q"); if(f){ f.focus(); try{ f.setSelectionRange(f.value.length,f.value.length); }catch(_){} } },250); }
});
/* Rafraîchissement : nouveaux éléments toutes les 20 s quand un dossier est ouvert. */
setInterval(()=>{
  if(document.visibilityState!=="visible") return;
  if(S.etu && S.etu.vue==="social" && S.ces && S.ces.ouvert) cesRafraichirEtu();
  else if(S.session && S.tab==="soutien_ces" && S.cesR && S.cesR.cle && !S.cesR.occupe){
    const r=S.cesR; const avant=JSON.stringify((r.liste||[]).map(d=>[d.id,d.non_lu,d.statut]))+(r.ouvert?r.ouvert.els.length:"");
    (async()=>{ try{ await cesRListe(); if(r.ouvert) await cesROuvrir(r.ouvert.id,true);
      if(avant!==JSON.stringify((r.liste||[]).map(d=>[d.id,d.non_lu,d.statut]))+(r.ouvert?r.ouvert.els.length:"")) rendreEnPreservant(); }catch(e){} })();
  }
}, 20000);

boot();

</script>
<script>
if("serviceWorker" in navigator){ window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
</script>
